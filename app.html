<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老板健康</title>
<style>
:root{
  --bg:#F7F9FC; --card:#FFFFFF; --line:#E8EEF5; --line2:#EEF2F7;
  --ink:#0F1B2D; --ink2:#5A6B80; --ink3:#94A3B5;
  --blue:#1E6FFF; --blue-bg:#EDF3FF;
  --good:#C8102E; --mid:#1E6FFF; --bad:#1A1A1A;
  --warn:#F5A623; --warn-bg:#FEF5E7;
  --red:#C8102E; --red-bg:#FDECEC;
  --gray-bg:#F2F5FA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#E9EEF5;min-height:100vh;display:flex;align-items:center;
  justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  color:var(--ink);padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;
  border:1px solid #D5DEE8;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(15,27,45,.18),0 0 0 8px #fff,0 0 0 10px #D5DEE8;
  position:relative}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;
  background:var(--bg);z-index:10}
.statusbar .r{font-size:12px;color:var(--ink2);font-weight:500}
.screen{flex:1;overflow-y:auto;padding:0 20px 100px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

.tabbar{position:absolute;bottom:0;left:0;right:0;height:78px;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:16px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:10px;color:var(--ink3);cursor:pointer;font-weight:500;letter-spacing:.3px}
.tab svg{width:22px;height:22px;stroke:var(--ink3);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.tab.active{color:var(--blue)}
.tab.active svg{stroke:var(--blue);stroke-width:1.9}

.hd{padding:8px 2px 20px}
.hd-date{font-size:12.5px;color:var(--ink3);letter-spacing:.5px}
.hd-title{font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-.3px;line-height:1.2}

.sec{font-size:13px;font-weight:600;color:var(--ink2);margin:24px 2px 12px;
  display:flex;align-items:center;justify-content:space-between}
.sec .more{font-size:12px;color:var(--ink3);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:12px}

.score{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;margin-bottom:14px;display:flex;align-items:center;gap:20px}
.score-ring{width:88px;height:88px;position:relative;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.score-ring-txt b{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.5px}
.score-ring-txt i{font-size:9.5px;color:var(--ink3);font-style:normal;margin-top:4px}
.score-info h3{font-size:15px;font-weight:600;margin-bottom:6px}
.score-info p{font-size:12.5px;color:var(--ink2);line-height:1.6}
.score-tag{display:inline-block;font-size:11px;color:var(--good);background:#FDECEC;
  padding:3px 9px;border-radius:20px;margin-top:8px;font-weight:600}

.g9-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g9{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 11px;cursor:pointer;position:relative;transition:.15s}
.g9:active{transform:scale(.96);background:#FAFCFF}
.g9-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.g9-name{font-size:11.5px;color:var(--ink3);font-weight:500}
.g9-dot{width:5px;height:5px;border-radius:50%;background:#D5DEE8;flex-shrink:0;transition:.2s}
.g9-dot.full{background:var(--good)}
.g9-dot.partial{background:var(--mid)}
.g9-main{display:flex;align-items:baseline;gap:6px}
.g9-grade{font-size:24px;font-weight:700;line-height:1;letter-spacing:-1px}
.g9-score{font-size:12px;color:var(--ink3);font-weight:500;margin-left:auto}
.g9-bar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:10px}
.g9-bar span{display:block;height:100%;border-radius:2px;transition:width .6s}

.btn-row{display:flex;gap:10px;margin-bottom:14px}
.btn-3{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 8px;cursor:pointer;text-align:center;transition:.15s}
.btn-3:active{background:#FAFCFF;transform:scale(.97)}
.btn-3-ico{font-size:18px;font-weight:700;color:var(--good);margin-bottom:8px}
.btn-3-t{font-size:13.5px;font-weight:600;color:var(--ink)}
.btn-3-s{font-size:11px;color:var(--ink3);margin-top:4px}

.life{background:linear-gradient(150deg,#0F1B2D,#1A2D47);border-radius:20px;
  padding:24px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.life::before{content:'';position:absolute;top:-60px;right:-50px;width:180px;height:180px;
  border-radius:50%;background:rgba(200,16,46,.18)}
.life-tag{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px;font-weight:600;position:relative}
.life-title{font-size:18px;font-weight:700;color:#fff;margin-top:12px;letter-spacing:-.2px;position:relative}
.life-rows{margin-top:20px;display:flex;flex-direction:column;gap:8px;position:relative}
.life-row{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-radius:13px;background:rgba(255,255,255,.05)}
.life-row.mine{background:rgba(200,16,46,.18);border:1px solid rgba(200,16,46,.4)}
.life-row-lb{font-size:12.5px;color:rgba(255,255,255,.6)}
.life-row.mine .life-row-lb{color:rgba(255,255,255,.9);font-weight:500}
.life-row-val{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.6px;
  display:flex;align-items:baseline;gap:3px}
.life-row-val small{font-size:12px;color:rgba(255,255,255,.5);font-weight:500}
.life-row.mine .life-row-val{color:#FF5C5C}
.life-concl{margin-top:18px;padding:14px 16px;background:rgba(255,255,255,.05);
  border-radius:12px;font-size:13.5px;color:rgba(255,255,255,.9);line-height:1.7;position:relative}
.life-concl b{color:#FF5C5C;font-weight:700}

/* 健康资产：只展示各项，无总分 */
.asset{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px;margin-bottom:14px}
.asset-rows{display:flex;flex-direction:column;gap:16px}
.asset-row{display:flex;align-items:center;gap:12px}
.asset-row-nm{font-size:15px;color:var(--ink);font-weight:700;width:24px;flex-shrink:0}
.asset-row-sub{font-size:11.5px;color:var(--ink3);width:60px;flex-shrink:0}
.asset-row-bar{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.asset-row-fill{height:100%;border-radius:3px;transition:width .6s}
.asset-row-val{font-size:15px;font-weight:700;width:32px;text-align:right;flex-shrink:0}

.lever{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;position:relative;overflow:hidden;margin-bottom:14px}
.lever::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--mid)}
.lever-tag{font-size:10.5px;color:var(--mid);background:var(--blue-bg);
  padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:.8px;display:inline-block}
.lever-title{font-size:18px;font-weight:600;margin-top:12px;letter-spacing:-.2px}
.lever-metric{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 12px}
.lever-metric-nm{font-size:12.5px;color:var(--ink2)}
.lever-metric-val{font-size:28px;font-weight:700;letter-spacing:-.8px}
.lever-metric-val span{font-size:12px;color:var(--ink3);font-weight:500;margin-left:3px}
.spark{width:100%;height:80px;display:block}
.lever-foot{display:flex;justify-content:space-between;font-size:10.5px;
  color:var(--ink3);margin-top:8px;margin-bottom:16px}
.lever-change{display:flex;justify-content:space-between;font-size:13px;
  padding:12px 0;border-top:1px solid var(--line2)}
.lever-change-lb{color:var(--ink2)}
.lever-change-val{font-weight:700}

.pdca{display:flex;flex-direction:column;gap:12px;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--line2)}
.pdca-row{display:flex;gap:12px;align-items:flex-start}
.pdca-step{width:22px;height:22px;border-radius:50%;background:var(--blue-bg);
  color:var(--mid);font-size:11px;font-weight:700;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px}
.pdca-body{flex:1;min-width:0}
.pdca-t{font-size:13.5px;color:var(--ink);font-weight:500}
.pdca-s{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.5}

.practice{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:.15s}
.practice:active{background:#FAFCFF}
.practice-ico{width:40px;height:40px;border-radius:12px;background:#FDECEC;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--good);
  flex-shrink:0;font-weight:600}
.practice-t{font-size:14px;font-weight:600;color:var(--ink)}
.practice-s{font-size:11.5px;color:var(--ink3);margin-top:4px}
.practice-add{margin-left:auto;font-size:12px;color:var(--good);font-weight:600;
  padding:5px 12px;background:#FDECEC;border-radius:20px}

.mgr-row{display:flex;align-items:center;gap:14px;padding:16px 0;
  border-bottom:1px solid var(--line2);cursor:pointer}
.mgr-row:last-child{border-bottom:none}
.mgr-row-ico{width:36px;height:36px;border-radius:11px;background:var(--gray-bg);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);
  flex-shrink:0;font-weight:600}
.mgr-row-main{flex:1;min-width:0}
.mgr-row-t{font-size:14px;color:var(--ink);font-weight:500}
.mgr-row-s{font-size:11.5px;color:var(--ink3);margin-top:4px}
.mgr-row-val{font-size:13px;font-weight:600;color:var(--good)}

.streak{background:linear-gradient(135deg,#C8102E,#8B0000);border-radius:18px;
  padding:24px;color:#fff;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.streak::before{content:'';position:absolute;top:-60px;right:-40px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.streak-num{font-size:48px;font-weight:700;line-height:1;letter-spacing:-1.5px;position:relative}
.streak-num small{font-size:15px;font-weight:500;color:rgba(255,255,255,.7);margin-left:4px}
.streak-lb{font-size:13px;color:rgba(255,255,255,.8);margin-top:10px;position:relative}
.cal{display:flex;gap:6px;margin-top:18px;position:relative}
.cal-day{flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:11px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.cal-day.on{background:#fff;color:var(--good);font-weight:700}
.cal-day.today{background:rgba(255,255,255,.2);color:#fff;font-weight:700}

.modal{position:fixed;inset:0;background:rgba(15,27,45,.45);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:99}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:#fff;
  border-radius:26px 26px 0 0;padding:24px 22px 100px;position:relative;
  animation:up .3s cubic-bezier(.2,.9,.3,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sh-head{margin-bottom:20px}
.sh-title-row{display:flex;align-items:flex-start;justify-content:space-between}
.sh-name{font-size:19px;font-weight:600}
.sh-date{font-size:12.5px;color:var(--ink3);margin-top:6px;letter-spacing:.3px}
.sh-x{width:30px;height:30px;border-radius:50%;background:#F2F5FA;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.sh-btn{margin-top:20px;background:var(--mid);color:#fff;font-size:15px;font-weight:600;
  text-align:center;padding:15px;border-radius:14px;cursor:pointer}
.sh-btn.disabled{background:#E8EEF5;color:var(--ink3);cursor:not-allowed}
.sh-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500}

.voice-bar{position:absolute;bottom:0;left:0;right:0;background:#fff;
  border-top:1px solid var(--line);padding:14px 22px 22px;
  border-radius:0 0 26px 26px;display:flex;align-items:center;gap:12px;z-index:5}
.voice-btn{flex:1;background:linear-gradient(135deg,#1E6FFF,#0D4FD6);color:#fff;
  border-radius:14px;padding:14px;text-align:center;font-size:14.5px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.voice-btn:active{transform:scale(.98)}
.voice-icon{width:20px;height:20px;flex-shrink:0}
.voice-hint{font-size:11px;color:var(--ink3);flex-shrink:0}

.obj-block{background:var(--gray-bg);border-radius:12px;padding:16px;margin-bottom:22px}
.obj-label{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:12px}
.obj-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0}
.obj-row:first-of-type{padding-top:0}
.obj-row:last-child{padding-bottom:0}
.obj-nm{font-size:13.5px;color:var(--ink2)}
.obj-val{font-size:16px;font-weight:700;letter-spacing:-.3px}
.obj-val span{font-size:11px;color:var(--ink3);font-weight:500;margin-left:2px}
.obj-input{width:80px;text-align:right;padding:6px 10px;border:1.5px solid var(--line);
  border-radius:8px;font-size:14px;font-family:inherit;font-weight:700;color:var(--ink);
  outline:none;background:#fff}
.obj-input:focus{border-color:var(--mid)}

.subj-label{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:14px}
.rec-item{margin-bottom:20px}
.rec-item:last-child{margin-bottom:0}
.rec-label{font-size:14px;color:var(--ink);font-weight:500;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between}
.rec-label small{font-size:10.5px;color:var(--ink3);font-weight:400}
.rec-opts{display:flex;flex-wrap:wrap;gap:8px}
.rec-opt{padding:10px 16px;border-radius:11px;background:var(--gray-bg);
  font-size:13.5px;color:var(--ink2);cursor:pointer;transition:.15s}
.rec-opt.on{background:var(--blue-bg);color:var(--mid);font-weight:600}
.rec-note{width:100%;margin-top:10px;padding:11px 14px;border-radius:11px;
  background:var(--gray-bg);border:1.5px solid transparent;font-size:13.5px;
  font-family:inherit;color:var(--ink);outline:none;transition:.15s}
.rec-note:focus{border-color:var(--mid);background:#fff}
.rec-note::placeholder{color:var(--ink3)}

.sym-group{margin-bottom:18px}
.sym-group-t{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;
  margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sym-group-t .count{color:var(--mid);background:var(--blue-bg);
  padding:1px 6px;border-radius:8px;font-size:10px}
.sym-opts{display:flex;flex-wrap:wrap;gap:8px}
.sym-opt{padding:10px 16px;border-radius:11px;background:var(--gray-bg);
  font-size:13.5px;color:var(--ink2);cursor:pointer;transition:.15s;position:relative}
.sym-opt.on{background:var(--blue-bg);color:var(--mid);font-weight:600}
.sym-opt.on.danger{background:var(--red-bg);color:var(--red)}
.sym-opt.alert{color:var(--red);font-weight:500}

.fu-block{background:#F8FAFD;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-top:14px}
.fu-hd{font-size:13px;color:var(--ink);font-weight:600;margin-bottom:14px;
  display:flex;align-items:center;gap:6px}
.fu-hd::before{content:'';width:3px;height:12px;background:var(--mid);border-radius:2px}
.fu-hd.warn::before{background:var(--warn)}
.fu-item{margin-bottom:14px}
.fu-item:last-child{margin-bottom:0}
.fu-label{font-size:12.5px;color:var(--ink2);font-weight:500;margin-bottom:8px}
.fu-opts{display:flex;flex-wrap:wrap;gap:6px}
.fu-opt{padding:8px 13px;border-radius:9px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.15s}
.fu-opt.on{background:var(--blue-bg);color:var(--mid);border-color:var(--mid);font-weight:600}
.fu-opt.danger.on{background:var(--red-bg);color:var(--red);border-color:var(--red)}

.urgent-banner{background:var(--red-bg);border:1.5px solid var(--red);
  border-radius:14px;padding:16px;margin-top:14px;display:flex;gap:12px;align-items:flex-start}
.urgent-ico{width:32px;height:32px;border-radius:10px;background:var(--red);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;
  flex-shrink:0;font-weight:700}
.urgent-body{flex:1}
.urgent-t{font-size:13.5px;font-weight:600;color:var(--red);margin-bottom:6px}
.urgent-s{font-size:12.5px;color:var(--ink);line-height:1.6}

.big-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.big-item{background:var(--gray-bg);border-radius:12px;padding:16px 8px;text-align:center}
.big-val{font-size:18px;font-weight:700;letter-spacing:-.4px;line-height:1}
.big-lb{font-size:11px;color:var(--ink3);margin-top:8px}
.big-delta{font-size:11px;font-weight:600;margin-top:5px}
.big-delta.up{color:var(--good)}
.big-delta.down{color:var(--bad)}

.judge-group{margin-bottom:22px}
.judge-group-t{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:14px}
.judge-item{margin-bottom:18px}
.judge-item:last-child{margin-bottom:0}
.judge-label{font-size:13.5px;color:var(--ink);font-weight:500;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between}
.judge-label small{font-size:11px;color:var(--ink3);font-weight:400}
.judge-opts{display:flex;gap:6px}
.judge-opt{flex:1;padding:11px 4px;text-align:center;border-radius:10px;
  background:var(--gray-bg);font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.15s}
.judge-opt.on{background:var(--blue-bg);color:var(--mid);font-weight:600}

.qz-q{font-size:19px;font-weight:600;line-height:1.5;letter-spacing:-.2px}
.qz-opts{margin-top:20px}
.qz-opt{display:block;width:100%;text-align:left;padding:15px 18px;margin-bottom:9px;
  border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:14.5px;
  cursor:pointer;font-family:inherit;color:var(--ink2);line-height:1.5}
.qz-opt.on{border-color:var(--mid);background:var(--blue-bg);color:var(--mid);font-weight:600}
.qz-input{width:100%;padding:20px;border:2px solid var(--line);border-radius:14px;
  font-size:26px;font-weight:700;font-family:inherit;text-align:center;
  background:#fff;color:var(--ink);outline:none;letter-spacing:6px}
.qz-input:focus{border-color:var(--mid)}

.result-life{background:linear-gradient(150deg,#0F1B2D,#1A2D47);border-radius:18px;
  padding:24px 20px;margin-bottom:18px;position:relative;overflow:hidden}
.result-life-num{font-size:48px;font-weight:700;color:#FF5C5C;line-height:1;letter-spacing:-1.5px;position:relative}
.result-life-num small{font-size:16px;color:rgba(255,255,255,.5);font-weight:500;margin-left:6px}
.result-life-desc{font-size:12.5px;color:rgba(255,255,255,.7);line-height:1.7;margin-top:12px;position:relative}

.parsed-block{background:#F8FAFD;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:18px}
.parsed-title{font-size:11px;color:var(--mid);font-weight:600;letter-spacing:1.2px;

function gradeOf(s){
  if(s>=75) return {letter:'优', color:'#C8102E'};
  if(s>=50) return {letter:'中', color:'#1E6FFF'};
  return {letter:'差', color:'#1A1A1A'};
}

function spark(data, color){
  const w=300,h=80,pad=6;
  const min=Math.min(...data),max=Math.max(...data),rng=(max-min)||1;
  const pts=data.map((v,i)=>{
    const x=pad+i*(w-pad*2)/(data.length-1);
    const y=h-pad-((v-min)/rng)*(h-pad*2);
    return [x,y];
  });
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area='M '+pts[0][0]+','+h+' L '+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ')+' L '+pts[pts.length-1][0]+','+h+' Z';
  const gid='g'+Math.random().toString(36).slice(2,8);
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}"/>
  </svg>`;
}

function dimState(d){
  const hasObj = d.obj && d.obj.length > 0;
  if(d.type === 'diet'){
    const quickFilled = Object.keys(state.dietQuick).some(mk=>Object.keys(state.dietQuick[mk]).length > 0);
    return (state.dietParsed || quickFilled) ? 'full' : (hasObj?'partial':'none');
  }
  if(d.type === 'body'){
    const sym = state.records.symptom || [];
    const real = sym.filter(x=>x!=='没有');
    if(real.length === 0) return hasObj?'partial':'none';
    const allDone = real.every(s=>{
      const fu = SYMPTOM_FOLLOWUP[s];
      if(!fu) return true;
      return fu.every(f=>state.bodyFollowups[s] && state.bodyFollowups[s][f.q]);
    });
    return allDone?'full':'partial';
  }
  if(d.type === 'breath'){
    const sym = state.records.breath_symptom || [];
    const real = sym.filter(x=>x!=='没有');
    const breathDone = state.records.breath_practice;
    if(real.length === 0 && breathDone) return 'full';
    if(real.length === 0) return hasObj?'partial':'none';
    const allDone = real.every(s=>{
      const fu = BREATH_FOLLOWUP[s];
      if(!fu) return true;
      return fu.every(f=>state.breathFollowups[s] && state.breathFollowups[s][f.q]);
    });
    return (allDone && breathDone) ? 'full' : 'partial';
  }
  if(d.type === 'env'){
    const exps = state.records.env_exposure || [];
    const real = exps.filter(x=>x!=='没有');
    const naturalDone = state.records.natural_light && state.records.natural_time;
    if(real.length === 0 && naturalDone) return 'full';
    if(real.length === 0) return hasObj?'partial':'none';
    const allDone = real.every(e=>{
      const fu = ENV_EXPOSURE_FOLLOWUP[e];
      if(!fu) return true;
      return fu.every(f=>state.envFollowups[e] && state.envFollowups[e][f.q]);
    });
    return (allDone && naturalDone) ? 'full' : 'partial';
  }
  const hasSubj = d.subj && d.subj.length > 0;
  if(!hasSubj) return hasObj?'partial':'none';
  const filled = d.subj.filter(r=>{
    const v = state.records[r.k];
    if(r.multi) return Array.isArray(v) && v.length > 0;
    return v !== undefined && v !== '';
  }).length;
  if(filled === 0) return hasObj?'partial':'none';
  if(filled < d.subj.length) return 'partial';
  return 'full';
}

function computeDietSummary(){
  if(state.dietParsed && state.dietParsed.summary){
    const sum = {...state.dietParsed.summary};
    applyDietStruct(sum);
    return sum;
  }
  const sum = {staple:0, protein:0, veg:0, fruit:0, oil:0, salt:0, sugar:0, alcohol:0};
  const mapVal = (v)=>{
    if(v==='0' || v==='没吃') return 0;
    if(v==='半碗') return 0.5;
    if(v==='1碗' || v==='1份' || v==='1拳') return 1;
    if(v==='2碗' || v==='2份' || v==='2拳') return 2;
    if(v==='3碗+' || v==='3份+' || v==='3拳+') return 3;
    if(v==='少量') return 0.5;
    if(v==='2份+') return 2;
    return 0;
  };
  ['b','l','d','s'].forEach(mk=>{
    const m = state.dietQuick[mk] || {};
    sum.staple += mapVal(m.staple);
    sum.protein += mapVal(m.protein);
    sum.veg += mapVal(m.veg);
    sum.fruit += mapVal(m.fruit);
    sum.sugar += mapVal(m.dessert) * 8;
    sum.oil += mapVal(m.bbq) * 10 + mapVal(m.fried) * 12 + mapVal(m.snack) * 5;
    sum.salt += (mapVal(m.bbq) + mapVal(m.fried)) * 1.5;
  });
  applyDietStruct(sum);
  return sum;
}

function applyDietStruct(sum){
  if(state.dietStruct.alcohol_extra === '少量') sum.alcohol = Math.max(sum.alcohol || 0, 0.5);
  if(state.dietStruct.alcohol_extra === '中等') sum.alcohol = Math.max(sum.alcohol || 0, 1.5);
  if(state.dietStruct.alcohol_extra === '较多') sum.alcohol = Math.max(sum.alcohol || 0, 3);
  if(state.dietStruct.alcohol_extra === '没喝') sum.alcohol = 0;
  if(state.dietStruct.taste === '偏油') sum.oil = Math.max(sum.oil || 0, 40);
  if(state.dietStruct.taste === '偏咸') sum.salt = Math.max(sum.salt || 0, 9);
  if(state.dietStruct.late_night === '有') sum.staple = (sum.staple || 0) + 1;
}

function renderCompare(sum){
  const compareRows = Object.keys(NUTRITION_STD).map(k=>{
    const std = NUTRITION_STD[k];
    const v = sum[k] || 0;
    const scale = std.max * 1.5 || 1;
    const pct = Math.min(100, v / scale * 100);
    const rangeStart = std.min / scale * 100;
    const rangeWidth = (std.max - std.min) / scale * 100;
    let status, cls;
    if(k === 'alcohol'){
      if(v === 0){ status = '正常'; cls = 'normal'; }
      else { status = '偏多'; cls = 'high'; }
    } else {
      if(v < std.min){ status = '偏少'; cls = 'low'; }
      else if(v > std.max){ status = '偏多'; cls = 'high'; }
      else { status = '正常'; cls = 'normal'; }
    }
    const rangeStyle = std.max > std.min
      ? `<div class="cmp-range" style="left:${rangeStart}%;width:${rangeWidth}%"></div>` : '';
    return `<div class="cmp-row">
      <div class="cmp-top">
        <span class="cmp-nm">${std.label}</span>
        <span class="cmp-v ${cls}">${v}${std.unit} · ${status}${std.max>std.min?` · 建议 ${std.min}-${std.max}${std.unit}`:(std.max>0?` · 建议 <${std.max}${std.unit}`:'')}</span>
      </div>
      <div class="cmp-bar">${rangeStyle}<div class="cmp-fill ${cls}" data-w="${pct}" style="width:0"></div></div>
    </div>`;
  }).join('');

  const issues = [];
  if((sum.veg||0) < NUTRITION_STD.veg.min) issues.push('蔬菜偏少');
  if((sum.oil||0) > NUTRITION_STD.oil.max) issues.push('油偏多');
  if((sum.salt||0) > NUTRITION_STD.salt.max) issues.push('盐偏多');
  if((sum.alcohol||0) > 0) issues.push('有饮酒');
  if((sum.fruit||0) < NUTRITION_STD.fruit.min) issues.push('水果偏少');

  const summaryText = issues.length > 0 ? `今天主要问题：${issues.join('、')}` : '今天结构均衡，继续保持';
  const hasData = Object.keys(sum).some(k=>sum[k] > 0);

  if(!hasData) return '';

  return `<div class="compare">
    <div class="compare-t">营养结构对比</div>
    ${compareRows}
    <div style="margin-top:20px;padding:14px 16px;background:#FDECEC;border-radius:12px;font-size:13px;color:#C8102E;font-weight:500;line-height:1.6">${summaryText}</div>
  </div>`;
}

    state.records.natural_time = '1-2小时';

    med:{med_visit:'没有', med_pill:'按时', supplement:['维生素D','Omega-3']},

  if(dim){ openDimRecord(dim.k); }
}

document.addEventListener('click', e=>{

  if(t){ state.tab=t.dataset.tab; render(); return; }

  const dim = e.target.closest('[data-dim]');
  if(dim){ openDimRecord(dim.dataset.dim); return; }

  const ob = e.target.closest('[data-open]');
  if(ob){
    const k = ob.dataset.open;
    if(k==='week') openWeek();
    else if(k==='month') openMonth();
    else if(k==='quiz') openQuiz();
    return;
  }

  const vb = e.target.closest('[data-voice]');
  if(vb){ openVoice(vb.dataset.voice); return; }
  if(e.target.closest('[data-voice-cancel]')){ closeVoice(); return; }
  if(e.target.closest('[data-voice-done]')){ applyVoice(); return; }

  const dm = e.target.closest('[data-diet-mode]');
  if(dm){
    state.dietMode = dm.dataset.dietMode;
    openDiet();
    return;
  }

  const qm = e.target.closest('[data-quick-meal]');
  if(qm){
    const mk = qm.dataset.quickMeal;
    const ck = qm.dataset.quickCat;
    const v = qm.dataset.quickVal;
    if(!state.dietQuick[mk]) state.dietQuick[mk] = {};
    state.dietQuick[mk][ck] = state.dietQuick[mk][ck] === v ? '' : v;
    openDiet();
    return;
  }

  const sym = e.target.closest('[data-sym]');
  if(sym){
    const v = sym.dataset.sym;
    let arr = state.records.symptom || [];
    if(v === '没有'){
      arr = arr.includes('没有') ? [] : ['没有'];
    } else {
      if(arr.includes('没有')) arr = arr.filter(x=>x!=='没有');
      if(arr.includes(v)){
        arr = arr.filter(x=>x!==v);
        delete state.bodyFollowups[v];
      } else {
        arr.push(v);
      }
    }
    state.records.symptom = arr;
    renderBodySheet();

    const s = fu.dataset.fuSym;
    const q = fu.dataset.fuQ;
    const v = fu.dataset.fuV;
    if(!state.bodyFollowups[s]) state.bodyFollowups[s] = {};
    state.bodyFollowups[s][q] = v;
    renderBodySheet();

    let arr = state.records.breath_symptom || [];
    if(v === '没有'){

    const q = bfu.dataset.breathFuQ;
    const v = bfu.dataset.breathFuV;
    if(!state.breathFollowups[s]) state.breathFollowups[s] = {};
    state.breathFollowups[s][q] = v;
    renderBreathSheet();
    return;
  }

  const eexp = e.target.closest('[data-env-exp]');
  if(eexp){
    const v = eexp.dataset.envExp;
    let arr = state.records.env_exposure || [];

        delete state.envFollowups[v];

    const s = efu.dataset.envFuSym;
    const q = efu.dataset.envFuQ;
    const v = efu.dataset.envFuV;
    if(!state.envFollowups[s]) state.envFollowups[s] = {};
    state.envFollowups[s][q] = v;
    renderEnvSheet();
    return;
  }

  const rec = e.target.closest('[data-rec]');
  if(rec){
    const k = rec.dataset.rec;
    const v = rec.dataset.val;
    const isMulti = rec.dataset.multi === '1';
    if(isMulti){
      let arr = state.records[k] || [];
      if(v==='没有' || v==='都没有' || v==='没吃'){
        arr = arr.includes(v)?[]:[v];
      } else {
        arr = arr.includes(v)?arr.filter(x=>x!==v):[...arr.filter(x=>x!=='没有' && x!=='都没有' && x!=='没吃'), v];
      }
      state.records[k] = arr;

    if(d){ renderBreathSheet(); return; }
    const d2 = DIMS.find(x=>x.type === 'env' && k.startsWith('natural'));
    if(d2){ renderEnvSheet(); return; }
    const d3 = DIMS.find(x=>x.subj && x.subj.some(r=>r.k===k));
    if(d3){ openDimRecord(d3.k); }
    return;
  }

  const st = e.target.closest('[data-struct]');

    state.dietStruct[st.dataset.struct] = st.dataset.val;

  if(wk){ state.weekJudge[wk.dataset.week] = wk.dataset.val; openWeek(); return; }
  const mo = e.target.closest('[data-month]');
  if(mo){ state.monthJudge[mo.dataset.month] = mo.dataset.val; openMonth(); return; }

  if(pr){
    openSheet(pr.dataset.practice, `
      <div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line2);font-size:14px">

      </div>
      <div style="display:flex;justify-content:space-between;padding:14px 0;font-size:14px">
        <span style="color:var(--ink2)">建议周期</span><span style="font-weight:600">21 天</span>
      </div>
      <div class="sh-btn" data-close>加入</div>
    `);
    return;
  }

  const qzS = e.target.closest('[data-qz-single]');
  if(qzS){ state.quizAns[qzS.dataset.qzSingle]=parseInt(qzS.dataset.val); renderQuiz(); return; }
  const qzM = e.target.closest('[data-qz-multi]');
  if(qzM){
    const k=qzM.dataset.qzMulti, v=qzM.dataset.val, excl=qzM.dataset.excl;
    let arr = state.quizAns[k]?[...state.quizAns[k]]:[];
    const isE = excl && v===excl;
    if(arr.includes(v)) arr=arr.filter(x=>x!==v);
    else { if(isE) arr=[v]; else { arr=arr.filter(x=>x!==excl); arr.push(v); } }
    state.quizAns[k]=arr;
    renderQuiz();
    return;
  }
  if(e.target.closest('[data-qz-prev]')){
    if(state.quizIndex>0){ state.quizIndex--; renderQuiz(); }
    return;
  }
  if(e.target.closest('[data-qz-next]')){
    const b = e.target.closest('[data-qz-next]');
    if(b.classList.contains('disabled')) return;
    if(state.quizIndex<QUIZ.length-1){ state.quizIndex++; renderQuiz(); }
    else { renderQuizResult(); }
    return;
  }

  if(e.target.closest('[data-close]') || e.target.id==='modal'){
    closeModal();
  }
});

      document.querySelectorAll('.obj-row').forEach(row=>{
        if(row.querySelector('.obj-nm') && row.querySelector('.obj-nm').textContent === 'BMI'){
          row.querySelector('.obj-val').textContent = calcBMI(v);
        }
      });
    }
  }
});

render();
</script>
</body>
</html>
