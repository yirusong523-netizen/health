<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>老板健康</title>
<style>
:root{
  --bg:#F7F9FC; --card:#FFFFFF; --line:#E8EEF5; --line2:#EEF2F7;
  --ink:#0F1B2D; --ink2:#5A6B80; --ink3:#94A3B5;
  --blue:#1E6FFF; --blue-bg:#EDF3FF;
  --good:#C8102E; --mid:#1E6FFF; --bad:#1A1A1A;
  --warn:#F5A623; --warn-bg:#FEF5E7;
  --red:#C8102E; --red-bg:#FDECEC;
  --gray-bg:#F2F5FA;
  --gold:#B8860B; --gold-bg:#FFF8E7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{background:#E9EEF5;min-height:100vh;display:flex;align-items:center;
  justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  color:var(--ink);padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;
  border:1px solid #D5DEE8;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(15,27,45,.18),0 0 0 8px #fff,0 0 0 10px #D5DEE8;
  position:relative}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;
  background:var(--bg);z-index:10}
.statusbar .r{font-size:12px;color:var(--ink2);font-weight:500}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 100px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}

.tabbar{position:absolute;bottom:0;left:0;right:0;height:78px;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:16px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:10px;color:var(--ink3);cursor:pointer;font-weight:500;letter-spacing:.3px}
.tab svg{width:22px;height:22px;stroke:var(--ink3);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.tab.active{color:var(--blue)}
.tab.active svg{stroke:var(--blue);stroke-width:1.9}

#viewbar{display:flex;justify-content:center;padding:2px 0 6px;flex-shrink:0;z-index:9}
.vb-seg{display:flex;background:#E4EAF2;border-radius:20px;padding:3px;gap:2px}
.vb-seg span{padding:5px 16px;font-size:11.5px;border-radius:16px;color:var(--ink2);
  font-weight:600;cursor:pointer;transition:.16s}
.vb-seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,27,45,.12)}

.hd{padding:8px 2px 20px}
.hd-date{font-size:12.5px;color:var(--ink3);letter-spacing:.5px}
.hd-title{font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-.3px;line-height:1.2}
.hd-row{display:flex;align-items:flex-start;justify-content:space-between}
.share-btn{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);
  background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:20px;
  font-weight:500;cursor:pointer;margin-top:8px}
.share-btn:active{background:#F2F5FA}

.sec{font-size:13px;font-weight:600;color:var(--ink2);margin:24px 2px 12px;
  display:flex;align-items:center;justify-content:space-between}
.sec .more{font-size:12px;color:var(--ink3);font-weight:400;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:12px}

.ranges{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.ranges::-webkit-scrollbar{display:none}
.range{flex-shrink:0;padding:7px 15px;border-radius:20px;background:#fff;
  border:1px solid var(--line);font-size:12.5px;color:var(--ink2);font-weight:500;
  cursor:pointer;transition:.15s;display:flex;align-items:center;gap:4px}
.range.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.range:active{transform:scale(.96)}
.range .rng-dates{font-size:10.5px;font-weight:500;opacity:.85}

.manual-panel{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:14px}
.mp-title{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:12px}
.mp-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.mp-field{flex:1;min-width:0}
.mp-label{font-size:10.5px;color:var(--ink3);margin-bottom:6px;display:block}
.mp-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  font-size:14px;font-family:inherit;font-weight:600;color:var(--ink);outline:none;background:#fff}
.mp-input:focus{border-color:var(--mid)}
.mp-quick{display:flex;gap:6px;flex-wrap:wrap}
.mp-quick .rec-opt{padding:7px 12px;font-size:12px}
.mp-summary{font-size:11.5px;background:var(--gold-bg);color:var(--gold);
  padding:8px 12px;border-radius:10px;font-weight:600;margin-top:10px}

.trendcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 14px;margin-bottom:14px}
.tc-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tc-lb{font-size:12px;color:var(--ink3);font-weight:500}
.tc-num{font-size:32px;font-weight:700;letter-spacing:-1.2px;line-height:1;margin-top:7px}
.tc-num small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:4px;letter-spacing:0}
.tc-delta{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap}
.tc-delta.up{background:var(--red-bg);color:var(--red)}
.tc-delta.down{background:var(--gray-bg);color:var(--ink2)}
.trend{width:100%;height:110px;display:block;margin-top:6px}
.trend-x{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);
  margin-top:2px;padding:0 4px}
.mini-btn{padding:6px 12px;border-radius:20px;background:var(--gold-bg);color:var(--gold);
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}

.g9-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g9{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 11px;cursor:pointer;position:relative;transition:.15s}
.g9:active{transform:scale(.96);background:#FAFCFF}
.g9-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.g9-name{font-size:11.5px;color:var(--ink3);font-weight:500}
.g9-dot{width:5px;height:5px;border-radius:50%;background:#D5DEE8;flex-shrink:0;transition:.2s}
.g9-dot.full{background:var(--gold)}
.g9-dot.partial{background:var(--mid)}
.g9-main{display:flex;align-items:baseline;gap:6px}
.g9-grade{font-size:22px;font-weight:700;line-height:1;letter-spacing:-1px}
.g9-score{font-size:11px;color:var(--ink3);font-weight:500;margin-left:auto}
.g9-bar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:10px}
.g9-bar span{display:block;height:100%;border-radius:2px;transition:width .6s}

/* 等级卡（纵向） */
.level-card{background:linear-gradient(150deg,#0F1B2D,#1A2D47);border-radius:20px;
  padding:22px 20px;margin-bottom:14px;position:relative;overflow:hidden;color:#fff}
.level-card::before{content:'';position:absolute;top:-60px;right:-50px;width:180px;height:180px;
  border-radius:50%;background:rgba(184,134,11,.20)}
.level-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative}
.level-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(184,134,11,.22);
  border:1px solid rgba(184,134,11,.45);color:#FFD27A;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:20px;letter-spacing:.5px}

.level-now{margin-top:18px;position:relative}
.level-now-lb{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1.5px}
.level-now-name{font-size:56px;font-weight:700;color:#FFD27A;letter-spacing:-2.4px;
  line-height:1;margin-top:8px}
.level-now-age{font-size:14px;color:rgba(255,255,255,.65);margin-top:8px;font-weight:500}

.level-list{display:flex;flex-direction:column;gap:6px;margin-top:22px;position:relative}
.level-row{display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-radius:12px;background:rgba(255,255,255,.05);transition:.2s}
.level-row.on{background:rgba(184,134,11,.25);border:1px solid rgba(184,134,11,.5)}
.level-row-name{font-size:15px;font-weight:700;color:rgba(255,255,255,.55);width:66px;flex-shrink:0}
.level-row.on .level-row-name{color:#FFD27A;font-size:18px}
.level-row-age{font-size:11.5px;color:rgba(255,255,255,.4);flex:1}
.level-row.on .level-row-age{color:rgba(255,255,255,.85)}
.level-row-tag{font-size:10.5px;color:rgba(255,255,255,.35);font-weight:500;flex-shrink:0}
.level-row.on .level-row-tag{color:#FFD27A;font-weight:700}
.level-row.done .level-row-name{color:rgba(255,255,255,.8)}
.level-row.done .level-row-tag{color:rgba(255,255,255,.55)}

.asset-list{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;margin-bottom:14px}
.asset-list-hd{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:14px}
.asset-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.asset-row-nm{width:22px;font-size:15px;font-weight:700;color:var(--ink);flex-shrink:0}
.asset-row-sub{width:56px;font-size:11.5px;color:var(--ink3);flex-shrink:0}
.asset-row-bar{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.asset-row-fill{height:100%;border-radius:3px;transition:width .6s}
.asset-row-val{width:30px;text-align:right;font-size:14px;font-weight:700;flex-shrink:0}

.goal-card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;position:relative;overflow:hidden;margin-bottom:14px}
.goal-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--gold)}
.goal-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.goal-tag{font-size:10.5px;color:var(--gold);background:var(--gold-bg);
  padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:.8px;display:inline-block}
.goal-more{font-size:11.5px;color:var(--ink3);cursor:pointer;white-space:nowrap;margin-top:2px}
.goal-title{font-size:20px;font-weight:700;margin-top:12px;letter-spacing:-.3px;line-height:1.4}
.goal-desc{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.6}

.action-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.action-item{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;transition:.15s}
.action-item:active{background:#FAFCFF}
.action-ico{width:34px;height:34px;border-radius:10px;background:var(--gold-bg);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0}
.action-main{flex:1;min-width:0}
.action-t{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4}
.action-s{font-size:11px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:6px}
.action-src{background:var(--blue-bg);color:var(--mid);font-size:9.5px;padding:1px 5px;
  border-radius:4px;font-weight:600}
.action-btn{flex-shrink:0;font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;
  cursor:pointer;white-space:nowrap;border:none;font-family:inherit;transition:.15s}
.action-btn.join{color:var(--gold);background:var(--gold-bg)}
.action-btn.check{color:var(--mid);background:var(--blue-bg)}
.action-btn.done{color:var(--ink3);background:var(--gray-bg);cursor:default}

.result-card{background:linear-gradient(150deg,#0F1B2D,#1A2D47);border-radius:18px;
  padding:20px;color:#fff;position:relative;overflow:hidden}
.result-card::before{content:'';position:absolute;top:-50px;right:-40px;width:140px;height:140px;
  border-radius:50%;background:rgba(184,134,11,.16)}
.result-hd{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px;font-weight:600;
  position:relative;margin-bottom:14px}
.result-num{font-size:36px;font-weight:700;letter-spacing:-1.2px;line-height:1;position:relative}
.result-num small{font-size:13px;color:rgba(255,255,255,.55);font-weight:500;margin-left:5px}
.result-lb{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:10px;position:relative}
.result-bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:16px;position:relative}
.result-bar-fill{height:100%;border-radius:4px;background:#FFD27A;transition:width .6s}
.result-foot{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.55);
  margin-top:10px;position:relative}
.result-chg{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;font-size:12.5px;position:relative}
.result-chg-lb{color:rgba(255,255,255,.6)}
.result-chg-val{font-weight:700;color:#FFD27A}

.detail-block{margin-bottom:20px}
.detail-block:last-child{margin-bottom:0}
.detail-t{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:10px}
.detail-p{font-size:13.5px;color:var(--ink2);line-height:1.7}
.detail-list{display:flex;flex-direction:column;gap:8px}
.detail-li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink2);line-height:1.6}
.detail-li .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:7px;flex-shrink:0}
.week-days{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.week-day{width:30px;height:30px;border-radius:8px;background:var(--gray-bg);
  font-size:11px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.week-day.on{background:var(--gold);color:#fff;font-weight:600}
.week-day.today{border:1.5px solid var(--gold);color:var(--gold);font-weight:700}

.mgr-group{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:6px 18px;margin-bottom:14px}
.mgr-row{display:flex;align-items:center;gap:14px;padding:15px 0;
  border-bottom:1px solid var(--line2);cursor:pointer}
.mgr-row:last-child{border-bottom:none}
.mgr-row-ico{width:34px;height:34px;border-radius:10px;background:var(--gray-bg);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);
  flex-shrink:0;font-weight:600}
.mgr-row-main{flex:1;min-width:0}
.mgr-row-t{font-size:14px;color:var(--ink);font-weight:500}
.mgr-row-s{font-size:11.5px;color:var(--ink3);margin-top:3px}
.mgr-row-val{font-size:12px;font-weight:600;color:var(--gold)}

.streak{background:linear-gradient(135deg,#B8860B,#7A5A00);border-radius:18px;
  padding:24px;color:#fff;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.streak::before{content:'';position:absolute;top:-60px;right:-40px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.streak-num{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1.5px;position:relative}
.streak-num small{font-size:15px;font-weight:500;color:rgba(255,255,255,.75);margin-left:4px}
.streak-lb{font-size:13px;color:rgba(255,255,255,.85);margin-top:10px;position:relative}

.modal{position:fixed;inset:0;background:rgba(15,27,45,.45);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:99;
  overscroll-behavior:contain}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  background:#fff;border-radius:26px 26px 0 0;padding:24px 22px 40px;
  position:relative;animation:up .3s cubic-bezier(.2,.9,.3,1);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sh-head{margin-bottom:20px}
.sh-title-row{display:flex;align-items:flex-start;justify-content:space-between}
.sh-name{font-size:19px;font-weight:600}
.sh-date{font-size:12.5px;color:var(--ink3);margin-top:6px;letter-spacing:.3px}
.sh-x{width:30px;height:30px;border-radius:50%;background:#F2F5FA;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  flex-shrink:0}
.sh-btn{margin-top:20px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;
  text-align:center;padding:15px;border-radius:14px;cursor:pointer}
.sh-btn.disabled{background:#E8EEF5;color:var(--ink3);cursor:not-allowed}
.sh-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500}

/* 具体指标行（带加减变化） */
.metrics-block{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:6px 16px;margin-bottom:18px}
.metrics-hd{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:1px;
  padding:12px 0 4px;display:flex;align-items:center;justify-content:space-between}
.metrics-hd .cnt{font-size:10px;color:var(--ink3);font-weight:400}
.metric-row{display:flex;align-items:center;gap:10px;padding:12px 0;
  border-bottom:1px solid var(--line2)}
.metric-row:last-child{border-bottom:none}
.metric-nm{font-size:12.5px;color:var(--ink2);flex:1;min-width:0;line-height:1.4}
.metric-v{font-size:14px;font-weight:700;color:var(--ink);text-align:right;flex-shrink:0;letter-spacing:-.2px}
.metric-v small{font-size:10.5px;color:var(--ink3);font-weight:500;margin-left:2px}
.metric-v.empty{color:var(--ink3);font-weight:500;font-size:12.5px}
.metric-delta{font-size:11.5px;font-weight:700;width:44px;text-align:right;flex-shrink:0}
.metric-delta.good{color:var(--red)}
.metric-delta.bad{color:var(--ink2)}
.metric-delta.flat{color:var(--ink3);font-weight:400}

.metrics-empty{padding:16px 4px 18px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.6}

/* 对话式输入 */
.chat-block{background:#F8FAFD;border:1px solid var(--line);border-radius:14px;
  padding:14px 14px 12px;margin-bottom:18px}
.chat-block-hd{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:1px;
  margin-bottom:12px;display:flex;align-items:center;gap:6px}
.chat-block-hd::before{content:'记录';background:var(--gold-bg);color:var(--gold);
  font-size:9px;padding:2px 5px;border-radius:4px;font-weight:700;letter-spacing:0}
.chat-msg{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
.chat-msg.user{flex-direction:row-reverse}
.chat-avatar{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#1E6FFF,#0D4FD6);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;
  font-weight:700;flex-shrink:0}
.chat-msg.user .chat-avatar{background:linear-gradient(135deg,#B8860B,#7A5A00)}
.chat-bubble{max-width:80%;background:#fff;border-radius:12px;padding:10px 12px;
  font-size:13px;line-height:1.6;color:var(--ink);border:1px solid var(--line)}
.chat-msg.user .chat-bubble{background:var(--gold-bg);color:var(--ink);border-color:transparent}
.chat-hint{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.5}
.chat-parsed{margin:2px 0 10px 34px;padding:8px 10px;background:#fff;border:1px dashed var(--line);
  border-radius:10px;font-size:11.5px;color:var(--ink2);line-height:1.6}
.chat-parsed b{color:var(--ink);font-weight:600}
.chat-parsed span{display:inline-block;margin-right:12px}
.chat-input{display:flex;gap:8px;margin-top:12px}
.chat-input input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-size:13.5px;outline:none;background:#fff;font-family:inherit;color:var(--ink)}

  return LEVELS.find(l=>asset >= l.min && asset <= l.max) || LEVELS[0];

function assetFromDims(scores){

/* ============ 工具 ============ */
function gradeOf(s){
  if(s>=75) return {letter:'优', color:'#B8860B'};
  if(s>=50) return {letter:'中', color:'#1E6FFF'};
  return {letter:'差', color:'#1A1A1A'};
}
function dimScores(range){
  const adj = RANGE_ADJ[range] || RANGE_ADJ.day;
  const o = {};
  DIMS.forEach(d=>{ o[d.k] = Math.max(30, Math.min(99, d.score + (adj[d.k]||0))); });
  return o;
}
function currentAsset(range){
  return assetFromDims(dimScores(range));
}
function trendSvg(values, labels, color, maxV){
  const w=320, h=110, padL=10, padR=10, padT=14, padB=14;
  const useMax = maxV || Math.max.apply(null, values);
  let min=Math.min.apply(null,values), max=useMax;
  const raw = (max-min)||1;
  min -= raw*0.15; max += raw*0.15;
  const rng = (max-min)||1;
  const iw = w-padL-padR, ih = h-padT-padB;
  const pts = values.map((v,i)=>{
    const x = padL + (values.length===1 ? iw/2 : iw*i/(values.length-1));
    const y = padT + ih*(1-(v-min)/rng);
    return [x,y];
  });
  const line = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = 'M '+pts[0][0].toFixed(1)+','+(h-padB)+' L '+
               pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ')+
               ' L '+pts[pts.length-1][0].toFixed(1)+','+(h-padB)+' Z';
  const gid = 'tg'+Math.random().toString(36).slice(2,8);
  const grids = [0,0.5,1].map(t=>{
    const y = padT + ih*t;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}"
      stroke="#EEF2F7" stroke-width="1" stroke-dasharray="3 4"/>`;
  }).join('');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"
      fill="#fff" stroke="${color}" stroke-width="1.6"/>`).join('');
  const last = pts[pts.length-1];
  return `<svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grids}
    <path d="${area}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${color}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="7"
      fill="${color}" opacity=".16"/>
  </svg>`;
}
function xLabels(xs){
  if(xs.length<=7) return xs.map(l=>`<span>${l}</span>`).join('');
  const mid = xs[Math.floor(xs.length/2)];
  return `<span>${xs[0]}</span><span>${mid}</span><span>${xs[xs.length-1]}</span>`;
}
function dimState(d){
  if(Object.keys(state.records).some(k=>k.startsWith('chat_'+d.k) && state.records[k])) return 'full';
  return 'partial';
}

function totalScoreTrendHtml(k, range){
  const dim = DIMS.find(x=>x.k===k);
  const series = DIM_TREND_BY_RANGE[k] && DIM_TREND_BY_RANGE[k][range];
  if(!series || !series.length){
    return `<div class="empty-state" style="background:#fff;border:1px dashed var(--line);border-radius:14px;padding:24px 20px;text-align:center;margin-bottom:16px">
      <div style="font-size:22px;color:var(--ink3);margin-bottom:8px">📈</div>
      <div style="font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:4px">还没有足够数据</div>
      <div style="font-size:12px;color:var(--ink3);line-height:1.6">记录一次后就能看到趋势</div>
    </div>`;
  }
  const xs = DIM_TREND_X[range] || DIM_TREND_X.week;
  const first = series[0], last = series[series.length-1];
  const delta = last - first;
  const isGood = trendIsGood(k, delta);
  const color = isGood ? '#C8102E' : '#1A1A1A';
  const deltaCls = isGood ? 'up' : 'down';
  const sign = delta >= 0 ? '+' : '';
  return `<div class="trendcard" style="margin-top:0;margin-bottom:16px">
    <div class="tc-hd">
      <div>
        <div class="tc-lb">总分 · ${dim.name}（100 分制）</div>
        <div class="tc-num" style="color:${color}">${last}<small>分</small></div>
      </div>
      <div class="tc-delta ${deltaCls}">${sign}${delta}</div>
    </div>
    ${trendSvg(series, xs, color, 100)}
    <div class="trend-x">${xLabels(xs)}</div>
  </div>`;
}

function metricsBlockHtml(k){

    return `<div class="metrics-block">

  }
  const rows = items.map(it=>{
    const empty = it.v === null || it.v === undefined || it.v === '';
    let deltaHtml = '<span class="metric-delta flat">—</span>';
    if(!empty && it.delta !== null && it.delta !== undefined && it.delta !== 0){
      const sign = it.delta > 0 ? '+' : '';
      const cls = it.good ? 'good' : 'bad';
      let dv = it.delta;
      if(!Number.isInteger(dv)) dv = dv.toFixed(1);
      deltaHtml = `<span class="metric-delta ${cls}">${sign}${dv}</span>`;
    }
    return `<div class="metric-row">
      <div class="metric-nm">${it.k}</div>
      <div class="metric-v ${empty?'empty':''}">${empty ? '—' : it.v}${!empty && it.unit ? `<small>${it.unit}</small>` : ''}</div>
      ${deltaHtml}
    </div>`;
  }).join('');
  return `<div class="metrics-block">
    <div class="metrics-hd"><span>具体指标</span><span class="cnt">${items.length} 项</span></div>
    ${rows}

/* ============ 引导式对话 ============ */
function getChat(k){
  if(!state.chat[k]) state.chat[k] = {step: 0, log: []};
  return state.chat[k];
}
function parseChatText(k, text){
  const out = [];
  if(!text) return out;
  const t = text.trim();
  if(k === 'move'){
    const m = t.match(/(\d{3,6})\s*步/); if(m) out.push({k:'步数', v:m[1]+' 步'});
    const min = t.match(/(\d{1,3})\s*分钟/); if(min) out.push({k:'时长', v:min[1]+' 分钟'});
    if(/力量训练|深蹲|俯卧撑|举铁/.test(t)) out.push({k:'力量', v:'有'});
  } else if(k === 'body'){
    const w = t.match(/(\d{2,3}(\.\d)?)\s*(kg|公斤)/); if(w) out.push({k:'体重', v:w[1]+'kg'});
    const bp = t.match(/(\d{2,3})\s*\/\s*(\d{2,3})/); if(bp) out.push({k:'血压', v:bp[1]+'/'+bp[2]});
    ['颈肩','便干','便秘','头晕','疲劳','心慌','没胃口'].forEach(s=>{ if(t.includes(s)) out.push({k:'症状', v:s}); });
  } else if(k === 'stress'){
    const meet = t.match(/(\d{1,2})\s*个?会/); if(meet) out.push({k:'会议', v:meet[1]+' 个'});
    if(/加班|十点|十一点|很晚/.test(t)) out.push({k:'工作', v:'偏晚'});
    if(/客户|谈判|签约/.test(t)) out.push({k:'事件', v:'有'});
    if(/烦|紧|焦虑|压力/.test(t)) out.push({k:'情绪', v:'偏紧'});
    if(/松|好|不错|开心/.test(t)) out.push({k:'情绪', v:'偏松'});
  } else if(k === 'diet'){
    const water = t.match(/(\d+(\.\d)?)\s*(L|升|杯)/); if(water) out.push({k:'饮水', v:water[1]+water[3]});
    if(/酒|红酒|白酒|啤酒/.test(t)) out.push({k:'饮酒', v:'有'});
    if(/维生素|鱼油|钙片|益生菌/.test(t)) out.push({k:'补剂', v:'有'});
    if(/外卖|烧烤|油炸/.test(t)) out.push({k:'风险', v:'有'});
  } else if(k === 'sleep'){
    const h = t.match(/(\d{1,2})\s*点.*?(\d{1,2})\s*点/); if(h) out.push({k:'时段', v:h[1]+'-'+h[2]+'点'});
    const wake = t.match(/醒[了]?(\d{1,2})\s*次/); if(wake) out.push({k:'夜醒', v:wake[1]+' 次'});
    if(/午睡|午觉/.test(t)) out.push({k:'午睡', v:'有'});
    if(/好|不错|香/.test(t)) out.push({k:'体感', v:'好'});
    if(/累|没睡好|失眠/.test(t)) out.push({k:'体感', v:'差'});
  } else if(k === 'breath'){
    ['胸闷','气短','打鼾','咳嗽','咳痰','呼吸练习'].forEach(s=>{ if(t.includes(s)) out.push({k:'呼吸', v:s}); });
    if(/顺畅|还好|没有/.test(t)) out.push({k:'体感', v:'好'});
  } else if(k === 'env'){
    if(/户外|外面|阳光/.test(t)) out.push({k:'户外', v:'有'});
    if(/二手烟|烟味/.test(t)) out.push({k:'二手烟', v:'有'});
    if(/空气|雾霾|甲醛|装修/.test(t)) out.push({k:'空气', v:'提及'});
  } else if(k === 'cognition'){
    if(/读书|看了|学习|课程/.test(t)) out.push({k:'学习', v:'有'});
    if(/专注|分心/.test(t)) out.push({k:'专注', v:'提及'});
    if(/聚会|聊天|社交/.test(t)) out.push({k:'社交', v:'有'});
  } else if(k === 'event'){
    if(/谈判|签约|客户|会议/.test(t)) out.push({k:'工作', v:'有'});
    if(/家里|孩子|父母|家庭/.test(t)) out.push({k:'家庭', v:'有'});
    if(/体检|医院|看病/.test(t)) out.push({k:'健康', v:'有'});
    if(/股票|投资|钱|财务/.test(t)) out.push({k:'财务', v:'有'});
    out.push({k:'影响', v:/好|成|顺利/.test(t)?'正面':(/差|失败|糟/.test(t)?'负面':'中性')});
  }
  return out;
}
function chatBlockHtml(k){
  const chat = getChat(k);
  const flow = CHAT_FLOW[k] || [{q:'今天怎么样？'}];
  let html = '<div class="chat-block">';
  html += `<div class="chat-block-hd">手动记录</div>`;
  chat.log.forEach((item)=>{
    html += `<div class="chat-msg ai">
      <div class="chat-avatar">AI</div>
      <div class="chat-bubble">${item.q}${item.hint ? `<div class="chat-hint">${item.hint}</div>` : ''}</div>
    </div>`;
    html += `<div class="chat-msg user">
      <div class="chat-avatar">我</div>
      <div class="chat-bubble">${item.a}</div>
    </div>`;
    if(item.parsed && item.parsed.length){
      html += `<div class="chat-parsed">${item.parsed.map(p=>`<span>${p.k} <b>${p.v}</b></span>`).join('')}</div>`;
    }
  });
  if(chat.step < flow.length){
    const cur = flow[chat.step];
    const q = cur.q || cur;
    const hint = cur.hint || '';
    html += `<div class="chat-msg ai">
      <div class="chat-avatar">AI</div>
      <div class="chat-bubble">${q}${hint ? `<div class="chat-hint">${hint}</div>` : ''}</div>
    </div>`;
    html += `<div class="chat-input">
      <input id="chatInput" placeholder="说点什么…" data-chat-dim="${k}">
      <button data-chat-send="${k}">发送</button>
    </div>`;
  } else {
    html += `<div class="chat-done">✓ 已记录 <b>${chat.log.length}</b> 条</div>`;
  }
  html += '</div>';
  return html;
}

/* ============ 事件 ============ */
document.addEventListener('click', e=>{
  if(e.target.closest('[data-ob-login]') || e.target.closest('[data-ob-phone]')){
    state.ob.step = 1; renderOnboard(); return;
  }
  const obSet = e.target.closest('[data-ob-set]');
  if(obSet){ state.ob[obSet.dataset.obSet] = obSet.dataset.val; renderOnboard(); return; }
  const obMulti = e.target.closest('[data-ob-multi]');
  if(obMulti){
    const key = obMulti.dataset.obMulti, v = obMulti.dataset.val;
    const arr = state.ob[key] || [];
    if(v === '没有'){ state.ob[key] = arr.includes('没有') ? [] : ['没有']; }
    else {
      const filtered = arr.filter(x=>x!=='没有');
      state.ob[key] = filtered.includes(v) ? filtered.filter(x=>x!==v) : [...filtered, v];
    }
    renderOnboard(); return;
  }
  if(e.target.closest('[data-ob-done]')){
    state.onboarded = true;
    state.weight = parseFloat(state.ob.weight) || 78.4;
    render(); return;
  }

  const vw = e.target.closest('[data-view]');
  if(vw){ state.view = vw.dataset.view; state.adminUser = null; render(); return; }
  if(e.target.closest('[data-admin-back]')){ state.adminUser = null; render(); return; }
  const rankUser = e.target.closest('[data-rank-user]');
  if(rankUser){ state.adminUser = rankUser.dataset.rankUser; render(); return; }

  const t = e.target.closest('[data-tab]');
  if(t){ state.tab = t.dataset.tab; render(); return; }

  const rg = e.target.closest('[data-range]');
  if(rg){ state.range[rg.dataset.rtab] = rg.dataset.range; render(); return; }

  const mp = e.target.closest('[data-manual-preset]');
  if(mp){
    const key = mp.dataset.manualPreset;
    state.manual[key].start = mp.dataset.start;
    state.manual[key].end = mp.dataset.end;
    render(); return;
  }

  const dim = e.target.closest('[data-dim]');
  if(dim){
    const k = dim.dataset.dim;
    if(k === 'diet'){ openDiet(); } else { openDimRecord(k, state.range.see); }
    return;
  }

  const sendBtn = e.target.closest('[data-chat-send]');
  if(sendBtn){
    const k = sendBtn.dataset.chatSend;
    const inp = document.getElementById('chatInput');
    const text = (inp && inp.value || '').trim();
    if(!text){ toast('先写点什么'); return; }
    const chat = getChat(k);
    const flow = CHAT_FLOW[k] || [];
    if(chat.step >= flow.length) return;
    const cur = flow[chat.step];
    const q = cur.q || cur;
    const hint = cur.hint || '';
    const parsed = parseChatText(k, text);
    chat.log.push({q, hint, a: text, parsed});
    chat.step++;
    state.records['chat_'+k] = text;
    if(k === 'diet'){ openDiet(); } else { openDimRecord(k, state.range.see); }
    setTimeout(()=>{
      const blk = document.querySelector('.chat-block');
      if(blk) blk.scrollIntoView({behavior:'smooth', block:'end'});
    }, 100);
    return;
  }

  if(e.target.closest('[data-diet-fine]')){ openDietFine(); return; }
  const dm = e.target.closest('[data-diet-mode]');
  if(dm){ state.dietMode = dm.dataset.dietMode; openDietFine(); return; }
  const qm = e.target.closest('[data-quick-meal]');
  if(qm){
    const mk = qm.dataset.quickMeal, ck = qm.dataset.quickCat, v = qm.dataset.quickVal;
    if(!state.dietQuick[mk]) state.dietQuick[mk] = {};
    state.dietQuick[mk][ck] = state.dietQuick[mk][ck] === v ? '' : v;
    openDietFine(); return;
  }

  if(e.target.closest('[data-goal-detail]')){ openGoalDetail(); return; }
  const pj = e.target.closest('[data-practice-join]');
  if(pj){
    const id = pj.dataset.practiceJoin;
    const ps = state.practiceState[id];
    if(ps){
      ps.joined = true; ps.checkedToday = false; ps.streak = 0; ps.week = [0,0,0,0,0,0,0];
      render(); toast('已加入');
    }
    return;
  }
  const pc = e.target.closest('[data-practice-check]');
  if(pc){
    const id = pc.dataset.practiceCheck;
    const ps = state.practiceState[id];
    if(ps && ps.joined){
      ps.checkedToday = !ps.checkedToday;
      if(ps.checkedToday){ ps.streak += 1; ps.week[0] = 1; }
      else { ps.streak = Math.max(0, ps.streak - 1); ps.week[0] = 0; }
      render();
    }
    return;
  }

  if(e.target.closest('[data-share]')){ openShare(); return; }
  const st2 = e.target.closest('[data-share-to]');
  if(st2){
    const to = st2.dataset.shareTo;
    closeModal();
    setTimeout(()=>toast(to==='image'?'已保存到相册':'已发送'), 120);
    return;
  }
  if(e.target.closest('[data-family]')){ openFamily(); return; }
  if(e.target.closest('[data-family-invite]')){
    closeModal(); setTimeout(()=>toast('邀请链接已复制'), 120); return;
  }

  const vb = e.target.closest('[data-voice]');
  if(vb){ openVoice(vb.dataset.voice); return; }
  if(e.target.closest('[data-voice-cancel]')){ closeVoice(); return; }
  if(e.target.closest('[data-voice-done]')){ applyVoice(); return; }

  const qzS = e.target.closest('[data-qz-single]');
  if(qzS){ state.quizAns[qzS.dataset.qzSingle] = parseInt(qzS.dataset.val); renderQuiz(); return; }
  const qzM = e.target.closest('[data-qz-multi]');
  if(qzM){
    const k = qzM.dataset.qzMulti, v = qzM.dataset.val, excl = qzM.dataset.excl;
    let arr = state.quizAns[k] ? [...state.quizAns[k]] : [];
    const isE = excl && v === excl;
    if(arr.includes(v)) arr = arr.filter(x=>x!==v);
    else { if(isE) arr = [v]; else { arr = arr.filter(x=>x!==excl); arr.push(v); } }
    state.quizAns[k] = arr;
    renderQuiz(); return;
  }
  if(e.target.closest('[data-qz-prev]')){
    if(state.quizIndex>0){ state.quizIndex--; renderQuiz(); }
    return;
  }
  if(e.target.closest('[data-qz-next]')){
    const b = e.target.closest('[data-qz-next]');
    if(b.classList.contains('disabled')) return;
    if(state.quizIndex < QUIZ.length-1){ state.quizIndex++; renderQuiz(); }
    else { renderQuizResult(); }
    return;
  }

  if(e.target.closest('[data-close]') || e.target.id === 'modal'){ closeModal(); }
});

document.addEventListener('change', e=>{
  if(e.target.hasAttribute('data-manual-start')){
    const key = e.target.dataset.manualStart;
    let v = e.target.value;
    if(!v) return;
    if(v > state.manual[key].end) v = state.manual[key].end;
    state.manual[key].start = v;
    render();
  }
  if(e.target.hasAttribute('data-manual-end')){
    const key = e.target.dataset.manualEnd;
    let v = e.target.value;
    if(!v) return;
    if(v < state.manual[key].start) v = state.manual[key].start;
    state.manual[key].end = v;
    render();
  }
});

document.addEventListener('input', e=>{
  if(e.target.hasAttribute('data-ob-input')){ state.ob[e.target.dataset.obInput] = e.target.value; }
  if(e.target.id === 'shareFeel'){
    state.shareFeel = e.target.value;
    const cnt = document.getElementById('shareFeelCount');
    if(cnt) cnt.textContent = e.target.value.length;
    refreshShareFeel();
  }
});

render();
</script>
</body>
</html>
