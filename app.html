<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>老板健康</title>
<style>
:root{
  --fs-display: 24px; --fs-num: 30px; --fs-title: 18px;
  --fs-body-lg: 15px; --fs-body: 14px; --fs-base: 13px;
  --fs-sm: 12px; --fs-xs: 11px; --fs-micro: 10px;

  --bg:#F6F8FB; --card:#FFFFFF;
  --line:#E9EEF5; --line2:#F1F4F9;
  --ink:#14202F; --ink2:#5A6B80; --ink3:#8C9AAB;
  --blue:#2563EB; --blue-bg:#EEF3FF;
  --red:#C8102E; --red-bg:#FDECEC;
  --gold:#B8860B; --gold-deep:#8A6408; --gold-bg:#FFF8E7;
  --gray-bg:#F2F5FA;
  --wechat:#07C160;

  --r-lg:16px; --r-md:14px; --r-sm:10px; --r-xs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{background:#E9EEF5;min-height:100vh;display:flex;align-items:center;
  justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  color:var(--ink);padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;
  border:1px solid #D5DEE8;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(15,27,45,.18),0 0 0 8px #fff,0 0 0 10px #D5DEE8;
  position:relative}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;font-size:var(--fs-sm);font-weight:600;
  background:var(--bg);z-index:10}
.statusbar .r{font-size:var(--fs-sm);color:var(--ink2);font-weight:500}

/* ===== 顶部栏 ===== */
.appbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:var(--bg);position:relative;z-index:20}
.appbar-btn{width:36px;height:36px;border-radius:10px;border:none;background:transparent;
  color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:.15s;flex-shrink:0}
.appbar-btn:active{background:rgba(20,32,47,.07)}
.appbar-title{flex:1;text-align:center;font-size:var(--fs-body-lg);font-weight:600;
  letter-spacing:.2px;margin-right:36px}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.screen::-webkit-scrollbar{display:none}

/* ===== 健康助手 ===== */
.chat-wrap{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chat-scroll::-webkit-scrollbar{display:none}

.chat-msg{display:flex;margin-bottom:14px;gap:8px;align-items:flex-start;
  animation:msgIn .3s cubic-bezier(.2,.9,.3,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.chat-msg.user{flex-direction:row-reverse}
.chat-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:var(--fs-micro);font-weight:700;flex-shrink:0;color:#fff}
.chat-avatar.ai{background:linear-gradient(135deg,var(--gold),var(--gold-deep))}
.chat-avatar.user{background:linear-gradient(135deg,#2563EB,#1D4ED8)}
.chat-bubble{max-width:80%;padding:11px 14px;border-radius:14px;font-size:var(--fs-body);
  line-height:1.72;word-break:break-word}
.chat-bubble.plain{white-space:pre-wrap}
.chat-msg.ai .chat-bubble{background:#fff;border:1px solid var(--line);color:var(--ink);
  border-top-left-radius:5px}
.chat-msg.user .chat-bubble{background:var(--gold-bg);color:var(--ink);border-top-right-radius:5px}

/* markdown */
.md-p{margin:0 0 9px}
.md-p:last-child{margin-bottom:0}
.md-ul{margin:2px 0 9px;padding-left:17px}
.md-ul:last-child{margin-bottom:0}
.md-ul li{margin:3px 0}
.md-h{font-size:14px;font-weight:700;margin:3px 0 7px;color:var(--ink)}
.md-ul li::marker{color:var(--gold)}
.chat-bubble strong{font-weight:700;color:var(--ink)}
.chat-bubble code{background:var(--gray-bg);padding:1px 5px;border-radius:4px;font-size:12px}

/* typing */
.typing{display:flex;gap:4px;align-items:center;padding:15px 16px !important}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink3);display:block;
  animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

/* 底部输入 */
.chat-input-bar{flex-shrink:0;padding:10px 16px 20px;background:#fff;
  border-top:1px solid var(--line)}
.voice-bar{display:flex;align-items:center;gap:10px}
.voice-main{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  height:46px;border-radius:23px;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;
  font-size:var(--fs-body-lg);font-weight:600;letter-spacing:.3px;
  box-shadow:0 8px 18px rgba(184,134,11,.25);transition:.15s;
  touch-action:none;user-select:none;-webkit-user-select:none}
.voice-main:active,.voice-main.holding{transform:scale(.97)}
.voice-main svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.kb-btn{width:44px;height:46px;border-radius:23px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:.15s}
.kb-btn:active{background:var(--gray-bg)}
.kb-btn svg{width:20px;height:20px;stroke:var(--ink2);stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.voice-mini{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--gold);cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:.15s}
.voice-mini:active{background:var(--gold-bg)}
.voice-mini svg{width:20px;height:20px;stroke:var(--gold);stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.chat-input-row input{flex:1;padding:11px 16px;border:1.5px solid var(--line);
  border-radius:22px;font-size:var(--fs-body);outline:none;font-family:inherit;
  color:var(--ink);background:#fff;min-width:0}
.chat-input-row input:focus{border-color:var(--gold)}
.chat-send{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:.15s}
.chat-send:active{transform:scale(.94)}
.chat-send svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ===== 极简语音提示 HUD ===== */
.voice-hud{position:absolute;left:50%;bottom:102px;
  transform:translateX(-50%) translateY(8px) scale(.94);
  background:rgba(20,32,47,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:16px;padding:12px 22px;display:none;flex-direction:column;align-items:center;
  gap:8px;z-index:160;opacity:0;pointer-events:none;
  transition:opacity .16s,transform .2s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 12px 34px rgba(15,27,45,.30)}
.voice-hud.open{display:flex;opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.voice-hud.cancel{background:rgba(200,16,46,.94)}
.vh-wave{display:flex;gap:3px;align-items:center;height:22px}
.vh-wave span{width:3px;border-radius:2px;background:#fff;
  animation:vhWave 1s ease-in-out infinite}
.vh-wave span:nth-child(1){height:10px;animation-delay:0s}
.vh-wave span:nth-child(2){height:18px;animation-delay:.1s}
.vh-wave span:nth-child(3){height:24px;animation-delay:.2s}
.vh-wave span:nth-child(4){height:18px;animation-delay:.3s}
.vh-wave span:nth-child(5){height:10px;animation-delay:.4s}
@keyframes vhWave{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1.1)}}
.vh-txt{font-size:var(--fs-sm);font-weight:600;color:#fff;letter-spacing:.6px;
  white-space:nowrap}

/* ===== 抽屉 ===== */
.drawer-mask{position:absolute;inset:0;background:rgba(15,27,45,.30);z-index:290;
  opacity:0;pointer-events:none;transition:opacity .26s}
.drawer-mask.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;left:0;bottom:0;width:274px;background:#fff;z-index:300;
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  box-shadow:8px 0 40px rgba(15,27,45,.16);display:flex;flex-direction:column;
  border-radius:0 22px 22px 0;overflow:hidden}
.drawer.open{transform:translateX(0)}
.drawer-body{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 0 20px}
.drawer-body::-webkit-scrollbar{display:none}
.dw-head{padding:56px 18px 18px;background:linear-gradient(160deg,#FDF9EE,#F6F8FB)}
.dw-user{display:flex;align-items:center;gap:12px}
.dw-avatar{width:46px;height:46px;border-radius:50%;background:var(--gray-bg);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-title);
  font-weight:700;color:var(--ink3);flex-shrink:0}
.dw-avatar.logged{background:linear-gradient(135deg,var(--wechat),#059669);color:#fff}
.dw-name{font-size:var(--fs-body-lg);font-weight:700}
.dw-sub{font-size:var(--fs-xs);color:var(--ink3);margin-top:3px}
.dw-login{margin-top:12px;width:100%;background:var(--wechat);color:#fff;border:none;
  padding:9px;border-radius:10px;font-size:var(--fs-sm);font-weight:600;cursor:pointer;
  font-family:inherit}
.dw-login:active{opacity:.9}
.dw-logout{margin-top:12px;width:100%;background:transparent;color:var(--ink3);
  border:1px solid var(--line);padding:9px;border-radius:10px;font-size:var(--fs-sm);
  cursor:pointer;font-family:inherit}

.dw-sec{font-size:var(--fs-micro);color:var(--ink3);font-weight:700;letter-spacing:1px;
  padding:18px 20px 8px}
.dw-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;
  font-size:var(--fs-body);color:var(--ink);transition:.15s}
.dw-item:active{background:var(--gray-bg)}
.dw-item .dw-ico{width:30px;height:30px;border-radius:9px;background:var(--gold-bg);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-sm);font-weight:700;flex-shrink:0}
.dw-item .dw-ico.blue{background:var(--blue-bg);color:var(--blue)}
.dw-item .dw-ico.gray{background:var(--gray-bg);color:var(--ink2)}
.dw-item .dw-txt{flex:1}
.dw-item .dw-arrow{color:var(--ink3);font-size:var(--fs-body)}
.dw-ver{padding:18px 20px 0;font-size:var(--fs-micro);color:var(--ink3)}

/* ===== 页面 ===== */
.page{padding:4px 18px 30px}
.hd{padding:2px 2px 14px}
.hd-title{font-size:var(--fs-display);font-weight:600;letter-spacing:-.3px;line-height:1.2}
.hd-sub{font-size:var(--fs-sm);color:var(--ink3);margin-top:5px}

/* 历史对话 */
.hist-list{display:flex;flex-direction:column;gap:9px}
.hist-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 14px;cursor:pointer;transition:.15s}
.hist-card:active{transform:scale(.99);background:#FCFDFF}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-date{font-size:var(--fs-micro);font-weight:700;color:var(--gold);letter-spacing:.6px;
  background:var(--gold-bg);padding:2px 7px;border-radius:5px}
.hist-time{font-size:var(--fs-micro);color:var(--ink3)}
.hist-title{font-size:var(--fs-body);font-weight:700;color:var(--ink);margin-bottom:4px}
.hist-preview{font-size:var(--fs-sm);color:var(--ink2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist-foot{margin-top:8px;font-size:var(--fs-micro);color:var(--ink3)}

.hist-msgs{margin-bottom:6px}
.hm{display:flex;margin-bottom:9px}
.hm.user{justify-content:flex-end}
.hm-b{max-width:86%;padding:9px 12px;border-radius:12px;font-size:var(--fs-base);
  line-height:1.65}
.hm.ai .hm-b{background:var(--gray-bg);border-top-left-radius:4px;color:var(--ink)}
.hm.user .hm-b{background:var(--gold-bg);border-top-right-radius:4px;color:var(--ink)}

/* ===== 健康管理 ===== */
.user-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.user-avatar{width:52px;height:52px;border-radius:50%;background:var(--gray-bg);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-title);
  font-weight:700;color:var(--ink3);flex-shrink:0;overflow:hidden}
.user-avatar.logged{background:linear-gradient(135deg,var(--wechat),#059669);color:#fff}
.user-main{flex:1;min-width:0}
.user-name{font-size:var(--fs-title);font-weight:700;color:var(--ink)}
.user-sub{font-size:var(--fs-sm);color:var(--ink3);margin-top:4px}
.user-login-btn{flex-shrink:0;background:var(--wechat);color:#fff;border:none;
  padding:9px 15px;border-radius:20px;font-size:var(--fs-sm);font-weight:600;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.user-login-btn:active{opacity:.9}
.user-logout{flex-shrink:0;color:var(--ink3);font-size:var(--fs-sm);cursor:pointer;
  padding:6px 4px}

.sec{font-size:var(--fs-sm);font-weight:600;color:var(--ink2);margin:20px 2px 10px;
  letter-spacing:.2px}
.mgr-group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:0 16px;margin-bottom:8px}
.mgr-row{display:flex;align-items:center;gap:14px;padding:15px 0;
  border-bottom:1px solid var(--line2);cursor:pointer}
.mgr-row:last-child{border-bottom:none}
.mgr-row:active{opacity:.7}
.mgr-row-ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--gold-bg);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-sm);font-weight:700;flex-shrink:0}
.mgr-row-ico.blue{background:var(--blue-bg);color:var(--blue)}
.mgr-row-main{flex:1;min-width:0}
.mgr-row-t{font-size:var(--fs-body);color:var(--ink);font-weight:500}
.mgr-row-s{font-size:var(--fs-sm);color:var(--ink3);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mgr-row-val{font-size:var(--fs-sm);color:var(--ink3);flex-shrink:0}

/* ===== Sheet ===== */
.modal{position:fixed;inset:0;background:rgba(15,27,45,.45);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:500;
  overscroll-behavior:contain}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  background:#fff;border-radius:24px 24px 0 0;padding:22px 20px 38px;
  position:relative;animation:up .3s cubic-bezier(.2,.9,.3,1);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(60px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sh-head{margin-bottom:18px}
.sh-title-row{display:flex;align-items:flex-start;justify-content:space-between}
.sh-name{font-size:var(--fs-title);font-weight:600}
.sh-date{font-size:var(--fs-sm);color:var(--ink3);margin-top:5px;letter-spacing:.3px}
.sh-x{width:30px;height:30px;border-radius:50%;background:var(--gray-bg);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--fs-body);
  flex-shrink:0}

.detail-block{margin-bottom:18px}
.detail-block:last-child{margin-bottom:0}
.detail-t{font-size:var(--fs-micro);color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:10px}
.detail-p{font-size:var(--fs-base);color:var(--ink2);line-height:1.75}

.kv-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line2);font-size:var(--fs-base)}
.kv-row:last-child{border-bottom:none}
.kv-k{width:76px;flex-shrink:0;color:var(--ink3);font-size:var(--fs-sm)}
.kv-v{flex:1;color:var(--ink);line-height:1.6;text-align:right}

.rec-item{padding:11px 0;border-bottom:1px solid var(--line2)}
.rec-item:last-child{border-bottom:none}
.rec-date{font-size:var(--fs-xs);color:var(--ink3)}
.rec-title{font-size:var(--fs-base);font-weight:600;color:var(--ink);margin-top:3px}
.rec-desc{font-size:var(--fs-sm);color:var(--ink2);line-height:1.6;margin-top:4px}

.sh-btn{margin-top:18px;background:var(--ink);color:#fff;font-size:var(--fs-body-lg);
  font-weight:600;text-align:center;padding:14px;border-radius:var(--r-md);cursor:pointer}
.sh-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500}

.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
  background:rgba(15,27,45,.9);color:#fff;font-size:var(--fs-base);padding:11px 20px;
  border-radius:20px;z-index:600;animation:fade .2s;white-space:nowrap}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>06:35</span><span class="r">5G · 87%</span></div>
  <div class="appbar" id="appbar"></div>
  <main class="screen" id="screen"></main>

  <!-- 极简语音 HUD -->
  <div class="voice-hud" id="voiceHud">
    <div class="vh-wave"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="vh-txt" id="vhTxt">松开发送 · 上滑取消</div>
  </div>

  <!-- 抽屉 -->
  <div class="drawer-mask" id="drawerMask" data-drawer-close></div>
  <aside class="drawer" id="drawer"><div class="drawer-body" id="drawerBody"></div></aside>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ 基础工具 ============ */
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function toast(msg){
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  document.querySelector('.phone').appendChild(d);
  setTimeout(()=>d.remove(), 1800);
}

/* ---------- Markdown 轻量渲染 ---------- */
function inlineMd(s){
  return s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function mdToHtml(src){
  const lines = escapeHtml(src || '').split('\n');
  let html = '';
  let listOpen = false;
  const closeList = ()=>{ if(listOpen){ html += '</ul>'; listOpen = false; } };

  for(let i=0;i<lines.length;i++){
    const raw = lines[i];
    const line = raw.trim();

    if(!line){ closeList(); continue; }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if(h){
      closeList();
      const lvl = Math.min(h[1].length + 2, 6);
      html += `<h${lvl} class="md-h">${inlineMd(h[2])}</h${lvl}>`;
      continue;
    }

    const li = line.match(/^[-*·]\s+(.*)$/);
    if(li){
      if(!listOpen){ html += '<ul class="md-ul">'; listOpen = true; }
      html += `<li>${inlineMd(li[1])}</li>`;
      continue;
    }

    closeList();
    html += `<p class="md-p">${inlineMd(line)}</p>`;
  }
  closeList();
  return html || '';
}

/* ============ 称呼提取 ============ */
const NEUTRAL_NAMES = ['随便','都行','你','你吧','无所谓','不知道','你看着办','随便吧',
  '都可以','你定','看你','随便叫','随便你','都行吧','你决定','你说了算','没什么',
  '没想好','还没想好','你猜','爱叫啥叫啥'];

function extractName(text){
  let t = String(text || '').trim();
  if(!t) return '';
  t = t.replace(/^[\s。！!？?，,、；;：:]+|[\s。！!？?，,、；;：:]+$/g,'');

  const m = t.match(
    /(?:就叫你|叫你|称呼你|喊你|就叫我|叫我|称呼我|喊我|就叫)\s*([^\s，。！？,、；:]{1,12}?)(?:吧|就行|就好了|好了|啦|哈|呀|啊|呗|$)/
  );
  let name = m ? m[1] : '';

  if(!name){
    name = t
      .replace(/^(?:就叫|叫我|叫你|称呼我|称呼你|喊我|喊你|我叫|我是|名字叫|名字是|我叫作|我叫做)/,'')
      .replace(/(?:吧|就行|就好了|好了|啦|哈|呀|啊|呗|就成|得了|就好)$/,'')
      .trim();
  }

  name = name.replace(/^[「『"“'（(]+|[」』"”'）)]+$/g,'').trim();

  if(!name) return '';
  if(NEUTRAL_NAMES.includes(name)) return '';
  if(/随便|都行|无所谓|你定|看你|不知道|没想好|你说了算/.test(name)) return '';
  return name.slice(0,12);
}

/* ---------- 持久化：刷新后恢复上一段对话 ---------- */
function restoreState(){
  try{
    const raw = sessionStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(!s || typeof s !== 'object') return;

    if(Array.isArray(s.chat)) state.chat = s.chat;

    if(s.ob && typeof s.ob === 'object'){
      state.ob.started = !!s.ob.started;
      state.ob.done = !!s.ob.done;
      state.ob.step = Number(s.ob.step) || 0;
      state.ob.pending = s.ob.pending || null;
      state.ob.answers = (s.ob.answers && typeof s.ob.answers === 'object') ? s.ob.answers : {};
      if(state.ob.step >= OB_STEPS.length) state.ob.done = true;
    }

    if(typeof s.loggedIn === 'boolean') state.loggedIn = s.loggedIn;
    if(s.user && typeof s.user === 'object') state.user = s.user;
    if(s.inputMode === 'voice' || s.inputMode === 'text') state.inputMode = s.inputMode;
  }catch(_){}
}

let saveTimer = null;
function saveState(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    try{
      sessionStorage.setItem(SAVE_KEY, JSON.stringify({
        chat: state.chat,
        ob: state.ob,
        loggedIn: state.loggedIn,
        user: state.user,
        inputMode: state.inputMode
      }));
    }catch(_){}
  }, 180);
}

/* ============ AI 说话队列 ============ */
let aiChain = Promise.resolve();
let pendingAI = 0;

function aiSay(text, delay){
  pendingAI++;
  state.chatBusy = true;
  const wait = delay != null ? delay : Math.min(1100, 420 + Math.round(String(text).length * 6));

  aiChain = aiChain.then(() => new Promise(resolve => {
    const scroll = document.getElementById('chatScroll');

    if(!scroll){
      state.chat.push({role:'ai', text});
      saveState();
      pendingAI--; state.chatBusy = pendingAI > 0;
      resolve();
      return;
    }

    const typing = appendTyping();
    scrollChatToBottom();

    setTimeout(()=>{
      if(typing) typing.remove();
      const m = {role:'ai', text};
      state.chat.push(m);
      appendChatMessage(m);
      scrollChatToBottom();
      saveState();
      pendingAI--; state.chatBusy = pendingAI > 0;
      resolve();
    }, wait);
  }));

  return aiChain;
}

/* ============ 建档流程 ============ */
function askCurrentStep(prevSkipped){
  const ob = state.ob;
  if(ob.step >= OB_STEPS.length){ finishOnboard(); return; }
  const step = OB_STEPS[ob.step];
  const q = step.ask(ob.answers, {prevSkipped: !!prevSkipped});
  aiSay(q, 780);
}

function finishOnboard(){
  state.ob.done = true;
  saveState();
  aiSay('好，我大概记下了。\n\n以后你随时可以跟我说今天吃了什么、哪儿不舒服、走了多少步，我帮你记着。需要提醒的我会轻轻提醒，不会烦你，随时可以让我关掉。', 900);
}

function onUserAnswer(text){
  const ob = state.ob;
  const skipped = SKIP_RE.test(text);

  /* 正在追问中 */
  if(ob.pending){
    if(!skipped) ob.answers[ob.pending.key] = text;
    ob.pending = null;
    ob.step++;
    saveState();
    askCurrentStep(skipped);
    return;
  }

  const step = OB_STEPS[ob.step];
  if(!step){ finishOnboard(); return; }

  if(skipped){
    aiSay('好，那先不聊这个。', 460).then(()=>{
      ob.step++;
      saveState();
      askCurrentStep(true);
    });
    return;
  }

  /* 称呼类做提取 */
  if(step.key === 'aiName' || step.key === 'userName'){
    ob.answers[step.key] = extractName(text);
  } else {
    ob.answers[step.key] = text;
  }
  saveState();

  const follow = step.follow ? step.follow(text) : null;
  if(follow){
    ob.pending = {key: follow.key};
    saveState();
    aiSay(follow.q, 720);
    return;
  }

  ob.step++;
  saveState();
  askCurrentStep(false);
}

    return '颈肩僵起来确实难受，我能理解。\n\n现在就可以试一下：双肩慢慢向前绕 10 次，再向后绕 10 次，动作轻一点。\n\n平时伏案一小时，记得起来活动两分钟。\n\n如果手麻或者头晕，记得早点去看医生，别硬扛。';
  }
  return '嗯，我在听。\n\n你可以跟我说说最近睡得怎么样、血压有没有变化、应酬多不多，或者哪里不太舒服。\n\n不着急，我们一点一点来，我会每天来问问你。';
}

/* ============ 发送 ============ */
function sendChat(text){
  const t = (text || '').trim();
  if(!t || state.chatBusy) return;

  const userMsg = {role:'user', text:t};
  state.chat.push(userMsg);
  appendChatMessage(userMsg);
  scrollChatToBottom();
  saveState();

  const input = document.getElementById('chatInput');
  if(input) input.value = '';

  if(!state.ob.done){
    onUserAnswer(t);
  } else {
    aiSay(aiReply(t), 760);
  }
}
function sendChatWhenReady(text, tries){
  tries = tries || 0;
  if(state.chatBusy && tries < 30){
    setTimeout(()=>sendChatWhenReady(text, tries+1), 160);
    return;
  }
  sendChat(text);
}

/* ============ 按住说话 ============ */
function voiceDemoText(){
  if(!state.ob.done){
    if(state.ob.pending) return VOICE_BY_KEY[state.ob.pending.key] || '不想说';
    const step = OB_STEPS[state.ob.step];
    if(step) return VOICE_BY_KEY[step.key] || '不想说';
  }
  const t = VOICE_FREE[state.voiceIndex % VOICE_FREE.length];
  state.voiceIndex += 1;
  return t;
}

function startVoiceHold(e, btn){
  const v = state.voice;
  if(v.active) return;
  e.preventDefault();

  v.active = true;
  v.canceled = false;
  v.startY = e.clientY;
  v.startT = Date.now();
  v.text = voiceDemoText();
  v.btn = btn;
  v.pointerId = e.pointerId;

  try{ btn.setPointerCapture(e.pointerId); }catch(_){}
  btn.classList.add('holding');

  const hud = document.getElementById('voiceHud');
  const txt = document.getElementById('vhTxt');
  if(txt) txt.textContent = '松开发送 · 上滑取消';
  hud.classList.remove('cancel');
  hud.classList.add('open');

  btn.addEventListener('pointermove', onVoiceMove);
  btn.addEventListener('pointerup', endVoiceHold);
  btn.addEventListener('pointercancel', endVoiceHold);
}

function onVoiceMove(e){
  const v = state.voice;
  if(!v.active) return;
  const dy = v.startY - e.clientY;
  const shouldCancel = dy > 60;
  if(shouldCancel !== v.canceled){
    v.canceled = shouldCancel;
    const hud = document.getElementById('voiceHud');
    const txt = document.getElementById('vhTxt');
    hud.classList.toggle('cancel', shouldCancel);
    if(txt) txt.textContent = shouldCancel ? '松开取消' : '松开发送 · 上滑取消';
  }
}

function endVoiceHold(){
  const v = state.voice;
  if(!v.active) return;
  v.active = false;

  const btn = v.btn;
  if(btn){
    btn.removeEventListener('pointermove', onVoiceMove);
    btn.removeEventListener('pointerup', endVoiceHold);
    btn.removeEventListener('pointercancel', endVoiceHold);
    btn.classList.remove('holding');
    try{ btn.releasePointerCapture(v.pointerId); }catch(_){}
  }

  const hud = document.getElementById('voiceHud');
  if(hud) hud.classList.remove('open', 'cancel');

  const wasCanceled = v.canceled;
  const text = v.text;
  v.canceled = false;
  v.btn = null;

  if(!wasCanceled && text){
    setTimeout(()=>sendChatWhenReady(text), 40);
  }
}

/* ============ 渲染入口 ============ */
const ICON_MENU = `<svg viewBox="0 0 24 24" width="21" height="21" fill="none"
  stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
  <path d="M4 7h16M4 12h16M4 17h16"/></svg>`;
const ICON_BACK = `<svg viewBox="0 0 24 24" width="21" height="21" fill="none"
  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M15 5l-7 7 7 7"/></svg>`;

function renderAppbar(){
  const isChat = state.view === 'chat';
  const title = state.view === 'chat' ? '健康助手'
              : state.view === 'history' ? '历史对话' : '健康管理';
  document.getElementById('appbar').innerHTML = `
    ${isChat
      ? `<button class="appbar-btn" data-drawer-open>${ICON_MENU}</button>`
      : `<button class="appbar-btn" data-back>${ICON_BACK}</button>`}
    <div class="appbar-title">${title}</div>
  `;
}

function render(){
  renderAppbar();

  const screen = document.getElementById('screen');

  if(state.view === 'chat'){
    screen.innerHTML = renderChat();
    setTimeout(scrollChatToBottom, 30);

    /* 只有完全没有任何对话内容时，才发起首次认识流程 */
    if(state.chat.length === 0){
      state.ob.started = true;
      saveState();
      aiSay(OB_STEPS[0].ask(state.ob.answers, {}), 900);
    }
  } else if(state.view === 'history'){
    screen.innerHTML = renderHistory();
    screen.scrollTop = 0;
  } else {
    screen.innerHTML = renderManage();
    screen.scrollTop = 0;
  }
}

/* ============ Sheet ============ */
function openSheet(title, body){
  document.getElementById('sheet').innerHTML = `
    <div class="sh-head">
      <div class="sh-title-row">
        <div style="flex:1;min-width:0">
          <div class="sh-name">${title}</div>
        </div>
        <div class="sh-x" data-close>✕</div>
      </div>
    </div>
    ${body}`;
  document.getElementById('modal').classList.add('open');
  document.getElementById('sheet').scrollTop = 0;
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}

function openProfile(key){
  if(key === 'basic'){
    const rows = PROFILE.basic.map(it=>
      `<div class="kv-row"><div class="kv-k">${it.k}</div><div class="kv-v">${it.v}</div></div>`
    ).join('');
    openSheet('基础信息', `
      <div class="detail-block">${rows}</div>
      <div class="sh-btn ghost" data-close>关闭</div>
    `);
    return;
  }
  if(key === 'records'){
    const rows = PROFILE.records.map(r=>
      `<div class="rec-item">
        <div class="rec-date">${r.date}</div>
        <div class="rec-title">${r.title}</div>
        <div class="rec-desc">${r.desc}</div>
      </div>`
    ).join('');
    openSheet('病例与体检报告', `
      <div class="detail-block">${rows}</div>
      <div class="sh-btn ghost" data-close>关闭</div>
    `);
    return;
  }
  if(key === 'tcm'){
    const rows = PROFILE.tcm.map(it=>
      `<div class="kv-row"><div class="kv-k">${it.k}</div><div class="kv-v">${it.v}</div></div>`
    ).join('');
    openSheet('中医诊断', `
      <div class="detail-block">${rows}</div>
      <div class="sh-btn ghost" data-close>关闭</div>
    `);
    return;
  }
}

function openAgreement(key){
  const a = AGREEMENTS[key];
  if(!a) return;
  openSheet(a.title, `
    <div class="detail-block">
      <div class="detail-p" style="white-space:pre-wrap">${escapeHtml(a.body)}</div>
    </div>
    <div class="sh-btn ghost" data-close>关闭</div>
  `);
}

/* ============ 事件 ============ */
document.addEventListener('click', e=>{
  /* 抽屉 */
  if(e.target.closest('[data-drawer-open]')){ openDrawer(); return; }
  if(e.target.closest('[data-drawer-close]')){ closeDrawer(); return; }

  const go = e.target.closest('[data-go]');
  if(go){
    closeDrawer();
    state.view = go.dataset.go;
    render();
    return;
  }
  if(e.target.closest('[data-back]')){
    state.view = 'chat';
    render();
    return;
  }

  /* 语音 / 文字切换 */
  const modeBtn = e.target.closest('[data-input-mode]');
  if(modeBtn){
    state.inputMode = modeBtn.dataset.inputMode;
    saveState();
    render();
    setTimeout(()=>{
      if(state.inputMode === 'text'){
        const inp = document.getElementById('chatInput');
        if(inp) inp.focus();
      }
      scrollChatToBottom();
    }, 30);
    return;
  }

  /* 发送 */
  if(e.target.closest('[data-chat-send]')){
    const input = document.getElementById('chatInput');
    sendChat(input ? input.value : '');
    return;
  }

  /* 历史 */
  const hist = e.target.closest('[data-history]');
  if(hist){ openHistory(hist.dataset.history); return; }

  /* 登录 */
  if(e.target.closest('[data-login]')){
    state.loggedIn = true;
    state.user = {name:'钱主席', id:'BR-2026-0813'};
    saveState();
    renderDrawer();
    if(state.view === 'manage') render();
    setTimeout(()=>toast('登录成功'), 120);
    return;
  }
  if(e.target.closest('[data-logout]')){
    state.loggedIn = false;
    state.user = {name:'', id:''};
    saveState();
    renderDrawer();
    if(state.view === 'manage') render();
    return;
  }

  const profile = e.target.closest('[data-profile]');
  if(profile){ openProfile(profile.dataset.profile); return; }
  const agr = e.target.closest('[data-agreement]');
  if(agr){ openAgreement(agr.dataset.agreement); return; }

  if(e.target.closest('[data-close]') || e.target.id === 'modal'){
    closeModal();
  }
});

/* 按住说话：pointerdown 委托 */
document.addEventListener('pointerdown', e=>{
  const btn = e.target.closest('[data-voice-start]');
  if(btn) startVoiceHold(e, btn);
});

document.addEventListener('keydown', e=>{
  if(e.target.id === 'chatInput' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendChat(e.target.value);
  }
});

/* ============ 启动 ============ */
restoreState();
render();
</script>
