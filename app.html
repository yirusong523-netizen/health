<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老板健康俱乐部 · 健康数字化</title>
<style>
:root{
  --bg:#0A0E13; --bg2:#111821; --bg3:#141B24;
  --line:#23201A; --line2:#1B1F26;
  --gold:#D4AF37; --gold-d:#8A6E1A; --gold-bg:rgba(212,175,55,.1);
  --ink:#E8EEF5; --ink2:#D8CDB5; --ink3:#A89C7E; --ink4:#7A7568; --ink5:#6B6758;
  --green:#2ED47A; --blue:#4A9EFF; --red:#F2555A; --amber:#F2A93B; --purple:#8B7CF6; --pink:#FF6B9D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(circle at 50% 0%,#14110A,#05070A 70%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);padding:24px;
}
.phone{
  width:400px;height:844px;background:var(--bg);border-radius:42px;
  border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.85),0 0 0 9px #0d1218,0 0 0 10px #1b242e;
  position:relative;
}
.statusbar{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:12.5px;color:#8A8578;letter-spacing:.4px;z-index:30;position:relative}
.screen{flex:1;overflow-y:auto;padding:0 18px 108px;scrollbar-width:none;position:relative}
.screen::-webkit-scrollbar{display:none}

/* ---------- 底部导航 ---------- */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:80px;display:flex;
  background:rgba(10,14,19,.96);backdrop-filter:blur(24px);
  border-top:1px solid var(--line);padding-bottom:18px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font-size:10px;color:#5A5548;cursor:pointer;transition:.2s;user-select:none}
.tab .ico{font-size:20px;line-height:1;filter:grayscale(1) opacity(.5)}
.tab.active{color:var(--gold)}
.tab.active .ico{filter:none;transform:scale(1.05)}

/* ---------- 通用 ---------- */
.sec-t{font-size:14px;font-weight:600;color:var(--ink2);letter-spacing:.3px;
  display:flex;align-items:center;gap:8px;margin:20px 2px 11px}
.sec-t .bar{width:3px;height:13px;border-radius:2px;background:var(--gold)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px}
.muted{color:var(--ink5);font-size:11.5px;line-height:1.6}
.greet{padding:6px 2px 16px}
.g-date{font-size:12.5px;color:var(--ink5);letter-spacing:.8px}
.g-hello{font-size:23px;font-weight:600;margin-top:7px;letter-spacing:.5px}
.g-hello span{color:var(--gold)}

/* ---------- 健康分 ---------- */
.hero{background:linear-gradient(135deg,#1C1810,var(--bg2));border:1px solid #3A2E18;
  border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
  cursor:pointer;transition:.15s}
.hero:active{transform:scale(.985)}
.hero::before{content:'';position:absolute;top:-50px;right:-40px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.15),transparent 70%)}
.hero-top{display:flex;align-items:baseline;gap:10px;position:relative}
.hero-label{font-size:12.5px;color:var(--ink3);letter-spacing:1px}
.hero-num{font-size:42px;font-weight:700;color:var(--gold);line-height:1;letter-spacing:.5px}
.hero-delta{font-size:12.5px;color:var(--green);background:rgba(46,212,122,.12);
  padding:3px 9px;border-radius:20px;margin-left:auto}
.hero-msg{font-size:14px;line-height:1.65;color:var(--ink2);margin-top:13px;position:relative}
.hero-assets{display:flex;gap:5px;margin-top:14px;padding-top:13px;
  border-top:1px solid rgba(212,175,55,.16);position:relative}
.hero-asset{flex:1;text-align:center}
.hero-asset-n{font-size:14px;font-weight:700;letter-spacing:.3px}
.hero-asset-l{font-size:9px;color:var(--ink4);margin-top:4px}

/* ---------- 九宫格 ---------- */
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g9{background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  padding:14px 6px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.g9:active{background:#161A20;transform:scale(.97)}
.g9-ico{font-size:22px;margin-bottom:8px}
.g9-nm{font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.g9-score{font-size:18px;font-weight:700;letter-spacing:.3px}
.g9-bar{height:3px;background:#1A1E24;border-radius:3px;overflow:hidden;margin-top:7px}
.g9-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.9,.3,1)}

/* ---------- 寿命预测 ---------- */
.life-hero{background:linear-gradient(150deg,#1C1810,var(--bg2));
  border:1px solid #3A2E18;border-radius:22px;padding:26px 20px;text-align:center;
  margin-bottom:14px;position:relative;overflow:hidden}
.life-hero::before{content:'';position:absolute;top:-60px;right:-50px;
  width:180px;height:180px;border-radius:50%;background:rgba(212,175,55,.1)}
.life-hero::after{content:'';position:absolute;bottom:-70px;left:-40px;
  width:160px;height:160px;border-radius:50%;background:rgba(212,175,55,.05)}
.life-hero-t{font-size:15px;font-weight:700;color:var(--ink2);
  margin-bottom:6px;position:relative;z-index:1}
.life-hero-s{font-size:12px;color:var(--ink4);margin-bottom:20px;position:relative;z-index:1}

.life-compare{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;margin-bottom:14px}
.life-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);
  border-radius:13px;padding:14px 16px}
.life-row.mine{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3)}
.life-row-lb{font-size:12.5px;color:var(--ink3);width:92px;flex-shrink:0}
.life-row-val{font-size:20px;font-weight:700;color:var(--gold)}
.life-row-val span{font-size:12px;font-weight:400;color:var(--ink4);margin-left:2px}
.life-row-tag{margin-left:auto;font-size:10.5px;color:var(--ink4)}
.life-row.mine .life-row-tag{color:var(--gold)}

.life-gap{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.28);
  border-radius:13px;padding:14px;text-align:center;font-size:13px;
  position:relative;z-index:1;color:var(--ink2);line-height:1.65}
.life-gap b{color:var(--gold);font-size:17px}

/* ---------- 健康日记 ---------- */
.diary-hero{background:linear-gradient(135deg,#141B24,var(--bg2));border:1px solid var(--line);
  border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;transition:.15s}
.diary-hero:active{transform:scale(.985)}
.diary-hero-top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.diary-hero-ico{width:46px;height:46px;border-radius:14px;background:var(--gold-bg);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.diary-hero-t{font-size:16px;font-weight:600;color:var(--ink2)}
.diary-hero-s{font-size:12px;color:var(--ink4);margin-top:5px}
.diary-hero-go{margin-left:auto;font-size:20px;color:#3A3628}
.diary-items{display:flex;flex-wrap:wrap;gap:6px}
.diary-chip{font-size:11px;color:var(--ink3);background:var(--bg3);
  border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.diary-chip.done{color:var(--green);border-color:rgba(46,212,122,.3);background:rgba(46,212,122,.08)}

/* ---------- 今日行动 ---------- */
.ck{display:flex;align-items:center;gap:12px;background:var(--bg2);
  border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:8px;
  cursor:pointer;transition:.15s}
.ck:active{background:#161A20}
.ck-box{width:24px;height:24px;border-radius:8px;border:1.5px solid #2E2A22;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  color:transparent;flex-shrink:0;transition:.2s}
.ck.on .ck-box{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.ck-t{font-size:14px;color:var(--ink2);line-height:1.4;transition:.2s}
.ck.on .ck-t{color:var(--ink5);text-decoration:line-through}
.ck-s{font-size:11px;color:var(--ink5);margin-top:4px}
.ck-tag{font-size:9.5px;color:var(--gold);background:var(--gold-bg);
  padding:2px 7px;border-radius:10px;margin-left:6px;font-weight:600}

/* ---------- 健康秘书 ---------- */
.secretary{background:linear-gradient(135deg,#1C1810,var(--bg2));
  border:1px solid #3A2E18;border-radius:18px;padding:16px;margin-bottom:12px}
.sec-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.sec-av{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;
  justify-content:center;font-size:14px;color:var(--bg);font-weight:700;flex-shrink:0}
.sec-nm{font-size:14px;font-weight:600;color:var(--ink2)}
.sec-st{font-size:11px;color:var(--green);margin-top:3px;display:flex;align-items:center;gap:5px}
.sec-st::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green)}
.sec-msg{font-size:13.5px;color:var(--ink2);line-height:1.7;
  padding:12px 14px;background:rgba(0,0,0,.25);border-radius:12px}
.sec-actions{display:flex;gap:8px;margin-top:12px}
.sec-actions div{flex:1;text-align:center;padding:11px;border-radius:11px;
  font-size:12.5px;font-weight:600;cursor:pointer}
.sec-call{background:var(--gold);color:var(--bg)}
.sec-chat{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);color:var(--gold)}

/* ---------- 推荐 ---------- */
.rec-row{display:flex;gap:11px;background:var(--bg2);border:1px solid var(--line);
  border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer;transition:.15s}
.rec-row:active{background:#161A20}
.rec-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:19px;flex-shrink:0}
.rec-t{font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.35}
.rec-s{font-size:11px;color:var(--ink4);margin-top:5px;line-height:1.5}

/* ---------- 管理工具 ---------- */
.mgr-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mgr{background:var(--bg2);border:1px solid var(--line);border-radius:15px;
  padding:16px 14px;cursor:pointer;transition:.15s}
.mgr:active{background:#161A20;transform:scale(.98)}
.mgr-ico{font-size:24px;margin-bottom:10px}
.mgr-nm{font-size:14px;font-weight:600;color:var(--ink2)}
.mgr-s{font-size:11px;color:var(--ink4);margin-top:6px;line-height:1.5}

/* ---------- 我的 ---------- */
.me-hd{display:flex;align-items:center;gap:14px;padding:10px 2px 18px}
.me-av{width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;
  justify-content:center;font-size:22px;color:var(--bg);font-weight:700;flex-shrink:0}
.me-nm{font-size:19px;font-weight:600}
.me-role{font-size:12px;color:#8A8578;margin-top:5px}
.me-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--gold);
  background:var(--gold-bg);border:1px solid rgba(212,175,55,.25);
  padding:3px 9px;border-radius:20px;margin-top:8px}

.me-strategy{background:linear-gradient(135deg,#1C1810,var(--bg2));border:1px solid #3A2E18;
  border-radius:18px;padding:18px;margin-bottom:11px;cursor:pointer;transition:.15s}
.me-strategy:active{transform:scale(.985)}
.me-strategy-lb{font-size:11px;color:var(--gold);letter-spacing:1.5px;font-weight:600}
.me-strategy-t{font-size:17px;font-weight:600;color:var(--ink);margin-top:10px;line-height:1.4}
.me-strategy-s{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.6}
.me-strategy-foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;padding-top:13px;border-top:1px solid rgba(212,175,55,.16)}
.me-strategy-d{font-size:11.5px;color:var(--ink4)}
.me-strategy-go{font-size:12px;color:var(--gold)}

.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tm{background:var(--bg2);border:1px solid var(--line);border-radius:15px;
  padding:14px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:.15s}
.tm:active{background:#161A20;transform:scale(.98)}
.tm-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:600;flex-shrink:0}
.tm-nm{font-size:13.5px;font-weight:600;color:var(--ink2)}
.tm-rl{font-size:11px;color:var(--ink4);margin-top:3px}

.src-row{display:flex;align-items:center;justify-content:space-between;
  padding:13px 2px;border-bottom:1px solid var(--line2);font-size:14px;cursor:pointer}
.src-row:last-child{border-bottom:none}
.src-l{display:flex;align-items:center;gap:11px;color:var(--ink2)}
.src-r{font-size:11.5px;color:var(--green)}
.src-r.gray{color:#8A8578}

/* ---------- 引导覆盖层 ---------- */
.onb{position:absolute;inset:0;background:var(--bg);z-index:50;display:none;
  flex-direction:column;border-radius:42px;overflow:hidden}
.onb.open{display:flex}
.onb-body{flex:1;overflow-y:auto;padding:0 22px;scrollbar-width:none}
.onb-body::-webkit-scrollbar{display:none}
.onb-foot{flex-shrink:0;padding:14px 22px 28px;background:var(--bg)}

.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 24px;text-align:center;min-height:100%}
.w-logo{font-size:12px;color:var(--gold);letter-spacing:5px;font-weight:600;margin-bottom:28px}
.w-title{font-size:26px;font-weight:700;line-height:1.4;letter-spacing:.5px}
.w-title span{color:var(--gold)}
.w-desc{font-size:13.5px;color:var(--ink3);line-height:1.85;margin-top:20px}
.w-steps{margin-top:32px;text-align:left}
.w-step{display:flex;gap:14px;padding:12px 0;align-items:flex-start}
.w-step-n{width:26px;height:26px;border-radius:50%;background:var(--gold-bg);
  color:var(--gold);font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px}
.w-step-t{font-size:14px;color:var(--ink2);line-height:1.5;font-weight:500}
.w-step-s{font-size:11.5px;color:var(--ink4);margin-top:5px;line-height:1.55}
.w-meta{font-size:10.5px;color:#5A5548;margin-top:28px;letter-spacing:.5px;line-height:1.8}

.q-head{padding:24px 0 18px}
.q-step{font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:600}
.q-title{font-size:21px;font-weight:600;line-height:1.4;margin-top:10px}
.q-sub{font-size:12.5px;color:var(--ink4);line-height:1.7;margin-top:11px}
.q-text{font-size:18px;font-weight:600;line-height:1.55;margin-bottom:20px}

.opt{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:8px;
  border:1.5px solid var(--line);border-radius:13px;background:var(--bg2);
  font-size:14px;cursor:pointer;transition:all .18s;font-family:inherit;
  color:var(--ink3);position:relative;line-height:1.6}
.opt:active{background:#161A20}
.opt.selected{border-color:var(--gold);background:var(--gold-bg);
  font-weight:600;color:var(--gold)}
.opt.selected::after{content:"";position:absolute;right:18px;top:50%;
  transform:translateY(-50%);width:7px;height:12px;
  border-right:2.5px solid var(--gold);border-bottom:2.5px solid var(--gold);rotate:45deg}

.year-wrap{background:var(--bg2);border:1.5px solid var(--line);border-radius:18px;
  padding:28px 22px;margin-bottom:18px}
.year-label{text-align:center;font-size:12px;color:var(--ink4);
  margin-bottom:14px;letter-spacing:.5px}
.year-box{width:100%;padding:20px 22px;border:2px solid var(--line);border-radius:14px;
  font-size:30px;font-weight:700;font-family:inherit;text-align:center;
  background:var(--bg);color:var(--gold);letter-spacing:4px}
.year-box:focus{outline:none;border-color:var(--gold);background:var(--gold-bg)}
.year-box::placeholder{color:#3A3628;font-weight:400;font-size:14px;letter-spacing:0}
.year-age{text-align:center;font-size:15px;color:var(--green);font-weight:600;
  margin-top:16px;min-height:26px}

.btn{display:inline-block;padding:14px 28px;border-radius:100px;border:none;
  font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink3);border:1.5px solid var(--line)}

.upload-btn{background:var(--gold);color:var(--bg);font-size:15px;
  font-weight:600;padding:14px;border-radius:14px;cursor:pointer;
  letter-spacing:.5px;text-align:center}
.upload-btn:active{opacity:.8}
.upload-alt{display:flex;gap:9px;margin-top:11px}
.upload-alt div{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:13px;
  padding:13px;text-align:center;font-size:13px;color:var(--ink3);cursor:pointer}
.upload-alt div:active{background:#161A20}

.gen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 34px;text-align:center;min-height:100%}
.gen-ring{width:80px;height:80px;border-radius:50%;border:3px solid #1E1B14;
  border-top-color:var(--gold);animation:spin 1s linear infinite;margin-bottom:26px}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-t{font-size:17px;font-weight:600;color:var(--ink2)}
.gen-s{font-size:12.5px;color:var(--ink4);line-height:1.7;margin-top:12px}
.gen-steps{margin-top:28px;text-align:left;width:100%}
.gen-step{display:flex;align-items:center;gap:11px;padding:8px 0;
  font-size:12.5px;color:#5A5548;transition:.3s}
.gen-step.on{color:var(--gold)}
.gen-step-dot{width:7px;height:7px;border-radius:50%;background:#2E2A22;flex-shrink:0;transition:.3s}
.gen-step.on .gen-step-dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* ---------- 结果页 ---------- */
.result{padding:20px 0 40px}
.result-hero{background:linear-gradient(150deg,#1C1810,var(--bg2));
  border:1px solid #3A2E18;border-radius:22px;padding:30px 22px;text-align:center;
  margin-bottom:14px;position:relative;overflow:hidden}
.result-hero::before{content:'';position:absolute;top:-60px;right:-50px;
  width:180px;height:180px;border-radius:50%;background:rgba(212,175,55,.1)}
.result-hero-t{font-size:15px;font-weight:700;color:var(--ink2);
  margin-bottom:6px;position:relative;z-index:1}
.result-hero-s{font-size:12px;color:var(--ink4);margin-bottom:20px;position:relative;z-index:1}

.life-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px;
  position:relative;z-index:1}
.life-item{background:rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.18);
  border-radius:15px;padding:20px 12px;text-align:center}
.life-val{font-size:30px;font-weight:700;line-height:1.1;color:var(--gold)}
.life-val small{font-size:13px;font-weight:500;margin-left:2px}
.life-lab{font-size:12px;color:var(--ink3);margin-top:8px}
.life-note{font-size:10.5px;color:var(--ink5);margin-top:4px}

.advice{border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;
  margin-bottom:11px;background:var(--bg2);position:relative}
.advice::before{content:"";position:absolute;left:0;top:18px;bottom:18px;
  width:3px;border-radius:99px;background:var(--gold)}
.advice-rank{font-size:10.5px;font-weight:700;letter-spacing:1.5px;
  color:var(--gold);margin-bottom:6px}
.advice h4{font-size:15px;font-weight:700;color:var(--ink2);
  margin-bottom:12px;line-height:1.5}
.advice ol{padding-left:18px;margin-bottom:11px}
.advice li{font-size:13px;margin-bottom:7px;line-height:1.7;color:var(--ink3)}
.advice-why{font-size:11.5px;color:var(--ink4);line-height:1.7;
  padding-top:10px;border-top:1px dashed var(--line)}

function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function colorOf(s){
  if(s>=80) return '#2ED47A';
  if(s>=65) return '#7fb069';
  if(s>=50) return '#D4AF37';
  if(s>=35) return '#F2A93B';
  return '#F2555A';
}

function renderQuiz(){
  const q = QUIZ[state.quizIndex];
  if(!q){ state.onbScreen='upload'; renderOnb(); return; }
  const cur = state.ans[q.k];
  let opts = '';

  if(q.type==='input'){
    opts = `<div class="year-wrap">
      <div class="year-label">请输入四位年份</div>
      <input type="number" class="year-box" id="yearInput" placeholder="${q.ph}" value="${cur||''}">
      <div class="year-age" id="yearAge">${cur?'您今年约 '+(new Date().getFullYear()-cur)+' 岁':'&nbsp;'}</div>
    </div>`;
  } else if(q.type==='single'){
    opts = q.opts.map((o,i)=>`
      <button class="opt ${cur===i+1?'selected':''}" data-single="${q.k}" data-val="${i+1}">${o}</button>
    `).join('');
  } else if(q.type==='scale'){
    opts = q.labels.map((l,i)=>`
      <button class="opt ${cur===i+1?'selected':''}" data-single="${q.k}" data-val="${i+1}">${l}</button>
    `).join('');
  } else if(q.type==='multi'){
    const arr = cur || [];
    opts = q.opts.map(o=>`
      <button class="opt ${arr.includes(o)?'selected':''}" data-multi="${q.k}" data-val="${o}" data-excl="${q.excl||''}">${o}</button>
    `).join('');
  }

  // 先渲染题目主体
  document.getElementById('onbBody').innerHTML = `
    <div class="q-head">
      <div class="q-step">微体检 · ${state.quizIndex+1}/${QUIZ.length}</div>
      <div class="q-title">${q.q}</div>
    </div>
    ${opts}
  `;

  // 再渲染底部按钮（保证按钮先存在）
  document.getElementById('onbFoot').innerHTML = `
    <div style="display:flex;gap:10px;align-items:center">
      ${state.quizIndex>0?'<button class="btn btn-ghost" data-onb-prev>上一题</button>':''}
      <div style="flex:1"></div>
      <button class="btn btn-primary" data-onb-next ${state.ans[q.k]!==undefined?'':'disabled'}>下一题</button>
    </div>
  `;

  // 最后绑定输入监听器（此时按钮已存在）
  if(q.type==='input'){
    const inp = document.getElementById('yearInput');
    const ageEl = document.getElementById('yearAge');
    const nextBtn = document.querySelector('[data-onb-next]');
    inp.addEventListener('input', e=>{
      const y = parseInt(e.target.value,10);
      if(y && y>=1920 && y<=2010){
        state.ans[q.k] = y;
        ageEl.textContent = '您今年约 '+(new Date().getFullYear()-y)+' 岁';
        if(nextBtn) nextBtn.disabled = false;
      } else {
        delete state.ans[q.k];
        ageEl.innerHTML = '&nbsp;';
        if(nextBtn) nextBtn.disabled = true;
      }
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter' && nextBtn && !nextBtn.disabled) nextBtn.click();
    });
  }
}

document.addEventListener('click', e=>{
  /* 引导 */
  if(e.target.closest('[data-onb-start]')){
    state.onbScreen='quiz'; state.quizIndex=0; state.ans={};
    renderOnb(); return;
  }
  if(e.target.closest('[data-onb-prev]')){
    if(state.quizIndex>0){ state.quizIndex--; renderOnb(); }
    return;
  }
  if(e.target.closest('[data-onb-next]')){
    if(state.quizIndex < QUIZ.length-1){ state.quizIndex++; renderOnb(); }
    else { state.onbScreen='upload'; renderOnb(); }
    return;
  }
  if(e.target.closest('[data-onb-upload]')){
    state.onbScreen='generating'; state.genStep=0; renderOnb(); simulateGen(); return;
  }
  if(e.target.closest('[data-onb-generate]')){
    state.onbScreen='generating'; state.genStep=0; renderOnb(); simulateGen(); return;
  }
  if(e.target.closest('[data-onb-finish]')){
    state.phase='app'; state.tab='home'; renderApp(); return;
  }

  /* 问卷选项（单选/量表） */
  const single = e.target.closest('[data-single]');
  if(single){
    state.ans[single.dataset.single] = parseInt(single.dataset.val);
    renderOnb();
    return;
  }
  /* 问卷选项（多选） */
  const multi = e.target.closest('[data-multi]');
  if(multi){
    const k = multi.dataset.multi;
    const v = multi.dataset.val;
    const excl = multi.dataset.excl;
    let arr = state.ans[k] ? [...state.ans[k]] : [];
    const isExcl = excl && v===excl;
    if(arr.includes(v)) arr = arr.filter(x=>x!==v);
    else {
      if(isExcl) arr=[v];
      else { arr = arr.filter(x=>x!==excl); arr.push(v); }
    }
    state.ans[k] = arr;
    renderOnb();
    return;
  }

  /* App */
  const t = e.target.closest('[data-tab]');
  if(t){ state.tab=t.dataset.tab; renderApp(); return; }
  const go = e.target.closest('[data-tab-go]');
  if(go){ state.tab=go.dataset.tabGo; renderApp(); return; }
  const a = e.target.closest('[data-action]');
  if(a){
    const id=a.dataset.action;
    state.doneActions.has(id)?state.doneActions.delete(id):state.doneActions.add(id);
    renderApp(); return;
  }
  const g = e.target.closest('[data-grid]');
  if(g){ openGrid(g.dataset.grid); return; }
  const m = e.target.closest('[data-mgr]');
  if(m){ openMgr(m.dataset.mgr); return; }
  const tm = e.target.closest('[data-team]');
  if(tm){ openTeam(tm.dataset.team); return; }
  const r = e.target.closest('[data-rec]');
  if(r){ openRec(r.dataset.rec); return; }
  if(e.target.closest('[data-diary-open]')){ openDiary(); return; }
  const d = e.target.closest('[data-diary]');
  if(d){
    const k=d.dataset.diary;
    state.diaryDone.has(k)?state.diaryDone.delete(k):state.diaryDone.add(k);
    renderApp(); return;
  }
  if(e.target.closest('[data-strategy]')){ openStrategy(); return; }
  if(e.target.closest('[data-close]') || e.target.id==='modal'){
    document.getElementById('modal').classList.remove('open');
  }
});

function simulateGen(){
  const timer = setInterval(()=>{
    state.genStep++;
    if(state.genStep>=5){
      clearInterval(timer);
      state.onbScreen='result';
      renderOnb();
    } else {
      const steps = document.querySelectorAll('.gen-step');
      if(steps[state.genStep]) steps[state.genStep].classList.add('on');
    }
  }, 600);
}

/* 启动 */
renderOnb();
</script>
</body>
</html>
