<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>老板健康</title>
<style>
:root{
  --fs-display: 24px; --fs-num: 32px; --fs-num-sm: 22px;
  --fs-title: 18px; --fs-sub: 17px; --fs-body-lg: 15px;
  --fs-body: 14px; --fs-base: 13px; --fs-sm: 12px;
  --fs-xs: 11px; --fs-micro: 10px;

  --bg:#F6F8FB; --card:#FFFFFF;
  --line:#E9EEF5; --line2:#F1F4F9;
  --ink:#14202F; --ink2:#5A6B80; --ink3:#8C9AAB;
  --blue:#2563EB; --blue-bg:#EEF3FF;
  --red:#C8102E; --red-bg:#FDECEC;
  --gold:#B8860B; --gold-deep:#8A6408; --gold-bg:#FFF8E7;
  --gray-bg:#F2F5FA;

  --r-lg:16px; --r-md:14px; --r-sm:10px; --r-xs:8px;
  --sp-gap:12px; --sp-pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{background:#E9EEF5;min-height:100vh;display:flex;align-items:center;
  justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  color:var(--ink);padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;
  border:1px solid #D5DEE8;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(15,27,45,.18),0 0 0 8px #fff,0 0 0 10px #D5DEE8;
  position:relative}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;font-size:var(--fs-sm);font-weight:600;
  background:var(--bg);z-index:10}
.statusbar .r{font-size:var(--fs-sm);color:var(--ink2);font-weight:500}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 110px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}

.tabbar{position:absolute;bottom:0;left:0;right:0;height:78px;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:16px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:var(--fs-micro);color:var(--ink3);cursor:pointer;font-weight:500;letter-spacing:.3px}
.tab svg{width:22px;height:22px;stroke:var(--ink3);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.tab.active{color:var(--blue)}
.tab.active svg{stroke:var(--blue);stroke-width:1.9}

.voice-section{display:flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));border-radius:var(--r-md);
  padding:15px;color:#fff;font-size:var(--fs-body-lg);font-weight:600;letter-spacing:.3px;
  margin-bottom:var(--sp-gap);cursor:pointer;position:relative;overflow:hidden;
  transition:.15s;box-shadow:0 8px 20px rgba(184,134,11,.20)}
.voice-section:active{transform:scale(.985)}
.voice-section::before{content:'';position:absolute;top:-50px;right:-30px;
  width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.voice-section .vs-arrow{font-size:16px;color:rgba(255,255,255,.65);position:relative;line-height:1}

.grid-toggle{width:26px;height:26px;border-radius:50%;background:#fff;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.18s;flex-shrink:0}
.grid-toggle:active{background:var(--gray-bg)}
.grid-toggle svg{width:13px;height:13px;stroke:var(--ink2);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.grid-toggle.open svg{transform:rotate(180deg)}

#viewbar{display:flex;justify-content:center;padding:2px 0 6px;flex-shrink:0;z-index:9}
.vb-seg{display:flex;background:#E4EAF2;border-radius:20px;padding:3px;gap:2px}
.vb-seg span{padding:5px 16px;font-size:var(--fs-sm);border-radius:16px;color:var(--ink2);
  font-weight:600;cursor:pointer;transition:.16s}
.vb-seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,27,45,.12)}

.hd{padding:6px 2px 16px}
.hd-title{font-size:var(--fs-display);font-weight:600;letter-spacing:-.3px;line-height:1.2}
.hd-row{display:flex;align-items:flex-end;justify-content:space-between}
.share-btn{display:flex;align-items:center;gap:4px;font-size:var(--fs-sm);color:var(--ink2);
  background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:20px;
  font-weight:500;cursor:pointer}
.share-btn:active{background:var(--gray-bg)}

.sec{font-size:var(--fs-sm);font-weight:600;color:var(--ink2);margin:22px 2px 10px;
  display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px}
.sec .more{font-size:var(--fs-xs);color:var(--ink3);font-weight:400;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--sp-pad);margin-bottom:var(--sp-gap)}

.ranges{display:flex;gap:6px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.ranges::-webkit-scrollbar{display:none}
.range{flex-shrink:0;padding:7px 15px;border-radius:20px;background:#fff;
  border:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink2);font-weight:500;
  cursor:pointer;transition:.15s;display:flex;align-items:center;gap:4px}
.range.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.range:active{transform:scale(.96)}
.range .rng-dates{font-size:var(--fs-micro);font-weight:500;opacity:.85}

/* 日期范围：展示在时间筛选下面 */
.range-dates-text{font-size:var(--fs-xs);color:var(--ink3);margin:0 2px 12px;
  letter-spacing:.3px;font-weight:500}

.manual-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:var(--sp-gap)}
.mp-title{font-size:var(--fs-micro);color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:12px}
.mp-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.mp-field{flex:1;min-width:0}
.mp-label{font-size:var(--fs-micro);color:var(--ink3);margin-bottom:6px;display:block}
.mp-input{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);
  font-size:var(--fs-body);font-family:inherit;font-weight:600;color:var(--ink);outline:none;background:#fff}
.mp-input:focus{border-color:var(--blue)}
.mp-quick{display:flex;gap:6px;flex-wrap:wrap}
.mp-summary{font-size:var(--fs-xs);background:var(--gold-bg);color:var(--gold);
  padding:8px 12px;border-radius:var(--r-sm);font-weight:600;margin-top:10px}

.trendcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 16px 12px;margin-bottom:var(--sp-gap)}
.tc-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tc-lb{font-size:var(--fs-sm);color:var(--ink3);font-weight:500}
.tc-num{font-size:var(--fs-num);font-weight:700;letter-spacing:-1.2px;line-height:1;margin-top:6px}
.tc-num small{font-size:var(--fs-xs);font-weight:500;color:var(--ink3);margin-left:4px;letter-spacing:0}
.tc-delta{font-size:var(--fs-xs);font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap}
.tc-delta.up{background:var(--red-bg);color:var(--red)}
.tc-delta.down{background:var(--gray-bg);color:var(--ink2)}
.trend{width:100%;height:108px;display:block;margin-top:6px}
.trend-x{display:flex;justify-content:space-between;font-size:var(--fs-micro);color:var(--ink3);
  margin-top:2px;padding:0 4px}

.g9-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g9{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 10px;cursor:pointer;position:relative;transition:.15s}
.g9:active{transform:scale(.96);background:#FAFCFF}
.g9-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.g9-name{font-size:var(--fs-xs);color:var(--ink2);font-weight:500}
.g9-dot{width:5px;height:5px;border-radius:50%;background:#D5DEE8;flex-shrink:0;transition:.2s}
.g9-dot.full{background:var(--gold)}
.g9-dot.partial{background:var(--blue)}
.g9-main{display:flex;align-items:baseline;gap:6px}
.g9-grade{font-size:var(--fs-num-sm);font-weight:700;line-height:1;letter-spacing:-.8px}
.g9-score{font-size:var(--fs-xs);color:var(--ink3);font-weight:500;margin-left:auto}
.g9-bar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:9px}
.g9-bar span{display:block;height:100%;border-radius:2px;transition:width .6s}

.level-card{background:linear-gradient(150deg,#0F1B2D,#1A2D47);border-radius:var(--r-lg);
  padding:20px 18px;margin-bottom:var(--sp-gap);position:relative;overflow:hidden;color:#fff}
.level-card::before{content:'';position:absolute;top:-60px;right:-50px;width:180px;height:180px;
  border-radius:50%;background:rgba(184,134,11,.20)}
.level-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative}
.level-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(184,134,11,.22);
  border:1px solid rgba(184,134,11,.45);color:#FFD27A;font-size:var(--fs-xs);font-weight:700;
  padding:4px 10px;border-radius:20px;letter-spacing:.5px}
.level-now{margin-top:16px;position:relative}
.level-now-lb{font-size:var(--fs-xs);color:rgba(255,255,255,.5);letter-spacing:1.5px}
.level-now-name{font-size:52px;font-weight:700;color:#FFD27A;letter-spacing:-2.2px;
  line-height:1;margin-top:8px}
.level-now-age{font-size:var(--fs-base);color:rgba(255,255,255,.65);margin-top:8px;font-weight:500}
.level-list{display:flex;flex-direction:column;gap:6px;margin-top:20px;position:relative}
.level-row{display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-radius:var(--r-sm);background:rgba(255,255,255,.05);transition:.2s}
.level-row.on{background:rgba(184,134,11,.25);border:1px solid rgba(184,134,11,.5)}
.level-row-name{font-size:var(--fs-body);font-weight:700;color:rgba(255,255,255,.55);width:64px;flex-shrink:0}
.level-row.on .level-row-name{color:#FFD27A;font-size:var(--fs-sub)}
.level-row-age{font-size:var(--fs-sm);color:rgba(255,255,255,.4);flex:1}
.level-row.on .level-row-age{color:rgba(255,255,255,.85)}
.level-row-tag{font-size:var(--fs-micro);color:rgba(255,255,255,.35);font-weight:500;flex-shrink:0}
.level-row.on .level-row-tag{color:#FFD27A;font-weight:700}
.level-row.done .level-row-name{color:rgba(255,255,255,.8)}
.level-row.done .level-row-tag{color:rgba(255,255,255,.55)}

.asset-list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px 18px;margin-bottom:var(--sp-gap)}
.asset-list-hd{font-size:var(--fs-micro);color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:14px}
.asset-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.asset-row-nm{width:20px;font-size:var(--fs-body);font-weight:700;color:var(--ink);flex-shrink:0}
.asset-row-sub{width:54px;font-size:var(--fs-sm);color:var(--ink3);flex-shrink:0}
.asset-row-bar{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.asset-row-fill{height:100%;border-radius:3px;transition:width .6s}
.asset-row-val{width:28px;text-align:right;font-size:var(--fs-body);font-weight:700;flex-shrink:0}

.goal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px 18px;position:relative;overflow:hidden;margin-bottom:var(--sp-gap)}
.goal-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--gold)}
.goal-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.goal-tag{font-size:var(--fs-micro);color:var(--gold);background:var(--gold-bg);
  padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:.6px;display:inline-block}
.goal-more{font-size:var(--fs-xs);color:var(--ink3);cursor:pointer;white-space:nowrap;margin-top:2px}
.goal-title{font-size:var(--fs-title);font-weight:700;margin-top:12px;letter-spacing:-.3px;line-height:1.4}
.goal-desc{font-size:var(--fs-base);color:var(--ink2);margin-top:8px;line-height:1.6}

.action-list{display:flex;flex-direction:column;gap:10px;margin-bottom:var(--sp-gap)}
.action-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 16px;display:flex;align-items:center;gap:12px;transition:.15s}
.action-item:active{background:#FAFCFF}
.action-ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--gold-bg);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-base);font-weight:700;flex-shrink:0}
.action-main{flex:1;min-width:0}
.action-t{font-size:var(--fs-base);font-weight:600;color:var(--ink);line-height:1.4}
.action-s{font-size:var(--fs-xs);color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:6px}
.action-src{background:var(--blue-bg);color:var(--blue);font-size:var(--fs-micro);padding:1px 5px;
  border-radius:4px;font-weight:600}
.action-btn{flex-shrink:0;font-size:var(--fs-sm);font-weight:600;padding:8px 14px;border-radius:20px;
  cursor:pointer;white-space:nowrap;border:none;font-family:inherit;transition:.15s}
.action-btn.join{color:var(--gold);background:var(--gold-bg)}
.action-btn.check{color:var(--blue);background:var(--blue-bg)}
.action-btn.done{color:var(--ink3);background:var(--gray-bg);cursor:default}

.result-card{background:linear-gradient(150deg,#0F1B2D,#1A2D47);border-radius:var(--r-lg);
  padding:20px;color:#fff;position:relative;overflow:hidden}
.result-card::before{content:'';position:absolute;top:-50px;right:-40px;width:140px;height:140px;
  border-radius:50%;background:rgba(184,134,11,.16)}
.result-hd{font-size:var(--fs-micro);color:rgba(255,255,255,.5);letter-spacing:2px;font-weight:600;
  position:relative;margin-bottom:12px}
.result-num{font-size:var(--fs-num);font-weight:700;letter-spacing:-1.2px;line-height:1;position:relative}
.result-num small{font-size:var(--fs-sm);color:rgba(255,255,255,.55);font-weight:500;margin-left:5px}
.result-lb{font-size:var(--fs-sm);color:rgba(255,255,255,.7);margin-top:10px;position:relative}
.result-bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:14px;position:relative}
.result-bar-fill{height:100%;border-radius:4px;background:#FFD27A;transition:width .6s}
.result-foot{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:rgba(255,255,255,.55);
  margin-top:10px;position:relative}
.result-chg{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;font-size:var(--fs-sm);position:relative}
.result-chg-lb{color:rgba(255,255,255,.6)}
.result-chg-val{font-weight:700;color:#FFD27A}

.detail-block{margin-bottom:18px}
.detail-block:last-child{margin-bottom:0}
.detail-t{font-size:var(--fs-micro);color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:10px}
.detail-p{font-size:var(--fs-base);color:var(--ink2);line-height:1.7}
.detail-list{display:flex;flex-direction:column;gap:8px}
.detail-li{display:flex;align-items:flex-start;gap:8px;font-size:var(--fs-base);color:var(--ink2);line-height:1.6}
.detail-li .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:7px;flex-shrink:0}
.week-days{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.week-day{width:30px;height:30px;border-radius:var(--r-xs);background:var(--gray-bg);
  font-size:var(--fs-xs);color:var(--ink3);display:flex;align-items:center;justify-content:center}
.week-day.on{background:var(--gold);color:#fff;font-weight:600}
.week-day.today{border:1.5px solid var(--gold);color:var(--gold);font-weight:700}

.mgr-group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:6px 18px;margin-bottom:var(--sp-gap)}
.mgr-row{display:flex;align-items:center;gap:14px;padding:15px 0;
  border-bottom:1px solid var(--line2);cursor:pointer}
.mgr-row:last-child{border-bottom:none}
.mgr-row-ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--gray-bg);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);color:var(--ink2);
  flex-shrink:0;font-weight:600}
.mgr-row-main{flex:1;min-width:0}
.mgr-row-t{font-size:var(--fs-body);color:var(--ink);font-weight:500}
.mgr-row-s{font-size:var(--fs-sm);color:var(--ink3);margin-top:3px}
.mgr-row-val{font-size:var(--fs-sm);font-weight:600;color:var(--gold)}

.streak{background:linear-gradient(135deg,var(--gold),var(--gold-deep));border-radius:var(--r-lg);
  padding:22px;color:#fff;text-align:center;margin-bottom:var(--sp-gap);position:relative;overflow:hidden}
.streak::before{content:'';position:absolute;top:-60px;right:-40px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.streak-num{font-size:42px;font-weight:700;line-height:1;letter-spacing:-1.5px;position:relative}
.streak-num small{font-size:var(--fs-body);font-weight:500;color:rgba(255,255,255,.75);margin-left:4px}
.streak-lb{font-size:var(--fs-base);color:rgba(255,255,255,.85);margin-top:10px;position:relative}

.modal{position:fixed;inset:0;background:rgba(15,27,45,.45);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:99;
  overscroll-behavior:contain}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  background:#fff;border-radius:24px 24px 0 0;padding:22px 20px 38px;
  position:relative;animation:up .3s cubic-bezier(.2,.9,.3,1);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sh-head{margin-bottom:18px}
.sh-title-row{display:flex;align-items:flex-start;justify-content:space-between}
.sh-name{font-size:var(--fs-title);font-weight:600}
.sh-date{font-size:var(--fs-sm);color:var(--ink3);margin-top:5px;letter-spacing:.3px}
.sh-x{width:30px;height:30px;border-radius:50%;background:var(--gray-bg);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--fs-body);
  flex-shrink:0}
.sh-btn{margin-top:18px;background:var(--ink);color:#fff;font-size:var(--fs-body-lg);font-weight:600;
  text-align:center;padding:14px;border-radius:var(--r-md);cursor:pointer}
.sh-btn.disabled{background:#E8EEF5;color:var(--ink3);cursor:not-allowed}
.sh-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500}

.metrics-block{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:6px 16px;margin-bottom:16px}
.metrics-hd{font-size:var(--fs-micro);color:var(--ink3);font-weight:600;letter-spacing:1px;
  padding:12px 0 4px;display:flex;align-items:center;justify-content:space-between}
.metrics-hd .cnt{font-size:var(--fs-micro);color:var(--ink3);font-weight:400}
.metric-row{display:flex;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--line2)}
.metric-row:last-child{border-bottom:none}
.metric-nm{font-size:var(--fs-base);color:var(--ink2);flex:1;min-width:0;line-height:1.4}
.metric-v{font-size:var(--fs-body);font-weight:700;color:var(--ink);text-align:right;flex-shrink:0;letter-spacing:-.2px}
.metric-v small{font-size:var(--fs-micro);color:var(--ink3);font-weight:500;margin-left:2px}
.metric-v.empty{color:var(--ink3);font-weight:500;font-size:var(--fs-sm)}
.metric-delta{font-size:var(--fs-xs);font-weight:700;width:44px;text-align:right;flex-shrink:0}

  return LEVELS.find(l=>asset >= l.min && asset <= l.max) || LEVELS[0];

function assetFromDims(scores){
  let total = 0;
  DIMS.forEach(d=>{
    const s = Math.max(30, Math.min(99, scores[d.k] || 60));
    total += s / 99 * (ASSET_MAX / DIMS.length);

function parseVoiceText(t){
  const out = {};
  const add = (c,s)=>{
    if(!s) return;
    if(!out[c]) out[c] = [];
    if(!out[c].includes(s)) out[c].push(s);
  };
  if(/会/.test(t)) add('mood','有会议');
  if(/加班/.test(t)) add('mood','加班到较晚');
  if(/紧|烦|焦虑|压力|有点累/.test(t)) add('mood','情绪偏紧');
  else if(/开心|不错|顺利|放松|挺好/.test(t)) add('mood','心情不错');
  if(/颈肩|肩颈|脖子/.test(t)) add('body','颈肩僵硬');
  if(/大便.*干|便秘|排便/.test(t)) add('body','排便偏干');
  if(/头晕/.test(t)) add('body','头晕');
  if(/耳鸣/.test(t)) add('body','耳鸣');
  if(/心慌/.test(t)) add('body','心慌');
  if(/胃|反酸|胀气|没胃口/.test(t)) add('body','胃部不适');
  if(/乏力|没力气/.test(t)) add('body','容易疲劳');
  if(/腰酸|腰疼/.test(t)) add('body','腰酸');
  if(/看病|医院|就诊/.test(t)) add('body','有就医');
  if(/出差/.test(t)) add('mood','出差中');
  if(/散步/.test(t)) add('move','散步');
  if(/快走/.test(t)) add('move','快走');
  if(/力量训练|深蹲|举铁|俯卧撑/.test(t)) add('move','力量训练');
  if(/没运动|没动|久坐/.test(t)) add('move','运动偏少');
  ['早餐','早饭','午餐','午饭','晚餐','晚饭','夜宵'].forEach(m=>{
    const r = t.match(new RegExp(m + '([^，。；！？]{1,24})'));
    if(r && r[1]) add('diet', m + r[1].trim());
  });
  if(/应酬/.test(t)) add('diet','有应酬');
  if(/酒/.test(t)) add('diet','饮酒');
  if(/抽烟|烟/.test(t)) add('diet','抽烟');
  if(/外卖/.test(t)) add('diet','吃外卖');
  const CN = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5};
  const wake = t.match(/醒[了]?([一二两三四五\d])\s*次/);
  if(wake) add('sleep','夜醒 ' + (CN[wake[1]] || wake[1]) + ' 次');
  if(/十一点半|11点半|睡得晚|熬夜/.test(t)) add('sleep','入睡偏晚');
  if(/午睡|午觉/.test(t)) add('sleep','有午睡');
  if(/失眠|睡不好/.test(t)) add('sleep','睡眠质量差');
  if(/胸闷|有点闷/.test(t)) add('breath','有点胸闷');
  if(/气短/.test(t)) add('breath','气短');
  if(/打鼾/.test(t)) add('breath','打鼾');
  if(/呼吸练习|慢呼吸|腹式呼吸/.test(t)) add('breath','做了呼吸练习');
  if(/户外/.test(t)) add('env','户外时间' + (/没怎么|很少/.test(t) ? '偏少' : '充足'));
  if(/二手烟/.test(t)) add('env','接触二手烟');
  if(/空气差|雾霾/.test(t)) add('env','空气质量差');
  if(/读书|看书/.test(t)) add('cognition','有阅读');
  if(/专注/.test(t)) add('cognition','专注度好');
  if(/分心/.test(t)) add('cognition','容易分心');
  if(/聚会|社交|聊天/.test(t)) add('cognition','有社交');
  if(/谈判|签约|客户/.test(t)) add('event','有重要谈判');
  if(/住院|医院|体检/.test(t)) add('event','有就医相关');
  if(/投资|股票|支出|买房/.test(t)) add('event','有财务事项');
  return out;
}

function trendSvg(values, labels, color, maxV){
  const w=320, h=108, padL=10, padR=10, padT=14, padB=14;
  const useMax = maxV || Math.max.apply(null, values);
  let min=Math.min.apply(null,values), max=useMax;
  const raw = (max-min)||1;
  min -= raw*0.15; max += raw*0.15;
  const rng = (max-min)||1;
  const iw = w-padL-padR, ih = h-padT-padB;
  const pts = values.map((v,i)=>{
    const x = padL + (values.length===1 ? iw/2 : iw*i/(values.length-1));
    const y = padT + ih*(1-(v-min)/rng);
    return [x,y];
  });
  const line = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = 'M '+pts[0][0].toFixed(1)+','+(h-padB)+' L '+
               pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ')+
               ' L '+pts[pts.length-1][0].toFixed(1)+','+(h-padB)+' Z';
  const gid = 'tg'+Math.random().toString(36).slice(2,8);
  const grids = [0,0.5,1].map(t=>{
    const y = padT + ih*t;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}"
      stroke="#F1F4F9" stroke-width="1" stroke-dasharray="3 4"/>`;
  }).join('');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"
      fill="#fff" stroke="${color}" stroke-width="1.6"/>`).join('');
  const last = pts[pts.length-1];
  return `<svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grids}
    <path d="${area}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${color}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="7"
      fill="${color}" opacity=".16"/>
  </svg>`;
}

/* ============ 手动记录：保存与摘要 ============ */
function flushManual(dim){
  const form = MANUAL_FORMS[dim];
  if(!form) return;
  const m = state.manualRecords[dim] || {};
  const parts = [];
  form.groups.forEach(g=>{
    const v = m[g.k];
    if(v === undefined || v === null || v === '') return;
    if(Array.isArray(v) && !v.length) return;
    parts.push(g.label + '：' + (Array.isArray(v) ? v.join('、') : v));
  });
  if(dim === 'diet'){
    const meals = [['b','早餐'],['l','午餐'],['d','晚餐'],['s','加餐']];
    const mt = [];
    meals.forEach(([mk,mn])=>{
      const q = state.dietQuick[mk]||{};
      const p = [];
      if(q.staple) p.push('主食'+q.staple);
      if(q.protein) p.push('蛋白'+q.protein);
      if(q.veg) p.push('蔬菜'+q.veg);
      if(q.fruit) p.push('水果'+q.fruit);
      if(p.length) mt.push(mn+'（'+p.join('，')+'）');
    });
    if(mt.length) parts.unshift('三餐：' + mt.join('；'));
  }
  if(!state.records[dim]) state.records[dim] = [];
  state.records[dim] = state.records[dim].filter(x=>!x.startsWith('__m__'));
  if(parts.length) state.records[dim].push('__m__' + parts.join('｜'));
}

function manualFormHtml(dim){

  const blocks = form.groups.map(g=>{
    let body = '';
    if(g.type === 'single'){
      body = `<div class="mf-chips">${g.opts.map(o=>{

        return `<span class="mf-chip ${on}" data-manual-single="${dim}" data-key="${g.k}" data-val="${o}">${o}</span>`;
      }).join('')}</div>`;
    } else if(g.type === 'multi'){
      const arr = Array.isArray(m[g.k]) ? m[g.k] : [];
      body = `<div class="mf-chips">${g.opts.map(o=>{
        const on = arr.includes(o) ? 'on' : '';

      body = `<input class="mf-input" placeholder="${g.ph||''}" value="${m[g.k]||''}" data-manual-input="${dim}" data-key="${g.k}">`;
    }
    return `<div class="mf-row">

  return `<div class="mf-block">

/* ============ 总分趋势 ============ */
function totalScoreTrendHtml(k, range){
  const dim = DIMS.find(x=>x.k===k);
  const series = DIM_TREND_BY_RANGE[k] && DIM_TREND_BY_RANGE[k][range];
  if(!series || !series.length){
    return `<div style="background:#fff;border:1px dashed var(--line);border-radius:var(--r-md);padding:22px 20px;text-align:center;margin-bottom:16px">
      <div style="font-size:22px;color:var(--ink3);margin-bottom:8px">📈</div>
      <div style="font-size:var(--fs-base);font-weight:600;color:var(--ink);margin-bottom:4px">还没有足够数据</div>
      <div style="font-size:var(--fs-sm);color:var(--ink3);line-height:1.6">记录一次后就能看到趋势</div>
    </div>`;
  }
  const xs = DIM_TREND_X[range] || DIM_TREND_X.week;
  const first = series[0], last = series[series.length-1];
  const delta = last - first;
  const isGood = trendIsGood(k, delta);
  const color = isGood ? '#C8102E' : '#1A1A1A';
  const deltaCls = isGood ? 'up' : 'down';
  const sign = delta >= 0 ? '+' : '';
  return `<div class="trendcard" style="margin-top:0;margin-bottom:16px">
    <div class="tc-hd">
      <div>
        <div class="tc-lb">总分 · ${dim.name}（100 分制）</div>
        <div class="tc-num" style="color:${color}">${last}<small>分</small></div>
      </div>
      <div class="tc-delta ${deltaCls}">${sign}${delta}</div>
    </div>
    ${trendSvg(series, xs, color, 100)}
    <div class="trend-x">${xLabels(xs)}</div>
  </div>`;
}

/* ============ 具体指标 ============ */
function metricsBlockHtml(k){
  const items = DIM_SNAPSHOT[k] || [];
  if(!items.length){
    return `<div class="metrics-block">
      <div class="metrics-hd"><span>具体指标</span><span class="cnt">暂无</span></div>
      <div class="metrics-empty">这个维度没有可读取的设备指标<br>用下方手动记录补上今天的情况</div>
    </div>`;
  }
  const rows = items.map(it=>{
    const empty = it.v === null || it.v === undefined || it.v === '';
    let deltaHtml = '<span class="metric-delta flat">—</span>';
    if(!empty && it.delta !== null && it.delta !== undefined && it.delta !== 0){
      const sign = it.delta > 0 ? '+' : '';
      const cls = it.good ? 'good' : 'bad';
      let dv = it.delta;
      if(!Number.isInteger(dv)) dv = dv.toFixed(1);
      deltaHtml = `<span class="metric-delta ${cls}">${sign}${dv}</span>`;
    }
    return `<div class="metric-row">
      <div class="metric-nm">${it.k}</div>
      <div class="metric-v ${empty?'empty':''}">${empty ? '—' : it.v}${!empty && it.unit ? `<small>${it.unit}</small>` : ''}</div>
      ${deltaHtml}
    </div>`;
  }).join('');
  return `<div class="metrics-block">
    <div class="metrics-hd"><span>具体指标</span><span class="cnt">${items.length} 项</span></div>
    ${rows}
  </div>`;
}

function voiceCoverageData(){
  const o = {};
  DIMS.forEach(d=>{
    if(hasRecord(d.k)) o[d.k] = 'full';
    else if(hasDeviceData(d.k)) o[d.k] = 'part';
    else o[d.k] = 'empty';
  });
  return o;
}
function coverageHtml(){
  const cov = state.voiceCov || voiceCoverageData();
  return DIMS.map(d=>{
    const lvl = cov[d.k] || 'empty';
    const txt = lvl==='full' ? '已记录'
              : lvl==='part' ? '有设备'
              : lvl==='live' ? '识别中'
              : '待补充';
    return `<div class="vc-cell ${lvl}">
      <div class="vc-n">${d.name}</div>
      <div class="vc-s">${txt}</div>
    </div>`;
  }).join('');
}
function openVoiceSheet(){
  state.voice = {step:'listening', text:'', items:{}};
  state.voiceCov = voiceCoverageData();
  const token = {};
  state.voiceToken = token;
  renderVoiceListening();

  setTimeout(()=>{
    if(state.voiceToken !== token) return;
    const demoItems = parseVoiceText(VOICE_DEMO);
    const cov = {...state.voiceCov};
    VOICE_CATS.forEach(c=>{
      if(demoItems[c.k] && demoItems[c.k].length){
        if(cov[c.dim] !== 'full') cov[c.dim] = 'live';
      }
    });
    state.voiceCov = cov;
    const st = document.getElementById('voiceStatus');
    if(st) st.textContent = '识别中…';
    const g = document.getElementById('vcGrid');
    if(g) g.innerHTML = coverageHtml();
  }, 900);

  setTimeout(()=>{
    if(state.voiceToken !== token) return;
    finishVoiceListen();
  }, 2300);
}
function finishVoiceListen(){
  if(!state.voice || state.voice.step === 'done') return;
  state.voice.step = 'done';
  state.voice.text = VOICE_DEMO;
  state.voice.items = parseVoiceText(VOICE_DEMO);
  saveVoice();
}

  sheetRenderer = null;
  document.getElementById('sheet').innerHTML = `
    <div class="sh-head">

function saveVoice(){
  const v = state.voice;
  if(!v) return;
  let dims = 0, total = 0;
  Object.keys(v.items).forEach(cat=>{
    const c = VOICE_CATS.find(x=>x.k===cat);
    const arr = v.items[cat];
    if(!c || !arr || !arr.length) return;
    if(!state.records[c.dim]) state.records[c.dim] = [];
    state.records[c.dim] = state.records[c.dim].concat(arr);
    dims++;
    total += arr.length;
  });
  closeModal();
  render();
  if(dims){
    setTimeout(()=>toast(`已记录 ${total} 条，后台已归类到 ${dims} 个维度`), 120);
  } else {
    setTimeout(()=>toast('没听到有效内容，可以再说一次'), 120);
  }
}

    {n:'爱人', r:'已绑定', s:83, a:'爱', c:'#2563EB'}
  ];
  const rows = members.map(m=>`
    <div class="mgr-row">
      <div class="mgr-row-ico" style="background:var(--gold-bg);color:${m.c}">${m.a}</div>
      <div class="mgr-row-main">
        <div class="mgr-row-t">${m.n}</div>
        <div class="mgr-row-s">${m.r}</div>
      </div>
      <div class="mgr-row-val">${m.s} 分</div>
    </div>`).join('');
  openSimpleSheet('家庭', `
    <div class="card" style="margin-bottom:12px;padding:6px 18px">${rows}</div>
    <div class="sh-btn" data-family-invite>邀请家人加入</div>
    <div class="sh-btn ghost" data-close>关闭</div>
  `);
}

/* ============ 事件 ============ */
document.addEventListener('click', e=>{
  if(e.target.closest('[data-ob-login]') || e.target.closest('[data-ob-phone]')){
    state.ob.step = 1; renderOnboard(); return;
  }
  const obSet = e.target.closest('[data-ob-set]');
  if(obSet){ state.ob[obSet.dataset.obSet] = obSet.dataset.val; renderOnboard(); return; }
  const obMulti = e.target.closest('[data-ob-multi]');
  if(obMulti){
    const key = obMulti.dataset.obMulti, v = obMulti.dataset.val;
    const arr = state.ob[key] || [];
    if(v === '没有'){ state.ob[key] = arr.includes('没有') ? [] : ['没有']; }
    else {
      const filtered = arr.filter(x=>x!=='没有');
      state.ob[key] = filtered.includes(v) ? filtered.filter(x=>x!==v) : [...filtered, v];
    }
    renderOnboard(); return;
  }
  if(e.target.closest('[data-ob-done]')){
    state.onboarded = true;
    render(); return;
  }

  const vw = e.target.closest('[data-view]');
  if(vw){ state.view = vw.dataset.view; state.adminUser = null; render(); return; }
  if(e.target.closest('[data-admin-back]')){ state.adminUser = null; render(); return; }
  const rankUser = e.target.closest('[data-rank-user]');
  if(rankUser){ state.adminUser = rankUser.dataset.rankUser; render(); return; }

  const t = e.target.closest('[data-tab]');
  if(t){ state.tab = t.dataset.tab; render(); return; }

  const rg = e.target.closest('[data-range]');
  if(rg){ state.range[rg.dataset.rtab] = rg.dataset.range; render(); return; }

  const mp = e.target.closest('[data-manual-preset]');
  if(mp){
    const key = mp.dataset.manualPreset;
    state.manual[key].start = mp.dataset.start;
    state.manual[key].end = mp.dataset.end;
    render(); return;
  }

  if(e.target.closest('[data-grid-toggle]')){
    state.gridExpanded = !state.gridExpanded;
    render(); return;
  }

  const dim = e.target.closest('[data-dim]');
  if(dim){
    const k = dim.dataset.dim;
    if(k === 'diet'){ openDiet(); } else { openDimRecord(k, state.range.see); }
    return;
  }

  const ms = e.target.closest('[data-manual-single]');
  if(ms){
    const d = ms.dataset.manualSingle, key = ms.dataset.key, val = ms.dataset.val;
    if(!state.manualRecords[d]) state.manualRecords[d] = {};
    state.manualRecords[d][key] = state.manualRecords[d][key] === val ? '' : val;
    flushManual(d);
    rerenderSheet();
    return;
  }

  const mm = e.target.closest('[data-manual-multi]');
  if(mm){
    const d = mm.dataset.manualMulti, key = mm.dataset.key, val = mm.dataset.val;
    const excl = mm.dataset.excl;
    if(!state.manualRecords[d]) state.manualRecords[d] = {};
    let arr = Array.isArray(state.manualRecords[d][key]) ? [...state.manualRecords[d][key]] : [];
    const isE = excl && val === excl;
    if(arr.includes(val)) arr = arr.filter(x=>x!==val);
    else { if(isE) arr = [val]; else { arr = arr.filter(x=>x!==excl); arr.push(val); } }
    state.manualRecords[d][key] = arr;
    flushManual(d);
    rerenderSheet();
    return;
  }

  const qm = e.target.closest('[data-quick-meal]');
  if(qm){
    const mk = qm.dataset.quickMeal, ck = qm.dataset.quickCat, v = qm.dataset.quickVal;
    if(!state.dietQuick[mk]) state.dietQuick[mk] = {};
    state.dietQuick[mk][ck] = state.dietQuick[mk][ck] === v ? '' : v;
    flushManual('diet');
    rerenderSheet();
    return;
  }

  if(e.target.closest('[data-goal-detail]')){ openGoalDetail(); return; }
  const pj = e.target.closest('[data-practice-join]');
  if(pj){
    const id = pj.dataset.practiceJoin;
    const ps = state.practiceState[id];
    if(ps){
      ps.joined = true; ps.checkedToday = false; ps.streak = 0; ps.week = [0,0,0,0,0,0,0];
      render(); toast('已加入');
    }
    return;
  }
  const pc = e.target.closest('[data-practice-check]');
  if(pc){
    const id = pc.dataset.practiceCheck;
    const ps = state.practiceState[id];
    if(ps && ps.joined){
      ps.checkedToday = !ps.checkedToday;
      if(ps.checkedToday){ ps.streak += 1; ps.week[0] = 1; }
      else { ps.streak = Math.max(0, ps.streak - 1); ps.week[0] = 0; }
      render();
    }
    return;
  }

  if(e.target.closest('[data-share]')){ openShare(); return; }
  const st2 = e.target.closest('[data-share-to]');
  if(st2){
    const to = st2.dataset.shareTo;
    closeModal();
    setTimeout(()=>toast(to==='image'?'已保存到相册':'已发送'), 120);
    return;
  }
  if(e.target.closest('[data-family]')){ openFamily(); return; }
  if(e.target.closest('[data-family-invite]')){
    closeModal(); setTimeout(()=>toast('邀请链接已复制'), 120); return;
  }

  if(e.target.closest('[data-voice-open]')){ openVoiceSheet(); return; }
  if(e.target.closest('[data-voice-stop]')){ finishVoiceListen(); return; }

  const qzS = e.target.closest('[data-qz-single]');
  if(qzS){ state.quizAns[qzS.dataset.qzSingle] = parseInt(qzS.dataset.val); renderQuiz(); return; }
  const qzM = e.target.closest('[data-qz-multi]');
  if(qzM){
    const k = qzM.dataset.qzMulti, v = qzM.dataset.val, excl = qzM.dataset.excl;
    let arr = state.quizAns[k] ? [...state.quizAns[k]] : [];
    const isE = excl && v === excl;
    if(arr.includes(v)) arr = arr.filter(x=>x!==v);
    else { if(isE) arr = [v]; else { arr = arr.filter(x=>x!==excl); arr.push(v); } }
    state.quizAns[k] = arr;
    renderQuiz(); return;
  }
  if(e.target.closest('[data-qz-prev]')){
    if(state.quizIndex>0){ state.quizIndex--; renderQuiz(); }
    return;
  }
  if(e.target.closest('[data-qz-next]')){
    const b = e.target.closest('[data-qz-next]');
    if(b.classList.contains('disabled')) return;
    if(state.quizIndex < QUIZ.length-1){ state.quizIndex++; renderQuiz(); }
    else { renderQuizResult(); }
    return;
  }

  if(e.target.closest('[data-close]') || e.target.id === 'modal'){ closeModal(); }
});

document.addEventListener('change', e=>{
  if(e.target.hasAttribute('data-manual-input')){
    const d = e.target.dataset.manualInput, key = e.target.dataset.key;
    if(!state.manualRecords[d]) state.manualRecords[d] = {};
    state.manualRecords[d][key] = e.target.value.trim();
    flushManual(d);
    return;
  }
  if(e.target.hasAttribute('data-manual-start')){
    const key = e.target.dataset.manualStart;
    let v = e.target.value;
    if(!v) return;
    if(v > state.manual[key].end) v = state.manual[key].end;
    state.manual[key].start = v;
    render();
  }
  if(e.target.hasAttribute('data-manual-end')){
    const key = e.target.dataset.manualEnd;
    let v = e.target.value;
    if(!v) return;
    if(v < state.manual[key].start) v = state.manual[key].start;
    state.manual[key].end = v;
    render();
  }
});

document.addEventListener('input', e=>{
  if(e.target.hasAttribute('data-ob-input')){ state.ob[e.target.dataset.obInput] = e.target.value; }
  if(e.target.id === 'shareFeel'){
    state.shareFeel = e.target.value;
    const cnt = document.getElementById('shareFeelCount');
    if(cnt) cnt.textContent = e.target.value.length;
    refreshShareFeel();
  }
});

render();
</script>
</body>
</html>
