<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>老板健康</title>
<style>
:root{
  --fs-display: 24px; --fs-num: 30px; --fs-title: 18px;
  --fs-body-lg: 15px; --fs-body: 14px; --fs-base: 13px;
  --fs-sm: 12px; --fs-xs: 11px; --fs-micro: 10px;

  --bg:#F6F8FB; --card:#FFFFFF;
  --line:#E9EEF5; --line2:#F1F4F9;
  --ink:#14202F; --ink2:#5A6B80; --ink3:#8C9AAB;
  --blue:#2563EB; --blue-bg:#EEF3FF;
  --red:#C8102E; --red-bg:#FDECEC;
  --gold:#B8860B; --gold-deep:#8A6408; --gold-bg:#FFF8E7;
  --gray-bg:#F2F5FA;
  --wechat:#07C160;

  --r-lg:16px; --r-md:14px; --r-sm:10px; --r-xs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{background:#E9EEF5;min-height:100vh;display:flex;align-items:center;
  justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  color:var(--ink);padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;
  border:1px solid #D5DEE8;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(15,27,45,.18),0 0 0 8px #fff,0 0 0 10px #D5DEE8;
  position:relative}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 26px;font-size:var(--fs-sm);font-weight:600;
  background:var(--bg);z-index:10}
.statusbar .r{font-size:var(--fs-sm);color:var(--ink2);font-weight:500}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}

.tabbar{position:absolute;bottom:0;left:0;right:0;height:78px;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:16px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font-size:var(--fs-micro);color:var(--ink3);cursor:pointer;font-weight:500;letter-spacing:.3px}
.tab svg{width:22px;height:22px;stroke:var(--ink3);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.tab.active{color:var(--gold)}
.tab.active svg{stroke:var(--gold);stroke-width:1.9}

/* ===== 健康助手 ===== */
.chat-wrap{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 18px 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chat-scroll::-webkit-scrollbar{display:none}
.chat-head{padding:0 2px 16px}
.chat-head-t{font-size:var(--fs-display);font-weight:600;letter-spacing:-.3px}
.chat-head-s{font-size:var(--fs-sm);color:var(--ink3);margin-top:6px;line-height:1.6}

.chat-msg{display:flex;margin-bottom:16px;gap:8px;align-items:flex-start}
.chat-msg.user{flex-direction:row-reverse}
.chat-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:var(--fs-micro);font-weight:700;flex-shrink:0;color:#fff}
.chat-avatar.ai{background:linear-gradient(135deg,var(--gold),var(--gold-deep))}
.chat-avatar.user{background:linear-gradient(135deg,#2563EB,#1D4ED8)}
.chat-bubble{max-width:78%;padding:11px 14px;border-radius:14px;font-size:var(--fs-body);
  line-height:1.75;white-space:pre-wrap;word-break:break-word}
.chat-msg.ai .chat-bubble{background:#fff;border:1px solid var(--line);color:var(--ink);
  border-top-left-radius:5px}
.chat-msg.user .chat-bubble{background:var(--gold-bg);color:var(--ink);border-top-right-radius:5px}

.chat-suggests{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 18px}
.chat-suggest{padding:8px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);
  font-size:var(--fs-sm);color:var(--ink2);cursor:pointer;transition:.15s}
.chat-suggest:active{background:var(--gold-bg);color:var(--gold);border-color:rgba(184,134,11,.35)}

/* 底部：语音输入 */
.chat-input-bar{flex-shrink:0;padding:10px 18px 92px;background:#fff;
  border-top:1px solid var(--line)}

.voice-bar{display:flex;align-items:center;gap:10px}
.voice-main{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  height:46px;border-radius:23px;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;
  font-size:var(--fs-body-lg);font-weight:600;letter-spacing:.3px;
  box-shadow:0 8px 18px rgba(184,134,11,.25);transition:.15s}
.voice-main:active{transform:scale(.98)}
.voice-main svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.kb-btn{width:44px;height:46px;border-radius:23px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:.15s}
.kb-btn:active{background:var(--gray-bg)}
.kb-btn svg{width:20px;height:20px;stroke:var(--ink2);stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* 文字输入模式 */
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.voice-mini{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--gold);cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:.15s}
.voice-mini:active{background:var(--gold-bg)}
.voice-mini svg{width:20px;height:20px;stroke:var(--gold);stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.chat-input-row input{flex:1;padding:11px 16px;border:1.5px solid var(--line);
  border-radius:22px;font-size:var(--fs-body);outline:none;font-family:inherit;
  color:var(--ink);background:#fff;min-width:0}
.chat-input-row input:focus{border-color:var(--gold)}
.chat-send{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:.15s}
.chat-send:active{transform:scale(.94)}
.chat-send svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ===== 语音浮层 ===== */
.voice-overlay{position:absolute;inset:0;background:rgba(15,27,45,.55);backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;z-index:200;padding:0}
.voice-overlay.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.voice-panel{width:100%;background:#fff;border-radius:26px 26px 0 0;
  padding:28px 22px 44px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.6}to{transform:translateY(0);opacity:1}}
.voice-wave{display:flex;justify-content:center;gap:5px;height:56px;align-items:center;margin-bottom:14px}
.voice-wave span{width:5px;background:var(--gold);border-radius:3px;
  animation:wave 1s ease-in-out infinite}
.voice-wave span:nth-child(1){animation-delay:0s;height:18px}
.voice-wave span:nth-child(2){animation-delay:.1s;height:32px}
.voice-wave span:nth-child(3){animation-delay:.2s;height:48px}
.voice-wave span:nth-child(4){animation-delay:.3s;height:32px}
.voice-wave span:nth-child(5){animation-delay:.4s;height:18px}
@keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.5)}}
.voice-status{font-size:var(--fs-body-lg);font-weight:600;color:var(--ink);
  text-align:center;margin-bottom:10px}
.voice-transcript{font-size:var(--fs-body);color:var(--ink2);line-height:1.7;
  min-height:56px;padding:13px 15px;background:var(--gray-bg);border-radius:12px;
  margin-bottom:18px;font-style:italic;text-align:left}
.voice-transcript.empty{color:var(--ink3);font-style:normal;display:flex;
  align-items:center;justify-content:center;text-align:center}
.voice-cancel{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);
  background:transparent;color:var(--ink2);font-size:var(--fs-body-lg);font-weight:500;
  cursor:pointer;font-family:inherit}
.voice-cancel:active{background:var(--gray-bg)}

/* ===== 最佳实践 ===== */
.page{padding:16px 18px 100px}
.hd{padding:0 2px 16px}
.hd-title{font-size:var(--fs-display);font-weight:600;letter-spacing:-.3px;line-height:1.2}

.bp-search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:0 12px;margin-bottom:12px}
.bp-search .bp-s-ico{color:var(--ink3);font-size:var(--fs-body)}
.bp-search input{flex:1;border:none;outline:none;background:transparent;padding:11px 0;
  font-size:var(--fs-body);font-family:inherit;color:var(--ink);min-width:0}
.bp-search input::placeholder{color:var(--ink3)}

.bp-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin-bottom:12px}
.bp-tabs::-webkit-scrollbar{display:none}
.bp-tab{flex-shrink:0;padding:6px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);
  font-size:var(--fs-sm);color:var(--ink2);font-weight:500;cursor:pointer;transition:.15s}
.bp-tab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.bp-tab:active{transform:scale(.96)}

.bp-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:9px;transition:.15s;overflow:hidden;display:flex;flex-direction:column}
.bp-cover{height:72px;border-radius:9px;margin-bottom:9px;position:relative;
  display:flex;align-items:center;justify-content:center;color:#fff;
  cursor:pointer;overflow:hidden;flex-shrink:0}
.bp-cover::before{content:'';position:absolute;top:-34px;right:-24px;width:100px;height:100px;
  border-radius:50%;background:rgba(255,255,255,.10)}
.bp-cat-float{position:absolute;top:7px;left:7px;z-index:2;
  font-size:9px;font-weight:600;padding:2px 6px;border-radius:5px;
  background:rgba(255,255,255,.92);color:var(--ink2);line-height:1.3}
.bp-cover-char{font-size:26px;font-weight:700;opacity:.9;letter-spacing:-1px;position:relative}
.bp-cover-play{position:absolute;right:7px;bottom:7px;width:22px;height:22px;
  border-radius:50%;background:rgba(0,0,0,.32);display:flex;align-items:center;
  justify-content:center;font-size:8px;backdrop-filter:blur(4px)}
.bp-cover-move{background:linear-gradient(135deg,#3B82F6,#1E40AF)}
.bp-cover-diet{background:linear-gradient(135deg,#D97706,#92400E)}
.bp-cover-breath{background:linear-gradient(135deg,#0891B2,#155E75)}
.bp-cover-rest{background:linear-gradient(135deg,#6366F1,#3730A3)}
.bp-cover-mind{background:linear-gradient(135deg,#BE123C,#881337)}

.bp-title{font-size:13px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bp-inventor{font-size:10px;color:var(--ink3);line-height:1.4;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bp-join-row{margin-top:6px}
.bp-join-num{font-size:11px;color:var(--ink3);line-height:1.2}
.bp-join-num b{color:var(--gold);font-size:19px;font-weight:700;margin-right:2px;
  letter-spacing:-.5px;vertical-align:-1px}

.bp-foot{display:flex;gap:5px;margin-top:8px}
.bp-btn{flex:1;padding:6px 4px;border-radius:14px;border:none;font-family:inherit;
  font-size:11px;font-weight:600;cursor:pointer;transition:.15s;text-align:center;
  white-space:nowrap}
.bp-btn:active{transform:scale(.97)}
.bp-btn-join{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(184,134,11,.35)}
.bp-btn-join.on{background:var(--gray-bg);color:var(--ink3);border-color:transparent}
.bp-btn-share{background:#fff;color:var(--ink2);border:1px solid var(--line)}

.bp-more{width:100%;padding:12px;border-radius:var(--r-md);background:#fff;
  border:1px solid var(--line);color:var(--ink2);font-size:var(--fs-sm);font-weight:600;
  cursor:pointer;font-family:inherit;margin-top:2px;display:block}
.bp-more:active{background:var(--gray-bg)}
.bp-empty{text-align:center;padding:28px 20px;color:var(--ink3);font-size:var(--fs-sm);
  grid-column:1 / -1}

/* ===== 健康管理 ===== */
.user-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.user-avatar{width:52px;height:52px;border-radius:50%;background:var(--gray-bg);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-title);
  font-weight:700;color:var(--ink3);flex-shrink:0;overflow:hidden}
.user-avatar.logged{background:linear-gradient(135deg,var(--wechat),#059669);color:#fff}
.user-main{flex:1;min-width:0}
.user-name{font-size:var(--fs-title);font-weight:700;color:var(--ink)}
.user-sub{font-size:var(--fs-sm);color:var(--ink3);margin-top:4px}
.user-login-btn{flex-shrink:0;background:var(--wechat);color:#fff;border:none;
  padding:9px 15px;border-radius:20px;font-size:var(--fs-sm);font-weight:600;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.user-login-btn:active{opacity:.9}
.user-logout{flex-shrink:0;color:var(--ink3);font-size:var(--fs-sm);cursor:pointer;
  padding:6px 4px}

.sec{font-size:var(--fs-sm);font-weight:600;color:var(--ink2);margin:20px 2px 10px;
  letter-spacing:.2px}
.mgr-group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:0 16px;margin-bottom:8px}
.mgr-row{display:flex;align-items:center;gap:14px;padding:15px 0;
  border-bottom:1px solid var(--line2);cursor:pointer}
.mgr-row:last-child{border-bottom:none}
.mgr-row:active{opacity:.7}
.mgr-row-ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--gold-bg);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:var(--fs-sm);font-weight:700;flex-shrink:0}
.mgr-row-ico.blue{background:var(--blue-bg);color:var(--blue)}
.mgr-row-main{flex:1;min-width:0}
.mgr-row-t{font-size:var(--fs-body);color:var(--ink);font-weight:500}
.mgr-row-s{font-size:var(--fs-sm);color:var(--ink3);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mgr-row-val{font-size:var(--fs-sm);color:var(--ink3);flex-shrink:0}

/* ===== Sheet ===== */
.modal{position:fixed;inset:0;background:rgba(15,27,45,.45);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:99;
  overscroll-behavior:contain}
.modal.open{display:flex;animation:fade .2s}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  background:#fff;border-radius:24px 24px 0 0;padding:22px 20px 38px;
  position:relative;animation:up .3s cubic-bezier(.2,.9,.3,1);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y}
.sheet::-webkit-scrollbar{display:none}
.sh-head{margin-bottom:18px}
.sh-title-row{display:flex;align-items:flex-start;justify-content:space-between}
.sh-name{font-size:var(--fs-title);font-weight:600}
.sh-date{font-size:var(--fs-sm);color:var(--ink3);margin-top:5px;letter-spacing:.3px}
.sh-x{width:30px;height:30px;border-radius:50%;background:var(--gray-bg);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--fs-body);
  flex-shrink:0}

.detail-block{margin-bottom:18px}
.detail-block:last-child{margin-bottom:0}
.detail-t{font-size:var(--fs-micro);color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:10px}
.detail-p{font-size:var(--fs-base);color:var(--ink2);line-height:1.75}

.kv-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line2);font-size:var(--fs-base)}
.kv-row:last-child{border-bottom:none}
.kv-k{width:76px;flex-shrink:0;color:var(--ink3);font-size:var(--fs-sm)}
.kv-v{flex:1;color:var(--ink);line-height:1.6;text-align:right}

.rec-item{padding:11px 0;border-bottom:1px solid var(--line2)}
.rec-item:last-child{border-bottom:none}
.rec-date{font-size:var(--fs-xs);color:var(--ink3)}
.rec-title{font-size:var(--fs-base);font-weight:600;color:var(--ink);margin-top:3px}
.rec-desc{font-size:var(--fs-sm);color:var(--ink2);line-height:1.6;margin-top:4px}

.sh-btn{margin-top:18px;background:var(--ink);color:#fff;font-size:var(--fs-body-lg);
  font-weight:600;text-align:center;padding:14px;border-radius:var(--r-md);cursor:pointer}
.sh-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500}

.video-frame{height:168px;border-radius:var(--r-md);color:#fff;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;
  margin-bottom:16px;position:relative;overflow:hidden}
.video-frame::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.video-frame .vf-play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:15px;position:relative}
.video-frame .vf-t{font-size:var(--fs-sm);color:rgba(255,255,255,.75);position:relative}
.video-frame .vf-char{position:absolute;font-size:80px;opacity:.12;font-weight:700}

.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
  background:rgba(15,27,45,.9);color:#fff;font-size:var(--fs-base);padding:11px 20px;
  border-radius:20px;z-index:400;animation:fade .2s;white-space:nowrap}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>06:35</span><span class="r">5G · 87%</span></div>
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar"></nav>

  <!-- 语音浮层 -->
  <div class="voice-overlay" id="voiceOverlay">
    <div class="voice-panel" id="voicePanel"></div>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ 数据 ============ */
const TABS = [
  {k:'assistant', n:'健康助手', p:'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'},
  {k:'practice', n:'最佳实践', p:'M12 2l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 16.8 6.2 19.9l1.1-6.5L2.6 8.8l6.5-.9z'},
  {k:'manage', n:'健康管理', p:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'}
];

const PRACTICE_CATS = ['全部','动作','饮食','呼吸','作息','心态'];
const CAT_CLS = {'动作':'move','饮食':'diet','呼吸':'breath','作息':'rest','心态':'mind'};
const CAT_CHAR = {'动作':'动','饮食':'食','呼吸':'息','作息':'眠','心态':'心'};

const BEST_PRACTICES = [
  {id:'bp1', cat:'动作', title:'靠墙静蹲 60 秒',
   howText:'背靠墙站立，双脚与肩同宽，向前迈半步，沿墙下滑至大腿与地面平行，保持 60 秒，起身休息 30 秒，做 2 组。',
   howVideo:'背贴墙面，膝盖不超过脚尖，呼吸均匀，起身时扶墙慢起。',
   inventor:'钱主席', joins:342},
  {id:'bp2', cat:'呼吸', title:'4-7-8 呼吸',
   howText:'吸气 4 秒、屏息 7 秒、呼气 8 秒，做 4 轮，可在座位或车里完成。',
   howVideo:'鼻吸口呼，肩膀放松，呼气时像吹蜡烛一样轻。',
   inventor:'王总', joins:327},

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'

}

function aiReply(text){
  const t = text || '';

  if(/早餐|早饭|午饭|午餐|晚饭|晚餐|吃了|喝了|走了.*步/.test(t) && !/怎么|什么|为什么/.test(t)){

  }
  if(/这周|本周|趋势|比上周|最近几天/.test(t)){
    return '这周你平均睡了 7 小时 12 分钟，比上周多了 12 分钟，夜里醒的次数也从 3 次降到 2 次。\n有两天睡得偏晚，是不是那两天有事？\n整体在往好的方向走，不用着急。';
  }
  if(/低密度|胆固醇|指标|报告|体检.*意思/.test(t)){
    return '低密度脂蛋白是“坏胆固醇”，偏高会让血管更容易堵。\n你这次 3.8，比正常上限 3.4 高一点，先不用紧张。\n少吃油炸和肥肉，多走动，三个月后复查一次就好。';
  }
  if(/看医生|就诊|整理.*说|去医院/.test(t)){
    return '好，我帮你理一份，到时候直接给医生看：\n· 最近血压 128/82 左右，偶尔头晕\n· 颈肩僵，伏案久了更明显\n· 正在吃的药：降压药每天一次\n· 想确认：要不要调药、多久复查\n还需要补充别的吗？';
  }
  if(/提醒|复查|到时候/.test(t)){
    return '好，我记下了，三个月后提醒你复查。\n到时候我会提前一周来问你，免得你忙起来忘了。\n要提醒的还有别的吗？';
  }
  if(/累|烦|焦虑|压力|心情|不开心|撑不住/.test(t)){
    return '嗯，累了就歇一会儿，不用硬撑。\n今天最让你烦的是哪件事？我陪你想想。\n如果不想说，我们就先做一次呼吸：吸气 4 秒，屏息 7 秒，呼气 8 秒，做 4 轮。';
  }
  if(/少问|多问|偏好|直接给结论|别啰嗦/.test(t)){
    return '好，以后我少问一点，多直接给结论。\n有特别想让我盯着的，也随时告诉我。\n比如血压、睡眠、应酬，你挑一个最想让我留意的？';
  }
  if(/睡|失眠|入睡|夜醒/.test(t)){
    return '听起来昨晚没太休息好，辛苦了。\n今晚可以试试：睡前把手机放到卧室外面，给自己留 90 分钟安静下来。\n如果躺下 20 分钟还没睡着，就起来坐一会儿，等困了再回床。\n明天早上跟我说说，昨晚几点睡着的？';
  }
  if(/血压|心血管|心慌|胸闷/.test(t)){
    return '嗯，血压这事确实值得多留意一点。\n不用紧张，我们可以先做几件小事：每天固定一个时间量一次并记下来；晚饭后慢走 12 分钟；应酬多的时候，尽量给自己留一天不喝酒。\n如果连续几天都偏高，我陪你去看看医生，好不好？';
  }
  if(/运动|久坐|散步|快走/.test(t)){
    return '久坐一整天，身体确实会有点闷。\n要不我们从最小的开始：每坐一小时，起来站两分钟，做几个提踵。\n晚饭后如果有空，慢走 12 分钟就很好。\n你平时晚饭后一般在家还是在外面？我好帮你想想怎么安排。';
  }
  if(/吃|饮食|应酬|喝酒|血糖/.test(t)){
    return '应酬多的时候，吃饭顺序其实能帮上不少忙。\n可以先吃几口蔬菜，再吃蛋白，最后吃主食，餐后血糖会稳一些。\n饭后如果方便，用一杯茶代替含糖饮料。\n你最近应酬大概一周几次？我按你的节奏来想办法。';

  }

function appendChatMessage(m){
  const scroll = document.getElementById('chatScroll');
  if(!scroll) return;
  const sug = scroll.querySelector('.chat-suggests');
  if(sug) sug.remove();
  const tmp = document.createElement('div');
  tmp.innerHTML = chatMsgHtml(m);
  scroll.appendChild(tmp.firstElementChild);
}
function scrollChatToBottom(){
  const scroll = document.getElementById('chatScroll');
  if(scroll) scroll.scrollTop = scroll.scrollHeight;
}
function sendChat(text){
  const t = (text || '').trim();
  if(!t || state.chatBusy) return;

  const userMsg = {role:'user', text:t};
  state.chat.push(userMsg);
  appendChatMessage(userMsg);
  scrollChatToBottom();

  const input = document.getElementById('chatInput');
  if(input) input.value = '';

  state.chatBusy = true;
  const loading = {role:'ai', text:'我想一想…'};
  appendChatMessage(loading);
  scrollChatToBottom();

  setTimeout(()=>{
    const scroll = document.getElementById('chatScroll');
    if(scroll){
      const last = scroll.lastElementChild;
      if(last && last.classList.contains('chat-msg')) last.remove();
    }
    const reply = {role:'ai', text: aiReply(t)};
    state.chat.push(reply);
    appendChatMessage(reply);
    scrollChatToBottom();
    state.chatBusy = false;
  }, 700);
}

  `;

  const text = VOICE_DEMOS[state.voiceIndex % VOICE_DEMOS.length];
  state.voiceIndex += 1;

  setTimeout(()=>{
    const status = document.getElementById('voiceStatus');
    const tr = document.getElementById('voiceTranscript');
    if(!overlay.classList.contains('open')) return;
    if(status) status.textContent = '识别中…';
    if(tr){
      tr.classList.remove('empty');
      tr.textContent = '“' + text + '”';

  setTimeout(()=>{

    closeVoicePanel();

  }, 1900);

function practiceListHtml(){
  let list = BEST_PRACTICES.slice().sort((a,b)=>b.joins-a.joins);
  if(state.practiceCat !== '全部') list = list.filter(p=>p.cat===state.practiceCat);

  const q = (state.practiceQuery || '').trim().toLowerCase();
  if(q){
    list = list.filter(p=>{
      const hay = [p.title, p.cat, p.inventor, p.howText].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  const total = list.length;
  const limit = q ? 999 : state.practiceLimit;
  const shown = list.slice(0, limit);
  const cards = shown.length
    ? shown.map(practiceCardHtml).join('')
    : `<div class="bp-empty">没有找到相关实践</div>`;
  const moreBtn = (!q && total > shown.length)
    ? `<button class="bp-more" data-bp-more>查看全部 ${total} 个</button>` : '';
  return cards + moreBtn;
}

             </svg>

    <div class="sec">健康档案</div>
    <div class="mgr-group">
      <div class="mgr-row" data-profile="basic">
        <div class="mgr-row-ico">基</div>
        <div class="mgr-row-main">
          <div class="mgr-row-t">基础信息</div>

          <div class="mgr-row-s">${PROFILE.records.length} 条记录</div>

        <div class="mgr-row-val">›</div>
      </div>
      <div class="mgr-row" data-profile="tcm">

        <div class="mgr-row-main">
          <div class="mgr-row-t">中医诊断</div>

          <div class="mgr-row-t">用户协议</div>
          <div class="mgr-row-s">使用本应用前请阅读</div>

        <div class="mgr-row-val">›</div>
      </div>
      <div class="mgr-row" data-agreement="privacy">
        <div class="mgr-row-ico blue">隐</div>
        <div class="mgr-row-main">
          <div class="mgr-row-t">隐私保护协议</div>
          <div class="mgr-row-s">我们如何收集和使用你的数据</div>
        </div>
        <div class="mgr-row-val">›</div>
      </div>

  </div>`;
}

/* ============ 渲染入口 ============ */
function render(){
  const map = {
    assistant: renderAssistant,
    practice: renderPractice,
    manage: renderManage
  };
  document.getElementById('screen').innerHTML = map[state.tab]();

  document.getElementById('tabbar').innerHTML = TABS.map(t=>
    `<div class="tab ${t.k===state.tab?'active':''}" data-tab="${t.k}">
      <svg viewBox="0 0 24 24"><path d="${t.p}"/></svg><div>${t.n}</div>
    </div>`).join('');

  if(state.tab === 'assistant'){
    setTimeout(scrollChatToBottom, 30);
  }
}

/* ============ Sheet ============ */
function openSheet(title, body){
  document.getElementById('sheet').innerHTML = `
    <div class="sh-head">
      <div class="sh-title-row">
        <div style="flex:1;min-width:0">
          <div class="sh-name">${title}</div>
        </div>
        <div class="sh-x" data-close>✕</div>
      </div>
    </div>
    ${body}`;
  document.getElementById('modal').classList.add('open');
  document.getElementById('sheet').scrollTop = 0;
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}

function openProfile(key){
  if(key === 'basic'){
    const rows = PROFILE.basic.map(it=>
      `<div class="kv-row"><div class="kv-k">${it.k}</div><div class="kv-v">${it.v}</div></div>`
    ).join('');
    openSheet('基础信息', `
      <div class="detail-block">${rows}</div>
      <div class="sh-btn ghost" data-close>关闭</div>
    `);
    return;
  }
  if(key === 'records'){
    const rows = PROFILE.records.map(r=>
      `<div class="rec-item">
        <div class="rec-date">${r.date}</div>
        <div class="rec-title">${r.title}</div>
        <div class="rec-desc">${r.desc}</div>
      </div>`
    ).join('');
    openSheet('病例与体检报告', `
      <div class="detail-block">${rows}</div>
      <div class="sh-btn ghost" data-close>关闭</div>
    `);
    return;
  }
  if(key === 'tcm'){
    const rows = PROFILE.tcm.map(it=>
      `<div class="kv-row"><div class="kv-k">${it.k}</div><div class="kv-v">${it.v}</div></div>`
    ).join('');
    openSheet('中医诊断', `
      <div class="detail-block">${rows}</div>
      <div class="sh-btn ghost" data-close>关闭</div>
    `);
    return;
  }
}

function openAgreement(key){
  const a = AGREEMENTS[key];
  if(!a) return;
  openSheet(a.title, `
    <div class="detail-block">
      <div class="detail-p" style="white-space:pre-wrap">${escapeHtml(a.body)}</div>
    </div>
    <div class="sh-btn ghost" data-close>关闭</div>
  `);
}

function openPracticeVideo(id){
  const p = BEST_PRACTICES.find(x=>x.id===id);
  if(!p) return;
  const on = !!state.joined[p.id];
  const cls = CAT_CLS[p.cat] || 'mind';
  const char = CAT_CHAR[p.cat] || '·';
  openSheet('视频做法', `
    <div class="video-frame bp-cover-${cls}">
      <div class="vf-char">${char}</div>
      <div class="vf-play">▶</div>
      <div class="vf-t">${p.title}</div>
    </div>
    <div class="detail-block">
      <div class="detail-t">画面说明</div>
      <div class="detail-p">${p.howVideo || '视频待补充'}</div>
    </div>
    <div class="detail-block">
      <div class="detail-t">文字做法</div>
      <div class="detail-p">${p.howText}</div>
    </div>
    <div class="detail-block">
      <div class="detail-t">发明人</div>
      <div class="detail-p">${p.inventor}</div>
      <div style="margin-top:10px;font-size:var(--fs-sm);color:var(--ink3)">
        <b style="color:var(--gold);font-size:22px;font-weight:700;margin-right:4px">${p.joins}</b> 个康友加入
      </div>
    </div>
    <div class="sh-btn" data-bp-join="${p.id}">${on?'已加入':'加入这个实践'}</div>
    <div class="sh-btn ghost" data-close>关闭</div>
  `);
}

function openPracticeShare(id){
  const p = BEST_PRACTICES.find(x=>x.id===id);
  if(!p) return;
  openSheet('转发实践', `
    <div class="detail-block">
      <div class="detail-t">${p.title}</div>
      <div class="detail-p">${p.howText}</div>
      <div class="detail-p" style="margin-top:10px;color:var(--ink3);font-size:var(--fs-sm)">
        发明人：${p.inventor} · ${p.joins} 个康友加入
      </div>
    </div>
    <div class="sh-btn" data-share-done>转发给朋友</div>
    <div class="sh-btn ghost" data-close>取消</div>
  `);
}

/* ============ 事件 ============ */
document.addEventListener('click', e=>{
  const tab = e.target.closest('[data-tab]');
  if(tab){
    state.tab = tab.dataset.tab;
    render();
    return;
  }

  /* 语音 / 文字切换 */
  const modeBtn = e.target.closest('[data-input-mode]');
  if(modeBtn){
    state.inputMode = modeBtn.dataset.inputMode;
    render();
    setTimeout(()=>{
      if(state.inputMode === 'text'){
        const inp = document.getElementById('chatInput');
        if(inp) inp.focus();
      }
      scrollChatToBottom();
    }, 30);
    return;
  }

  /* 打开语音 */
  if(e.target.closest('[data-voice-start]')){
    openVoicePanel();
    return;
  }
  if(e.target.closest('[data-voice-cancel]')){
    closeVoicePanel();
    return;
  }

  if(e.target.closest('[data-chat-send]')){
    const input = document.getElementById('chatInput');
    sendChat(input ? input.value : '');
    return;
  }
  const sug = e.target.closest('[data-suggest]');
  if(sug){
    sendChat(sug.dataset.suggest);
    return;
  }

  const cat = e.target.closest('[data-practice-cat]');
  if(cat){
    state.practiceCat = cat.dataset.practiceCat;
    refreshPracticeList();
    return;
  }
  if(e.target.closest('[data-bp-more]')){
    state.practiceLimit = 999;
    refreshPracticeList();
    return;
  }
  const joinBtn = e.target.closest('[data-bp-join]');
  if(joinBtn){
    const id = joinBtn.dataset.bpJoin;
    if(state.joined[id]){
      delete state.joined[id];
    } else {
      state.joined[id] = true;
    }
    refreshPracticeList();
    if(document.getElementById('modal').classList.contains('open')){
      openPracticeVideo(id);
    }
    return;
  }
  const video = e.target.closest('[data-bp-video]');
  if(video){ openPracticeVideo(video.dataset.bpVideo); return; }
  const share = e.target.closest('[data-bp-share]');
  if(share){ openPracticeShare(share.dataset.bpShare); return; }

  if(e.target.closest('[data-login]')){
    state.loggedIn = true;
    state.user = {name:'钱主席', id:'BR-2026-0813'};
    render();
    setTimeout(()=>toast('登录成功'), 120);
    return;
  }
  if(e.target.closest('[data-logout]')){
    state.loggedIn = false;
    state.user = {name:'', id:''};
    render();
    return;
  }
  const profile = e.target.closest('[data-profile]');
  if(profile){ openProfile(profile.dataset.profile); return; }
  const agr = e.target.closest('[data-agreement]');
  if(agr){ openAgreement(agr.dataset.agreement); return; }

  if(e.target.closest('[data-share-done]')){
    closeModal();
    setTimeout(()=>toast('已发送'), 120);
    return;
  }
  if(e.target.closest('[data-close]') || e.target.id === 'modal'){
    closeModal();
  }
});

document.addEventListener('input', e=>{
  if(e.target.hasAttribute('data-bp-search')){
    state.practiceQuery = e.target.value;
    refreshPracticeList();
  }
});

document.addEventListener('keydown', e=>{
  if(e.target.id === 'chatInput' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendChat(e.target.value);
  }
});

render();
</script>
</body>
</html>
