<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS · 一人一策</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(circle at 50% 0%,#14110A,#05070A 70%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#E8EEF5;padding:24px;
}
.phone{
  width:400px;height:844px;background:#0A0E13;border-radius:42px;
  border:1px solid #23201A;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.85),0 0 0 9px #0d1218,0 0 0 10px #1b242e;
  position:relative;
}
.statusbar{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:12.5px;color:#8A8578;letter-spacing:.4px;z-index:30;position:relative}
.screen{flex:1;overflow-y:auto;padding:0 18px 108px;scrollbar-width:none;position:relative}
.screen::-webkit-scrollbar{display:none}

/* ---------- 底部导航 ---------- */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:80px;display:flex;
  background:rgba(10,14,19,.96);backdrop-filter:blur(24px);
  border-top:1px solid #23201A;padding-bottom:18px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font-size:10px;color:#5A5548;cursor:pointer;transition:.2s;user-select:none}
.tab .ico{font-size:20px;line-height:1;filter:grayscale(1) opacity(.5)}
.tab.active{color:#D4AF37}
.tab.active .ico{filter:none;transform:scale(1.05)}

/* ---------- 通用 ---------- */
.sec-t{font-size:14px;font-weight:600;color:#D8CDB5;letter-spacing:.3px;
  display:flex;align-items:center;gap:8px;margin:20px 2px 11px}
.sec-t .bar{width:3px;height:13px;border-radius:2px;background:#D4AF37}
.card{background:#111821;border:1px solid #23201A;border-radius:16px;padding:15px;margin-bottom:10px}
.muted{color:#6B6758;font-size:11.5px;line-height:1.6}
.greet{padding:6px 2px 16px}
.g-date{font-size:12.5px;color:#6B6758;letter-spacing:.8px}
.g-hello{font-size:23px;font-weight:600;margin-top:7px;letter-spacing:.5px}
.g-hello span{color:#D4AF37}

/* ---------- 引导流程 ---------- */
.onb{position:absolute;inset:0;background:#0A0E13;z-index:50;display:none;
  flex-direction:column;border-radius:42px;overflow:hidden}
.onb.open{display:flex}
.onb-body{flex:1;overflow-y:auto;padding:0 26px;scrollbar-width:none}
.onb-body::-webkit-scrollbar{display:none}
.onb-foot{flex-shrink:0;padding:16px 26px 30px;background:#0A0E13}

/* 进度条 */
.onb-progress{display:flex;gap:5px;padding:14px 26px 0;flex-shrink:0}
.onb-dot{flex:1;height:3px;border-radius:3px;background:#1E1B14;transition:.3s}
.onb-dot.done{background:#D4AF37}
.onb-dot.cur{background:#D4AF37;box-shadow:0 0 8px rgba(212,175,55,.6)}

/* 欢迎页 */
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 32px;text-align:center}
.w-logo{font-size:13px;color:#D4AF37;letter-spacing:5px;font-weight:600;margin-bottom:32px}
.w-title{font-size:30px;font-weight:700;line-height:1.35;letter-spacing:.5px}
.w-title span{color:#D4AF37}
.w-desc{font-size:14.5px;color:#A89C7E;line-height:1.85;margin-top:22px}
.w-steps{margin-top:44px;text-align:left}
.w-step{display:flex;gap:14px;padding:13px 0;align-items:flex-start}
.w-step-n{width:26px;height:26px;border-radius:50%;background:rgba(212,175,55,.12);
  color:#D4AF37;font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px}
.w-step-t{font-size:14.5px;color:#D8CDB5;line-height:1.5;font-weight:500}
.w-step-s{font-size:12px;color:#7A7568;margin-top:5px;line-height:1.55}
.w-meta{font-size:11.5px;color:#5A5548;margin-top:36px;letter-spacing:.5px}

/* 问卷 */
.q-head{padding:28px 0 22px}
.q-step{font-size:11.5px;color:#D4AF37;letter-spacing:2px;font-weight:600}
.q-title{font-size:23px;font-weight:600;line-height:1.4;margin-top:10px;letter-spacing:.3px}
.q-sub{font-size:13px;color:#7A7568;line-height:1.7;margin-top:11px}

.q-field{margin-bottom:20px}
.q-label{font-size:13.5px;color:#D8CDB5;margin-bottom:11px;font-weight:500;display:flex;
  align-items:center;justify-content:space-between}
.q-label em{font-style:normal;font-size:11px;color:#6B6758}
.q-input{width:100%;background:#111821;border:1px solid #23201A;border-radius:13px;
  padding:14px 16px;font-size:15px;color:#E8EEF5;outline:none;font-family:inherit;
  transition:.15s}
.q-input:focus{border-color:#D4AF37}
.q-input::placeholder{color:#4A4538}

.q-opts{display:flex;flex-direction:column;gap:9px}
.q-opt{background:#111821;border:1px solid #23201A;border-radius:13px;
  padding:14px 16px;font-size:14.5px;color:#A8A08C;cursor:pointer;transition:.15s;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.q-opt:active{background:#161A20}
.q-opt.on{background:rgba(212,175,55,.1);border-color:#D4AF37;color:#D4AF37;font-weight:600}
.q-opt-ck{width:20px;height:20px;border-radius:50%;border:1.5px solid #2E2A22;
  display:flex;align-items:center;justify-content:center;font-size:11px;
  color:transparent;flex-shrink:0;transition:.2s}
.q-opt.on .q-opt-ck{background:#D4AF37;border-color:#D4AF37;color:#0A0E13}

.q-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.q-chip{background:#111821;border:1px solid #23201A;border-radius:13px;
  padding:14px 10px;text-align:center;font-size:14px;color:#A8A08C;
  cursor:pointer;transition:.15s}
.q-chip:active{background:#161A20}
.q-chip.on{background:rgba(212,175,55,.1);border-color:#D4AF37;color:#D4AF37;font-weight:600}

.q-slider{display:flex;gap:7px;justify-content:space-between}
.q-sl{flex:1;background:#111821;border:1px solid #23201A;border-radius:11px;
  padding:12px 4px;text-align:center;font-size:12.5px;color:#8A8578;
  cursor:pointer;transition:.15s}
.q-sl.on{background:rgba(212,175,55,.1);border-color:#D4AF37;color:#D4AF37;font-weight:600}

/* 体检上传 */
.upload-card{background:linear-gradient(135deg,#141B24,#111821);border:1px solid #23201A;
  border-radius:18px;padding:22px;text-align:center;margin-bottom:14px}
.upload-ico{font-size:40px;margin-bottom:14px}
.upload-t{font-size:16px;font-weight:600;color:#D8CDB5}
.upload-s{font-size:12.5px;color:#7A7568;line-height:1.65;margin-top:9px}
.upload-btn{margin-top:18px;background:#D4AF37;color:#0A0E13;font-size:15px;
  font-weight:600;padding:14px;border-radius:14px;cursor:pointer;letter-spacing:.5px}
.upload-btn:active{opacity:.8}
.upload-alt{display:flex;gap:9px;margin-top:11px}
.upload-alt div{flex:1;background:#111821;border:1px solid #23201A;border-radius:13px;
  padding:13px;text-align:center;font-size:13px;color:#A8A08C;cursor:pointer}
.upload-alt div:active{background:#161A20}

.uploaded{background:#111821;border:1px solid #23201A;border-radius:16px;padding:15px;
  margin-bottom:10px;display:flex;align-items:center;gap:13px}
.uploaded-ico{width:44px;height:44px;border-radius:13px;background:rgba(46,212,122,.12);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.uploaded-t{font-size:14px;font-weight:600;color:#D8CDB5}
.uploaded-s{font-size:11.5px;color:#7A7568;margin-top:5px;line-height:1.5}
.uploaded-badge{font-size:10.5px;color:#2ED47A;background:rgba(46,212,122,.1);
  padding:3px 9px;border-radius:20px;margin-left:auto;flex-shrink:0}

/* 生成中 */
.gen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 40px;text-align:center}
.gen-ring{width:80px;height:80px;border-radius:50%;border:3px solid #1E1B14;
  border-top-color:#D4AF37;animation:spin 1s linear infinite;margin-bottom:28px}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-t{font-size:18px;font-weight:600;color:#D8CDB5}
.gen-s{font-size:13px;color:#7A7568;line-height:1.7;margin-top:12px}
.gen-steps{margin-top:32px;text-align:left;width:100%}
.gen-step{display:flex;align-items:center;gap:11px;padding:9px 0;
  font-size:13px;color:#5A5548;transition:.3s}
.gen-step.on{color:#D4AF37}
.gen-step-dot{width:7px;height:7px;border-radius:50%;background:#2E2A22;flex-shrink:0;transition:.3s}
.gen-step.on .gen-step-dot{background:#D4AF37;box-shadow:0 0 8px #D4AF37}

/* 策略结果 */
.result-hero{background:linear-gradient(135deg,#1C1810,#111821);border:1px solid #3A2E18;
  border-radius:20px;padding:22px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.result-hero::before{content:'';position:absolute;top:-60px;right:-50px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.16),transparent 70%)}
.result-label{font-size:11.5px;color:#D4AF37;letter-spacing:2px;font-weight:600}
.result-t{font-size:22px;font-weight:600;line-height:1.4;margin-top:12px;
  color:#E8EEF5;position:relative}
.result-d{font-size:13.5px;color:#A89C7E;line-height:1.7;margin-top:12px;position:relative}

.result-sec{background:#111821;border:1px solid #23201A;border-radius:16px;
  padding:16px;margin-bottom:11px}
.result-sec-t{font-size:11.5px;color:#D4AF37;letter-spacing:1.5px;font-weight:600;
  margin-bottom:12px}
.result-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #1B1F26;
  align-items:flex-start}
.result-row:last-child{border-bottom:none;padding-bottom:0}
.result-row-n{width:22px;height:22px;border-radius:50%;background:rgba(212,175,55,.12);
  color:#D4AF37;font-size:11px;font-weight:700;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px}
.result-row-t{font-size:14px;color:#D8CDB5;line-height:1.5}
.result-row-s{font-size:12px;color:#7A7568;margin-top:5px;line-height:1.55}

.result-main{background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.3);
  border-radius:14px;padding:15px;margin-bottom:11px}
.result-main-lb{font-size:11px;color:#D4AF37;letter-spacing:1.2px;font-weight:600}
.result-main-t{font-size:16px;font-weight:600;color:#E8EEF5;margin-top:9px;line-height:1.45}
.result-main-s{font-size:12.5px;color:#A89C7E;margin-top:8px;line-height:1.6}

/* ---------- 今日页 ---------- */
.hero{background:linear-gradient(135deg,#1C1810,#111821);border:1px solid #3A2E18;
  border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
  cursor:pointer;transition:.15s}
.hero:active{transform:scale(.985)}
.hero::before{content:'';position:absolute;top:-50px;right:-40px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.15),transparent 70%)}
.hero-top{display:flex;align-items:baseline;gap:10px;position:relative}
.hero-label{font-size:12.5px;color:#A89C7E;letter-spacing:1px}
.hero-num{font-size:42px;font-weight:700;color:#D4AF37;line-height:1;letter-spacing:.5px}
.hero-delta{font-size:12.5px;color:#2ED47A;background:rgba(46,212,122,.12);
  padding:3px 9px;border-radius:20px;margin-left:auto}
.hero-msg{font-size:14px;line-height:1.65;color:#D8CDB5;margin-top:13px;position:relative}
.hero-assets{display:flex;gap:6px;margin-top:14px;padding-top:13px;
  border-top:1px solid rgba(212,175,55,.16);position:relative}
.hero-asset{flex:1;text-align:center}
.hero-asset-n{font-size:15px;font-weight:700;letter-spacing:.3px}
.hero-asset-l{font-size:9.5px;color:#7A7568;margin-top:4px}

.p{display:flex;align-items:center;gap:13px;background:#111821;border:1px solid #23201A;
  border-radius:16px;padding:14px;margin-bottom:9px;cursor:pointer;transition:.15s}
.p:active{background:#161A20;transform:scale(.985)}
.p-ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:22px;flex-shrink:0}
.p-main{flex:1;min-width:0}
.p-name{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.p-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.p-sub{font-size:12.5px;color:#7A7568;margin-top:4px;line-height:1.4}
.p-arrow{color:#3A3628;font-size:20px;flex-shrink:0}

.ck{display:flex;align-items:center;gap:12px;background:#111821;
  border:1px solid #23201A;border-radius:15px;padding:13px;margin-bottom:8px;
  cursor:pointer;transition:.15s}
.ck:active{background:#161A20}
.ck-box{width:24px;height:24px;border-radius:8px;border:1.5px solid #2E2A22;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  color:transparent;flex-shrink:0;transition:.2s}
.ck.on .ck-box{background:#D4AF37;border-color:#D4AF37;color:#0A0E13}
.ck-t{font-size:14px;color:#D8CDB5;line-height:1.4;transition:.2s}
.ck.on .ck-t{color:#6B6758;text-decoration:line-through}
.ck-s{font-size:11px;color:#6B6758;margin-top:4px}
.ck-tag{font-size:9.5px;color:#D4AF37;background:rgba(212,175,55,.1);
  padding:2px 7px;border-radius:10px;margin-left:6px;font-weight:600}

.know{background:linear-gradient(135deg,#1C1810,#111821);border:1px solid #3A2E18;
  border-radius:16px;padding:15px 16px;cursor:pointer;transition:.15s}
.know:active{transform:scale(.985)}
.k-tag{font-size:10.5px;color:#D4AF37;letter-spacing:1.8px;font-weight:600;
  display:flex;align-items:center;gap:6px}
.k-tag::before{content:'';width:3px;height:10px;background:#D4AF37;border-radius:2px}
.k-txt{font-size:14px;line-height:1.75;color:#D8CDB5;margin-top:10px}
.k-src{font-size:10.5px;color:#6B6758;margin-top:10px;padding-top:9px;
  border-top:1px solid rgba(212,175,55,.14)}

.team-bar{display:flex;align-items:center;gap:12px;background:#111821;
  border:1px solid #23201A;border-radius:16px;padding:13px 15px;margin-top:14px;
  cursor:pointer;transition:.15s}
.team-bar:active{background:#161A20}
.team-avs{display:flex}
.team-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:600;border:2px solid #0A0E13;
  margin-left:-8px;flex-shrink:0}
.team-av:first-child{margin-left:0}
.team-txt{flex:1;font-size:13px;color:#A89C7E;line-height:1.4}
.team-txt b{color:#D8CDB5;font-weight:600;display:block;font-size:14px;margin-bottom:3px}

/* ---------- 改善页 ---------- */
.focus-hero{background:linear-gradient(135deg,#1C1810,#111821);border:1px solid #3A2E18;
  border-radius:20px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.focus-hero::before{content:'';position:absolute;top:-50px;right:-40px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.15),transparent 70%)}
.focus-label{font-size:11px;color:#D4AF37;letter-spacing:1.8px;font-weight:600}
.focus-t{font-size:21px;font-weight:600;line-height:1.4;margin-top:11px;
  color:#E8EEF5;position:relative}
.focus-d{font-size:13px;color:#A89C7E;line-height:1.65;margin-top:11px;position:relative}

.progress-wrap{display:flex;align-items:center;gap:16px}
.progress-num{font-size:42px;font-weight:700;color:#D4AF37;line-height:1;letter-spacing:1px}
.progress-num span{font-size:15px;color:#7A7568;font-weight:400;margin-left:4px}
.progress-info{flex:1}
.progress-bar{height:8px;background:#1A1E24;border-radius:5px;overflow:hidden;margin-bottom:9px}
.progress-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#D4AF37,#8A6E1A);
  transition:width .6s cubic-bezier(.2,.9,.3,1)}
.progress-lb{font-size:12px;color:#A89C7E;line-height:1.5}
.progress-lb b{color:#2ED47A;font-weight:600}

.action-card{background:#111821;border:1px solid #23201A;border-radius:16px;
  padding:16px;margin-bottom:10px}
.action-label{font-size:10.5px;color:#D4AF37;letter-spacing:1.5px;font-weight:600;margin-bottom:10px}
.action-row{display:flex;align-items:center;gap:12px;cursor:pointer}
.action-ck{width:30px;height:30px;border-radius:50%;border:2px solid #2E2A22;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  color:transparent;flex-shrink:0;transition:.25s}
.action-card.on .action-ck{background:#D4AF37;border-color:#D4AF37;color:#0A0E13;transform:scale(1.05)}
.action-t{font-size:16px;font-weight:600;color:#D8CDB5;line-height:1.4;transition:.2s}
.action-card.on .action-t{color:#6B6758;text-decoration:line-through}
.action-s{font-size:12px;color:#7A7568;margin-top:6px;line-height:1.55}

.stage-card{background:#111821;border:1px solid #23201A;border-radius:16px;
  padding:15px;margin-bottom:10px}
.stage-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #1B1F26;align-items:flex-start}
.stage-row:last-child{border-bottom:none;padding-bottom:0}
.stage-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.stage-t{font-size:14px;color:#D8CDB5;line-height:1.45;font-weight:500}
.stage-s{font-size:11.5px;color:#7A7568;margin-top:4px;line-height:1.5}

.helper{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #1B1F26}
.helper:last-child{border-bottom:none}
.helper-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:600;flex-shrink:0}
.helper-nm{font-size:14px;font-weight:600;color:#D8CDB5}
.helper-rl{font-size:11.5px;color:#7A7568;margin-top:4px}
.helper-go{margin-left:auto;font-size:12px;color:#D4AF37}

.course{background:#111821;border:1px solid #23201A;border-radius:16px;
  padding:15px;margin-bottom:10px;cursor:pointer;transition:.15s}
.course:active{background:#161A20}
.course-top{display:flex;gap:12px;margin-bottom:12px}
.course-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:22px;flex-shrink:0}
.course-nm{font-size:15.5px;font-weight:600;line-height:1.35;color:#D8CDB5}
.course-lt{font-size:11.5px;color:#8A8578;margin-top:6px;line-height:1.5}
.course-foot{display:flex;align-items:center;justify-content:space-between;
  padding-top:11px;border-top:1px solid #1B1F26}
.course-n{font-size:11px;color:#D4AF37}
.course-go{font-size:11.5px;color:#6B6758}

/* ---------- 知识页 ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 13px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex-shrink:0;padding:8px 15px;border-radius:20px;font-size:12.5px;color:#8A8578;
  background:#111821;border:1px solid #23201A;cursor:pointer;transition:.15s;user-select:none}
.f.on{background:#D4AF37;color:#0A0E13;border-color:#D4AF37;font-weight:600}

.art{background:#111821;border:1px solid #23201A;border-radius:15px;
  padding:14px;margin-bottom:9px;cursor:pointer;transition:.15s}
.art:active{background:#161A20}
.art-tag{font-size:10.5px;color:#D4AF37;letter-spacing:1px;font-weight:600}
.art-t{font-size:14px;font-weight:600;line-height:1.45;margin-top:7px;color:#D8CDB5}
.art-s{font-size:11px;color:#7A7568;margin-top:6px;line-height:1.5}

.book{display:flex;gap:12px;background:#111821;border:1px solid #23201A;
  border-radius:15px;padding:13px;margin-bottom:9px;cursor:pointer;transition:.15s}
.book:active{background:#161A20}

function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function renderOnb(){
  const el = document.getElementById('onb');
  el.classList.add('open');
  document.querySelector('.tabbar').style.display = 'none';
  document.querySelector('.ai-fab').style.display = 'none';

  const step = state.onbStep;
  renderProgress();

  if(step === -1){ renderWelcome(); }
  else if(step >=0 && step <=3){ renderQuiz(step); }
  else if(step === 4){ renderUpload(); }
  else if(step === 5){ renderGenerating(); }
  else if(step === 6){ renderResult(); }
}

function renderProgress(){
  const p = document.getElementById('onbProgress');
  if(state.onbStep === -1 || state.onbStep >= 5){
    p.innerHTML = '';
    return;
  }
  const total = 5;
  let cur = state.onbStep;
  let html = '';
  for(let i=0;i<total;i++){
    let cls = 'onb-dot';
    if(i < cur) cls += ' done';
    else if(i === cur) cls += ' cur';
    html += `<div class="${cls}"></div>`;
  }
  p.innerHTML = html;
}

function renderQuiz(step){
  const q = QUIZ[step];
  const a = state.quizAnswers;

  const fields = q.fields.map(f=>{
    if(f.type === 'input'){
      return `
        <div class="q-field">
          <div class="q-label">${f.label}${f.unit?`<em>单位：${f.unit}</em>`:''}</div>
          <input class="q-input" data-field="${f.k}" placeholder="${f.placeholder}"
            value="${a[f.k]||''}" type="text">
        </div>`;
    }
    const opts = f.opts.map(o=>{
      const on = a[f.k] === o ? 'on' : '';
      return `<div class="q-opt ${on}" data-field="${f.k}" data-val="${o}">
        <span>${o}</span><div class="q-opt-ck">✓</div>
      </div>`;
    }).join('');
    return `
      <div class="q-field">
        <div class="q-label">${f.label}</div>
        <div class="q-opts">${opts}</div>
      </div>`;
  }).join('');

  document.getElementById('onbBody').innerHTML = `
    <div class="q-head">
      <div class="q-step">${q.step}</div>
      <div class="q-title">${q.title}</div>
      <div class="q-sub">${q.sub}</div>
    </div>
    ${fields}
    <div style="height:20px"></div>
  `;

  const isLast = step === 3;

  `;
}

function renderAIBody(){
  const body = document.getElementById('aiBody');
  const msgs = aiMessages.map(m=>{
    if(m.role==='user'){
      return `<div class="msg user"><div class="bubble">${m.text}</div></div>`;
    }
    return `<div class="msg ai">
      <div class="ai-av">AI</div>
      <div class="bubble">
        <div>${m.text.replace(/\n/g,'<br>')}</div>
        ${m.src?`<div class="bubble-src">${m.src}</div>`:''}
        ${m.action?`<div class="bubble-action" data-action="${m.action}">${m.action} ›</div>`:''}
      </div>
    </div>`;
  }).join('');

  const typing = state.aiThinking
    ? `<div class="msg ai"><div class="ai-av">AI</div>
        <div class="bubble" style="padding:0"><div class="typing">
          <span></span><span></span><span></span></div></div></div>`
    : '';

  const qs = aiMessages.length <= 1
    ? `<div class="qs-wrap">${QUICK_QS.map(q=>`<div class="qs" data-q="${q}">${q}</div>`).join('')}</div>`
    : '';

  body.innerHTML = qs + msgs + typing;
  body.scrollTop = body.scrollHeight;
}

function sendMessage(text){
  if(!text.trim() || state.aiThinking) return;
  aiMessages.push({role:'user', text});
  state.aiThinking = true;
  renderAIBody();

  setTimeout(()=>{
    const qa = AI_QA[text];
    if(qa){
      aiMessages.push({role:'ai', text:qa.answer, src:qa.src, action:qa.action});
    }else{
      aiMessages.push({
        role:'ai',
        text:'这个问题我还在学习。你可以先看看学社的相关课程，或者换个问题试试。',
        src:'学社助手'
      });
    }
    state.aiThinking = false;
    renderAIBody();
  }, 800);
}

function openAI(){
  document.getElementById('aiOv').classList.add('open');
  renderAIBody();
  const inp = document.getElementById('aiInput');
  if(inp) setTimeout(()=>inp.focus(), 300);
}

/* ============================================================
   引导流程控制
   ============================================================ */
function onbNext(){
  const step = state.onbStep;

  // 校验
  if(step >=0 && step <=3){
    const q = QUIZ[step];
    const missing = q.fields.filter(f=>!state.quizAnswers[f.k]);
    if(missing.length){
      alert('请完成所有问题再继续');
      return;
    }
  }

  if(step === -1){ state.onbStep = 0; renderOnb(); return; }
  if(step >=0 && step < 3){ state.onbStep = step+1; renderOnb(); return; }
  if(step === 3){ state.onbStep = 4; renderOnb(); return; }
  if(step === 4){
    // 进入生成
    state.onbStep = 5;
    state.genStep = 0;
    renderOnb();
    // 模拟生成进度
    const timer = setInterval(()=>{
      state.genStep++;
      if(state.genStep >= 5){
        clearInterval(timer);
        state.onbStep = 6;
        renderOnb();
      } else {
        const steps = document.querySelectorAll('#genSteps .gen-step');
        if(steps[state.genStep]){
          steps[state.genStep].classList.add('on');
        }
      }
    }, 700);
    return;
  }
}

function onbBack(){
  if(state.onbStep > 0){ state.onbStep--; renderOnb(); }
}

function onbFinish(){
  state.phase = 'app';
  state.tab = 'home';
  renderApp();
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', e=>{
  /* ---- 引导流程 ---- */
  if(e.target.closest('[data-onb-next]')){ onbNext(); return; }
  if(e.target.closest('[data-onb-back]')){ onbBack(); return; }
  if(e.target.closest('[data-onb-skip]')){
    if(state.onbStep === 3){ state.onbStep = 4; renderOnb(); }
    else if(state.onbStep === 4){ state.onbStep = 5; renderOnb(); onbNext(); }
    return;
  }
  if(e.target.closest('[data-onb-finish]')){ onbFinish(); return; }
  if(e.target.closest('[data-onb-adjust]')){
    openSimple('调整策略', '告诉健康管家你的想法', `
      <div class="sh-tip">
        <div class="sh-tip-t">你想调整什么</div>
        <div class="sh-tip-b">可以直接告诉李婧：这件事太难 / 我想换一个方向 / 我有别的想法。她会和私人医生一起重新评估。</div>
      </div>
      <div class="sh-btn" data-close>联系健康管家</div>
    `, '🔄', '#D4AF37');
    return;
  }

  /* 问卷选项 */
  const opt = e.target.closest('.q-opt');
  if(opt){
    const k = opt.dataset.field;
    const v = opt.dataset.val;
    state.quizAnswers[k] = v;
    // 重新渲染当前步骤
    renderOnb();
    return;
  }

  /* 上传 */
  if(e.target.closest('[data-upload]')){
    state.uploaded = true;
    renderOnb();
    return;
  }

  /* ---- 主 App ---- */
  /* AI */
  if(e.target.closest('[data-ai-open]')){ openAI(); return; }
  if(e.target.closest('[data-ai-close]')){
    document.getElementById('aiOv').classList.remove('open'); return;
  }
  if(e.target.closest('[data-ai-send]')){
    const inp=document.getElementById('aiInput');
    if(inp){ sendMessage(inp.value); inp.value=''; }
    return;
  }
  const q = e.target.closest('[data-q]');
  if(q){ sendMessage(q.dataset.q); return; }
  const act = e.target.closest('[data-action]');
  if(act){
    const t = act.dataset.action.replace(/打开|「|」/g,'').split(' ')[0];
    const c = COURSES.find(x=>x.t.includes(t.split('·')[0].trim()));
    if(c){ openCourse(c.t); } else { openCourse('睡眠七讲'); }
    return;
  }

  /* Tab */
  const t = e.target.closest('[data-tab]');
  if(t){ state.tab = t.dataset.tab; renderApp(); return; }

  const go = e.target.closest('[data-tab-go]');
  if(go){ state.tab = go.dataset.tabGo; renderApp(); return; }

  /* 筛选 */
  const f = e.target.closest('[data-f]');
  if(f){ state.filter = f.dataset.f; renderApp(); return; }

  /* 今日打卡 */
  const tk = e.target.closest('[data-task]');
  if(tk){
    const id = tk.dataset.task;
    state.doneTasks.has(id) ? state.doneTasks.delete(id) : state.doneTasks.add(id);
    renderApp(); return;
  }

  /* 持续行动打卡 */
  const fc = e.target.closest('[data-focus]');
  if(fc){ state.focusDone = !state.focusDone; renderApp(); return; }

  /* 健康资产 */
  if(e.target.closest('[data-asset-open]')){ openAsset(); return; }

  /* 五大支柱 */
  const p = e.target.closest('[data-k]');
  if(p){ openPillar(p.dataset.k); return; }

  /* 今日知识 */
  if(e.target.closest('[data-know]')){ openKnow(); return; }

  /* 策略 */
  if(e.target.closest('[data-strategy]')){ openStrategy(); return; }

  /* 重新评估 */
  if(e.target.closest('[data-reevaluate]')){
    openSimple('重新评估', '每 12 周一次全面复盘', `
      <div class="sh-tip">
        <div class="sh-tip-t">重新评估会做什么</div>
        <div class="sh-tip-b">重新扫描五个维度，结合你最新的数据与意愿，判断是否需要更换主杠杆点。通常需要 3–5 分钟。</div>
      </div>
      <div class="sh-btn" data-close>现在开始</div>
      <div class="sh-btn ghost" data-close style="margin-top:10px">稍后再说</div>
    `, '🔄', '#D4AF37');
    return;
  }

  /* 补充上传 */
  if(e.target.closest('[data-upload-more]')){
    openSimple('补充上传', '体检报告或检查单', `
      <div class="sh-tip">
        <div class="sh-tip-t">支持格式</div>
        <div class="sh-tip-b">JPG / PNG / PDF。可以拍纸质报告，也可以直接上传电子版。识别后会更新到你的数据档案。</div>
      </div>
      <div class="sh-btn" data-close>选择文件</div>
    `, '📄', '#D4AF37');
    return;
  }

  /* 课程 / 文章 / 书 */
  const c = e.target.closest('[data-course]');
  if(c){ openCourse(c.dataset.course); return; }
  const a = e.target.closest('[data-art]');
  if(a){ openArticle(a.dataset.art); return; }
  const b = e.target.closest('[data-book]');
  if(b){ openBook(b.dataset.book); return; }

  /* 团队 */
  const tm = e.target.closest('[data-team]');
  if(tm){ openTeam(tm.dataset.team); return; }

  /* 关闭 */
  if(e.target.closest('[data-close]') || e.target.id==='modal'){
    document.getElementById('modal').classList.remove('open');
  }
});

/* 输入框 */
document.addEventListener('input', e=>{
  if(e.target.classList.contains('q-input')){
    state.quizAnswers[e.target.dataset.field] = e.target.value;
  }
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='aiInput' && e.key==='Enter'){
    sendMessage(e.target.value);
    e.target.value='';
  }
});

/* ============================================================
   启动
   ============================================================ */
renderOnb();
</script>
</body>
</html>
