<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>老板健康</title>
<style>
:root{
  --bg:#F7F9FC; --card:#FFFFFF; --line:#E8EEF5; --line2:#EEF2F7;
  --ink:#0F1B2D; --ink2:#5A6B80; --ink3:#94A3B5;
  --blue:#1E6FFF; --blue-bg:#EDF3FF;
  --good:#C8102E; --mid:#1E6FFF; --bad:#1A1A1A;
  --warn:#F5A623; --warn-bg:#FEF5E7;
  --red:#C8102E; --red-bg:#FDECEC;
  --gray-bg:#F2F5FA;
  --gold:#B8860B; --gold-bg:#FFF8E7;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{background:#E9EEF5;min-height:100vh;display:flex;align-items:center;
  justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  color:var(--ink);padding:24px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;
  border:1px solid #D5DEE8;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px rgba(15,27,45,.18),0 0 0 8px #fff,0 0 0 10px #D5DEE8;
  position:relative}
.statusbar{height:44px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;
  background:var(--bg);z-index:10}
.statusbar .r{font-size:12px;color:var(--ink2);font-weight:500}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 100px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}

.tabbar{position:absolute;bottom:0;left:0;right:0;height:78px;display:flex;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:16px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:10px;color:var(--ink3);cursor:pointer;font-weight:500;letter-spacing:.3px}
.tab svg{width:22px;height:22px;stroke:var(--ink3);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.18s}
.tab.active{color:var(--blue)}
.tab.active svg{stroke:var(--blue);stroke-width:1.9}

#viewbar{display:flex;justify-content:center;padding:2px 0 6px;flex-shrink:0;z-index:9}
.vb-seg{display:flex;background:#E4EAF2;border-radius:20px;padding:3px;gap:2px}
.vb-seg span{padding:5px 16px;font-size:11.5px;border-radius:16px;color:var(--ink2);
  font-weight:600;cursor:pointer;transition:.16s}
.vb-seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,27,45,.12)}

.hd{padding:8px 2px 20px}
.hd-date{font-size:12.5px;color:var(--ink3);letter-spacing:.5px}
.hd-title{font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-.3px;line-height:1.2}
.hd-row{display:flex;align-items:flex-start;justify-content:space-between}
.share-btn{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);
  background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:20px;
  font-weight:500;cursor:pointer;margin-top:8px}
.share-btn:active{background:#F2F5FA}

.sec{font-size:13px;font-weight:600;color:var(--ink2);margin:24px 2px 12px;
  display:flex;align-items:center;justify-content:space-between}
.sec .more{font-size:12px;color:var(--ink3);font-weight:400;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:12px}

.ranges{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.ranges::-webkit-scrollbar{display:none}
.range{flex-shrink:0;padding:7px 15px;border-radius:20px;background:#fff;
  border:1px solid var(--line);font-size:12.5px;color:var(--ink2);font-weight:500;
  cursor:pointer;transition:.15s;display:flex;align-items:center;gap:4px}
.range.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.range:active{transform:scale(.96)}
.range .rng-dates{font-size:10.5px;font-weight:500;opacity:.85}

.manual-panel{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:14px}
.mp-title{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:12px}
.mp-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.mp-field{flex:1;min-width:0}
.mp-label{font-size:10.5px;color:var(--ink3);margin-bottom:6px;display:block}
.mp-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  font-size:14px;font-family:inherit;font-weight:600;color:var(--ink);outline:none;background:#fff}
.mp-input:focus{border-color:var(--mid)}
.mp-quick{display:flex;gap:6px;flex-wrap:wrap}
.mp-quick .rec-opt{padding:7px 12px;font-size:12px}
.mp-summary{font-size:11.5px;background:var(--gold-bg);color:var(--gold);
  padding:8px 12px;border-radius:10px;font-weight:600;margin-top:10px}

.trendcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 14px;margin-bottom:14px}
.tc-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tc-lb{font-size:12px;color:var(--ink3);font-weight:500}
.tc-num{font-size:32px;font-weight:700;letter-spacing:-1.2px;line-height:1;margin-top:7px}
.tc-num small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:4px;letter-spacing:0}
.tc-delta{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap}
.tc-delta.up{background:#FFF8E7;color:var(--gold)}
.tc-delta.down{background:var(--gray-bg);color:var(--ink2)}
.trend{width:100%;height:110px;display:block;margin-top:6px}
.trend-x{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);
  margin-top:2px;padding:0 4px}
.mini-btn{padding:6px 12px;border-radius:20px;background:var(--gold-bg);color:var(--gold);
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}

.ai-card{display:flex;gap:12px;background:linear-gradient(135deg,#fff,#F5F9FF);
  border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.ai-avatar-wrap{width:48px;height:48px;flex-shrink:0;position:relative}
.ai-avatar{width:44px;height:44px;border-radius:16px;
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;
  font-weight:700;position:relative;overflow:hidden;
  box-shadow:0 8px 18px rgba(15,27,45,.18);transition:.2s}
.ai-avatar .ai-eye{position:absolute;top:14px;width:4px;height:4px;border-radius:50%;background:#fff}
.ai-avatar .ai-eye.l{left:12px}
.ai-avatar .ai-eye.r{right:12px}
.ai-avatar .ai-mouth{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  width:12px;height:6px;border-bottom:2px solid #fff;border-radius:0 0 8px 8px}
.ai-name{font-size:13px;font-weight:700;margin-bottom:6px}
.ai-name span{font-size:10.5px;color:var(--ink3);font-weight:400;margin-left:6px}
.ai-todo{display:flex;flex-direction:column;gap:7px}
.ai-todo-row{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;
  color:var(--ink2);line-height:1.5}
.ai-todo-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);
  flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#fff;transition:.15s;cursor:pointer}
.ai-todo-dot.done{background:var(--gold);border-color:var(--gold)}
.ai-todo-txt{flex:1;min-width:0}
.ai-todo-txt.done{color:var(--ink3);text-decoration:line-through}

.g9-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g9{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 11px;cursor:pointer;position:relative;transition:.15s}
.g9:active{transform:scale(.96);background:#FAFCFF}
.g9-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.g9-name{font-size:11.5px;color:var(--ink3);font-weight:500}
.g9-dot{width:5px;height:5px;border-radius:50%;background:#D5DEE8;flex-shrink:0;transition:.2s}
.g9-dot.full{background:var(--gold)}
.g9-dot.partial{background:var(--mid)}
.g9-main{display:flex;align-items:baseline;gap:6px}
.g9-grade{font-size:22px;font-weight:700;line-height:1;letter-spacing:-1px}
.g9-score{font-size:11px;color:var(--ink3);font-weight:500;margin-left:auto}
.g9-bar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:10px}
.g9-bar span{display:block;height:100%;border-radius:2px;transition:width .6s}

.life{background:linear-gradient(150deg,#0F1B2D,#1A2D47);border-radius:20px;
  padding:24px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.life::before{content:'';position:absolute;top:-60px;right:-50px;width:180px;height:180px;
  border-radius:50%;background:rgba(184,134,11,.18)}
.life-tag{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px;font-weight:600;position:relative}
.life-title{font-size:18px;font-weight:700;color:#fff;margin-top:12px;letter-spacing:-.2px;position:relative}
.life-rows{margin-top:20px;display:flex;flex-direction:column;gap:8px;position:relative}
.life-row{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-radius:13px;background:rgba(255,255,255,.05)}
.life-row.mine{background:rgba(184,134,11,.20);border:1px solid rgba(184,134,11,.45)}
.life-row-lb{font-size:12.5px;color:rgba(255,255,255,.6)}
.life-row.mine .life-row-lb{color:rgba(255,255,255,.9);font-weight:500}
.life-row-val{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.6px;
  display:flex;align-items:baseline;gap:3px}
.life-row-val small{font-size:12px;color:rgba(255,255,255,.5);font-weight:500}
.life-row.mine .life-row-val{color:#FFD27A}
.life-concl{margin-top:18px;padding:14px 16px;background:rgba(255,255,255,.05);
  border-radius:12px;font-size:13.5px;color:rgba(255,255,255,.9);line-height:1.7;position:relative}
.life-concl b{color:#FFD27A;font-weight:700}

.asset{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px;margin-bottom:14px}
.asset-rows{display:flex;flex-direction:column;gap:16px}
.asset-row{display:flex;align-items:center;gap:12px}
.asset-row-nm{font-size:15px;color:var(--ink);font-weight:700;width:24px;flex-shrink:0}
.asset-row-sub{font-size:11.5px;color:var(--ink3);width:60px;flex-shrink:0}
.asset-row-bar{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.asset-row-fill{height:100%;border-radius:3px;transition:width .6s}
.asset-row-val{font-size:15px;font-weight:700;width:32px;text-align:right;flex-shrink:0}

.goal-card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;position:relative;overflow:hidden;margin-bottom:14px}
.goal-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--gold)}
.goal-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.goal-tag{font-size:10.5px;color:var(--gold);background:var(--gold-bg);
  padding:4px 10px;border-radius:20px;font-weight:600;letter-spacing:.8px;display:inline-block}
.goal-more{font-size:11.5px;color:var(--ink3);cursor:pointer;white-space:nowrap;margin-top:2px}
.goal-title{font-size:20px;font-weight:700;margin-top:12px;letter-spacing:-.3px;line-height:1.4}
.goal-desc{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.6}

.action-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.action-item{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;display:flex;align-items:center;gap:12px;transition:.15s}
.action-item:active{background:#FAFCFF}
.action-ico{width:34px;height:34px;border-radius:10px;background:var(--gold-bg);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0}
.action-main{flex:1;min-width:0}
.action-t{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4}
.action-s{font-size:11px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:6px}
.action-src{background:var(--blue-bg);color:var(--mid);font-size:9.5px;padding:1px 5px;
  border-radius:4px;font-weight:600}
.action-btn{flex-shrink:0;font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;
  cursor:pointer;white-space:nowrap;border:none;font-family:inherit;transition:.15s}
.action-btn.join{color:var(--gold);background:var(--gold-bg)}
.action-btn.check{color:var(--mid);background:var(--blue-bg)}
.action-btn.done{color:var(--ink3);background:var(--gray-bg);cursor:default}

.result-card{background:linear-gradient(150deg,#0F1B2D,#1A2D47);border-radius:18px;
  padding:20px;color:#fff;position:relative;overflow:hidden}
.result-card::before{content:'';position:absolute;top:-50px;right:-40px;width:140px;height:140px;
  border-radius:50%;background:rgba(184,134,11,.16)}
.result-hd{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px;font-weight:600;
  position:relative;margin-bottom:14px}
.result-num{font-size:36px;font-weight:700;letter-spacing:-1.2px;line-height:1;position:relative}
.result-num small{font-size:13px;color:rgba(255,255,255,.55);font-weight:500;margin-left:5px}
.result-lb{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:10px;position:relative}
.result-bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:16px;position:relative}
.result-bar-fill{height:100%;border-radius:4px;background:#FFD27A;transition:width .6s}
.result-foot{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.55);
  margin-top:10px;position:relative}
.result-chg{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);
  display:flex;justify-content:space-between;font-size:12.5px;position:relative}
.result-chg-lb{color:rgba(255,255,255,.6)}
.result-chg-val{font-weight:700;color:#FFD27A}

.detail-block{margin-bottom:20px}
.detail-block:last-child{margin-bottom:0}
.detail-t{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:10px}
.detail-p{font-size:13.5px;color:var(--ink2);line-height:1.7}
.detail-list{display:flex;flex-direction:column;gap:8px}
.detail-li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink2);line-height:1.6}
.detail-li .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);margin-top:7px;flex-shrink:0}
.week-days{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.week-day{width:30px;height:30px;border-radius:8px;background:var(--gray-bg);
  font-size:11px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
.week-day.on{background:var(--gold);color:#fff;font-weight:600}
.week-day.today{border:1.5px solid var(--gold);color:var(--gold);font-weight:700}

.mgr-group{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:6px 18px;margin-bottom:14px}
.mgr-row{display:flex;align-items:center;gap:14px;padding:15px 0;
  border-bottom:1px solid var(--line2);cursor:pointer}
.mgr-row:last-child{border-bottom:none}
.mgr-row-ico{width:34px;height:34px;border-radius:10px;background:var(--gray-bg);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);
  flex-shrink:0;font-weight:600}
.mgr-row-main{flex:1;min-width:0}
.mgr-row-t{font-size:14px;color:var(--ink);font-weight:500}
.mgr-row-s{font-size:11.5px;color:var(--ink3);margin-top:3px}
.mgr-row-val{font-size:12px;font-weight:600;color:var(--gold)}

.streak{background:linear-gradient(135deg,#B8860B,#7A5A00);border-radius:18px;
  padding:24px;color:#fff;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.streak::before{content:'';position:absolute;top:-60px;right:-40px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.08)}
.streak-num{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1.5px;position:relative}
.streak-num small{font-size:15px;font-weight:500;color:rgba(255,255,255,.75);margin-left:4px}
.streak-lb{font-size:13px;color:rgba(255,255,255,.85);margin-top:10px;position:relative}

.modal{position:fixed;inset:0;background:rgba(15,27,45,.45);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:99;
  overscroll-behavior:contain}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;overflow-x:hidden;
  background:#fff;border-radius:26px 26px 0 0;padding:24px 22px 40px;
  position:relative;animation:up .3s cubic-bezier(.2,.9,.3,1);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sh-head{margin-bottom:20px}
.sh-title-row{display:flex;align-items:flex-start;justify-content:space-between}
.sh-name{font-size:19px;font-weight:600}
.sh-date{font-size:12.5px;color:var(--ink3);margin-top:6px;letter-spacing:.3px}
.sh-x{width:30px;height:30px;border-radius:50%;background:#F2F5FA;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
  flex-shrink:0}
.sh-btn{margin-top:20px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;
  text-align:center;padding:15px;border-radius:14px;cursor:pointer}
.sh-btn.disabled{background:#E8EEF5;color:var(--ink3);cursor:not-allowed}
.sh-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500}

.sh-range{display:inline-flex;align-items:center;gap:6px;background:var(--gold-bg);
  color:var(--gold);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;
  margin-bottom:16px}
.sh-range .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

.voice-bar{position:sticky;bottom:-1px;margin-top:22px;background:#fff;
  border-top:1px solid var(--line);padding:14px 0 6px;
  display:flex;align-items:center;gap:12px;z-index:5}
.voice-btn{flex:1;background:linear-gradient(135deg,#1E6FFF,#0D4FD6);color:#fff;
  border-radius:14px;padding:14px;text-align:center;font-size:14.5px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
  border:none;font-family:inherit}
.voice-btn:active{transform:scale(.98)}
.voice-icon{width:20px;height:20px;flex-shrink:0}
.voice-hint{font-size:11px;color:var(--ink3);flex-shrink:0}

.obj-block{background:var(--gray-bg);border-radius:12px;padding:16px;margin-bottom:22px}
.obj-label{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:12px}
.obj-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0}
.obj-row:first-of-type{padding-top:0}
.obj-row:last-child{padding-bottom:0}
.obj-nm{font-size:13.5px;color:var(--ink2)}
.obj-val{font-size:16px;font-weight:700;letter-spacing:-.3px}
.obj-val span{font-size:11px;color:var(--ink3);font-weight:500;margin-left:2px}
.obj-input{width:80px;text-align:right;padding:6px 10px;border:1.5px solid var(--line);
  border-radius:8px;font-size:14px;font-family:inherit;font-weight:700;color:var(--ink);
  outline:none;background:#fff}
.obj-input:focus{border-color:var(--mid)}

.subj-label{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:1.2px;margin-bottom:14px}
.rec-item{margin-bottom:20px}
.rec-item:last-child{margin-bottom:0}
.rec-label{font-size:14px;color:var(--ink);font-weight:500;margin-bottom:12px;
  display:flex;align-items:center;justify-content:space-between}

.parsed-block{background:#F8FAFD;border:1px solid var(--line);border-radius:14px;

.parsed-title::before{content:'AI';background:var(--blue-bg);color:var(--mid);

.struct-item{margin-bottom:16px}

.struct-label{font-size:13px;color:var(--ink);font-weight:500;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between}

.compare{margin-top:22px;padding-top:18px;border-top:1px solid var(--line2)}

.cmp-fill.high{background:var(--good)}
.cmp-fill.low{background:var(--bad)}

.voice-overlay{position:fixed;inset:0;background:rgba(15,27,45,.7);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:40px}

  width:100%;max-width:340px}

.voice-wave span{width:4px;background:var(--mid);border-radius:2px;animation:wave 1s ease-in-out infinite}
.voice-wave span:nth-child(1){animation-delay:0s;height:20px}
.voice-wave span:nth-child(2){animation-delay:.1s;height:36px}
.voice-wave span:nth-child(3){animation-delay:.2s;height:48px}
.voice-wave span:nth-child(4){animation-delay:.3s;height:36px}
.voice-wave span:nth-child(5){animation-delay:.4s;height:20px}
@keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.6)}}
.voice-status{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:10px}

function gradeOf(s){

function dimScores(range){

  const o = {};

function trendSvg(values, labels, color){
  const w=320, h=110, padL=10, padR=10, padT=14, padB=14;
  let min=Math.min.apply(null,values), max=Math.max.apply(null,values);
  const raw = (max-min)||1;
  min -= raw*0.3; max += raw*0.3;
  const rng = (max-min)||1;
  const iw = w-padL-padR, ih = h-padT-padB;
  const pts = values.map((v,i)=>{
    const x = padL + (values.length===1 ? iw/2 : iw*i/(values.length-1));
    const y = padT + ih*(1-(v-min)/rng);
    return [x,y];
  });
  const line = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = 'M '+pts[0][0].toFixed(1)+','+(h-padB)+' L '+
               pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ')+
               ' L '+pts[pts.length-1][0].toFixed(1)+','+(h-padB)+' Z';
  const gid = 'tg'+Math.random().toString(36).slice(2,8);
  const grids = [0,0.5,1].map(t=>{
    const y = padT + ih*t;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}"
      stroke="#EEF2F7" stroke-width="1" stroke-dasharray="3 4"/>`;
  }).join('');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"
      fill="#fff" stroke="${color}" stroke-width="1.6"/>`).join('');
  const last = pts[pts.length-1];
  return `<svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grids}
    <path d="${area}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${color}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="7"
      fill="${color}" opacity=".16"/>
  </svg>`;
}
function xLabels(xs){
  if(xs.length<=7) return xs.map(l=>`<span>${l}</span>`).join('');
  const mid = xs[Math.floor(xs.length/2)];
  return `<span>${xs[0]}</span><span>${mid}</span><span>${xs[xs.length-1]}</span>`;
}
function dimState(d){
  /* 有自由文本记录视为已补充 */
  if((state.freeText[d.k]||[]).length > 0) return 'full';
  const hasObj = d.obj && d.obj.length > 0;

    const sym = state.records.symptom || [];
    const real = sym.filter(x=>x!=='没有');
    if(real.length === 0) return hasObj?'partial':'none';
    const allDone = real.every(s=>{
      const fu = SYMPTOM_FOLLOWUP[s];
      if(!fu) return true;
      return fu.every(f=>state.bodyFollowups[s] && state.bodyFollowups[s][f.q]);
    });
    return allDone?'full':'partial';
  }

    const sym = state.records.breath_symptom || [];
    const real = sym.filter(x=>x!=='没有');
    const breathDone = state.records.breath_practice;
    if(real.length === 0 && breathDone) return 'full';
    if(real.length === 0) return hasObj?'partial':'none';
    const allDone = real.every(s=>{

      if(!fu) return true;
      return fu.every(f=>state.breathFollowups[s] && state.breathFollowups[s][f.q]);
    });
    return (allDone && breathDone) ? 'full' : 'partial';
  }
  if(d.type === 'env'){
    const exps = state.records.env_exposure || [];
    const real = exps.filter(x=>x!=='没有');
    const naturalDone = state.records.natural_light && state.records.natural_time;
    if(real.length === 0 && naturalDone) return 'full';
    if(real.length === 0) return hasObj?'partial':'none';
    const allDone = real.every(e=>{

      return fu.every(f=>state.envFollowups[e] && state.envFollowups[e][f.q]);

  }
  const hasSubj = d.subj && d.subj.length > 0;
  if(!hasSubj) return hasObj?'partial':'none';
  const filled = d.subj.filter(r=>{
    const v = state.records[r.k];
    if(r.multi) return Array.isArray(v) && v.length > 0;
    return v !== undefined && v !== '';
  }).length;
  if(filled === 0) return hasObj?'partial':'none';
  if(filled < d.subj.length) return 'partial';
  return 'full';
}

  const m = state.manual[key];
  return `<div class="manual-panel">

  </div>`;
}
function manualDays(m){
  const s = new Date(m.start), e = new Date(m.end);
  const d = Math.round((e - s) / 86400000) + 1;
  return isNaN(d) || d < 1 ? 0 : d;
}
function manualTrendData(key){
  const m = state.manual[key];
  const labels = ['起','','','','止'];
  const start = 8000, end = 8620;
  const arr = labels.map((_,i)=> Math.round(start + (end-start) * (i/(labels.length-1))));
  return {title:'所选区间', x:labels, v:arr};
}

/* 简单结构化：从文本里提取数字/关键词，生成预览 */
function parseNlText(k, text){
  const out = [];
  if(!text) return out;
  const t = text.trim();
  if(k === 'move'){
    const m = t.match(/(\d{3,6})\s*步/);
    if(m) out.push({k:'步数', v:m[1]+' 步'});
    const min = t.match(/(\d{1,3})\s*分钟/);
    if(min) out.push({k:'运动时长', v:min[1]+' 分钟'});
    if(/力量训练|深蹲|俯卧撑|举铁/.test(t)) out.push({k:'力量训练', v:'有'});
    if(/坐|久坐/.test(t)) out.push({k:'久坐', v:'提到'});
  } else if(k === 'body'){
    const w = t.match(/(\d{2,3}(\.\d)?)\s*(kg|公斤|斤)/);
    if(w) out.push({k:'体重', v:w[1]+' kg'});
    const bp = t.match(/(\d{2,3})\s*\/\s*(\d{2,3})/);
    if(bp) out.push({k:'血压', v:bp[1]+'/'+bp[2]});
    ['颈肩','便干','便秘','头晕','疲劳','心慌'].forEach(s=>{
      if(t.includes(s)) out.push({k:'症状', v:s});
    });
  } else if(k === 'stress'){
    const meet = t.match(/(\d{1,2})\s*个?会/);
    if(meet) out.push({k:'会议', v:meet[1]+' 个'});
    if(/加班|十点|十一点|很晚/.test(t)) out.push({k:'工作状态', v:'偏晚/加班'});
    if(/客户|谈判|签约/.test(t)) out.push({k:'工作事件', v:'有'});
    if(/烦|紧|焦虑|压力/.test(t)) out.push({k:'情绪', v:'偏紧'});
  } else if(k === 'diet'){
    const water = t.match(/(\d+(\.\d)?)\s*(L|升|杯)/);
    if(water) out.push({k:'饮水', v:water[1]+' '+water[3]});
    if(/酒|红酒|白酒|啤酒/.test(t)) out.push({k:'饮酒', v:'有'});
    if(/维生素|鱼油|钙片|益生菌/.test(t)) out.push({k:'补剂', v:'有'});
    if(/外卖|烧烤|油炸/.test(t)) out.push({k:'饮食风险', v:'有'});
  } else if(k === 'sleep'){
    const h = t.match(/(\d{1,2})\s*点.*?(\d{1,2})\s*点/);
    if(h) out.push({k:'睡眠时段', v:h[1]+'点-'+h[2]+'点'});
    const wake = t.match(/醒[了]?(\d{1,2})\s*次/);
    if(wake) out.push({k:'夜醒', v:wake[1]+' 次'});
    if(/午睡|午觉/.test(t)) out.push({k:'午睡', v:'有'});
  } else if(k === 'breath'){
    ['胸闷','气短','打鼾','咳嗽','咳痰','呼吸练习'].forEach(s=>{
      if(t.includes(s)) out.push({k:'呼吸', v:s});
    });
  } else if(k === 'env'){
    if(/户外|外面|阳光/.test(t)) out.push({k:'户外', v:'有'});
    if(/二手烟|烟味/.test(t)) out.push({k:'二手烟', v:'有'});
    if(/空气|雾霾|甲醛|装修/.test(t)) out.push({k:'空气', v:'有提及'});
  } else if(k === 'cognition'){
    if(/读书|看了|学习|课程/.test(t)) out.push({k:'学习', v:'有'});
    if(/专注|分心/.test(t)) out.push({k:'专注', v:'提到'});
    if(/聚会|聊天|社交/.test(t)) out.push({k:'社交', v:'有'});
  } else if(k === 'event'){
    if(/谈判|签约|客户|会议/.test(t)) out.push({k:'工作大事', v:'有'});
    if(/家里|孩子|父母|家庭/.test(t)) out.push({k:'家庭大事', v:'有'});
    if(/体检|医院|看病/.test(t)) out.push({k:'健康大事', v:'有'});
    if(/股票|投资|钱|财务/.test(t)) out.push({k:'财务大事', v:'有'});
    out.push({k:'影响', v:/好|成|顺利/.test(t)?'正面':(/差|失败|糟/.test(t)?'负面':'中性')});
  }
  return out;
}

function openDimRecord(k, range){
  const d = DIMS.find(x=>x.k===k);
  if(!d) return;
  if(d.type === 'diet'){ openDiet(); return; }

  if(d.type === 'breath'){ renderBreathSheet(range); return; }

    const rows = d.obj.map(o=>{
      if(o.input === 'weight'){
        return `<div class="obj-row"><span class="obj-nm">${o.nm}</span>
          <input class="obj-input" type="number" step="0.1" value="${state.weight}" data-weight-input></div>`;
      }

        return `<div class="obj-row"><span class="obj-nm">${o.nm}</span>
          <span class="obj-val">${calcBMI(state.weight)}</span></div>`;
      }
      return `<div class="obj-row"><span class="obj-nm">${o.nm}</span>
        <span class="obj-val">${o.val}<span>${o.unit}</span></span></div>`;
    }).join('');
    body += `<div class="obj-block"><div class="obj-label">客观数据</div>${rows}</div>`;
  }
  if(d.subj && d.subj.length > 0){
    const items = d.subj.map(r=>{
      const cur = state.records[r.k];
      const opts = r.opts.map(o=>{
        let sel = r.multi ? (Array.isArray(cur) && cur.includes(o)) : cur === o;
        return `<div class="rec-opt ${sel?'on':''}" data-rec="${r.k}" data-val="${o}"
          data-multi="${r.multi?'1':''}">${o}</div>`;

        ? `<input class="rec-note" placeholder="简单备注（选填）"

function computeDietSummary(){
  if(state.dietParsed && state.dietParsed.summary){
    const sum = {...state.dietParsed.summary};
    applyDietStruct(sum);
    return sum;
  }
  const sum = {staple:0, protein:0, veg:0, fruit:0, oil:0, salt:0, sugar:0, alcohol:0};
  const mapVal = (v)=>{
    if(v==='0' || v==='没吃') return 0;
    if(v==='半碗') return 0.5;
    if(v==='1碗' || v==='1份' || v==='1拳') return 1;
    if(v==='2碗' || v==='2份' || v==='2拳') return 2;
    if(v==='3碗+' || v==='3份+' || v==='3拳+') return 3;
    if(v==='少量') return 0.5;
    if(v==='2份+') return 2;
    return 0;
  };
  ['b','l','d','s'].forEach(mk=>{
    const m = state.dietQuick[mk] || {};
    sum.staple += mapVal(m.staple);
    sum.protein += mapVal(m.protein);
    sum.veg += mapVal(m.veg);
    sum.fruit += mapVal(m.fruit);
    sum.sugar += mapVal(m.dessert) * 8;
    sum.oil += mapVal(m.bbq) * 10 + mapVal(m.fried) * 12 + mapVal(m.snack) * 5;
    sum.salt += (mapVal(m.bbq) + mapVal(m.fried)) * 1.5;
  });
  applyDietStruct(sum);
  return sum;
}
function applyDietStruct(sum){
  if(state.dietStruct.alcohol_extra === '少量') sum.alcohol = Math.max(sum.alcohol || 0, 0.5);
  if(state.dietStruct.alcohol_extra === '中等') sum.alcohol = Math.max(sum.alcohol || 0, 1.5);
  if(state.dietStruct.alcohol_extra === '较多') sum.alcohol = Math.max(sum.alcohol || 0, 3);
  if(state.dietStruct.alcohol_extra === '没喝') sum.alcohol = 0;
  if(state.dietStruct.taste === '偏油') sum.oil = Math.max(sum.oil || 0, 40);
  if(state.dietStruct.taste === '偏咸') sum.salt = Math.max(sum.salt || 0, 9);
  if(state.dietStruct.late_night === '有') sum.staple = (sum.staple || 0) + 1;
}
function renderCompare(sum){
  const compareRows = Object.keys(NUTRITION_STD).map(k=>{
    const std = NUTRITION_STD[k];
    const v = sum[k] || 0;
    const scale = std.max * 1.5 || 1;
    const pct = Math.min(100, v / scale * 100);
    const rangeStart = std.min / scale * 100;
    const rangeWidth = (std.max - std.min) / scale * 100;
    let status, cls;
    if(k === 'alcohol'){
      if(v === 0){ status = '正常'; cls = 'normal'; }
      else { status = '偏多'; cls = 'high'; }
    } else {
      if(v < std.min){ status = '偏少'; cls = 'low'; }
      else if(v > std.max){ status = '偏多'; cls = 'high'; }
      else { status = '正常'; cls = 'normal'; }
    }
    const rangeStyle = std.max > std.min
      ? `<div class="cmp-range" style="left:${rangeStart}%;width:${rangeWidth}%"></div>` : '';
    const stdTxt = std.max > std.min
      ? ` · 建议 ${std.min}-${std.max}${std.unit}`
      : (std.max > 0 ? ` · 建议 <${std.max}${std.unit}` : '');
    return `<div class="cmp-row">
      <div class="cmp-top">
        <span class="cmp-nm">${std.label}</span>
        <span class="cmp-v ${cls}">${v}${std.unit} · ${status}${stdTxt}</span>
      </div>
      <div class="cmp-bar">${rangeStyle}
        <div class="cmp-fill ${cls}" data-w="${pct}" style="width:0"></div>
      </div>
    </div>`;
  }).join('');
  const issues = [];
  if((sum.veg||0) < NUTRITION_STD.veg.min) issues.push('蔬菜偏少');
  if((sum.oil||0) > NUTRITION_STD.oil.max) issues.push('油偏多');
  if((sum.salt||0) > NUTRITION_STD.salt.max) issues.push('盐偏多');
  if((sum.alcohol||0) > 0) issues.push('有饮酒');
  if((sum.fruit||0) < NUTRITION_STD.fruit.min) issues.push('水果偏少');
  const summaryText = issues.length > 0 ? `今天主要问题：${issues.join('、')}` : '今天结构均衡，继续保持';
  const hasData = Object.keys(sum).some(k=>sum[k] > 0);
  if(!hasData) return '';
  return `<div class="compare">
    <div class="compare-t">营养结构对比</div>
    ${compareRows}
    <div style="margin-top:20px;padding:14px 16px;background:#FDECEC;border-radius:12px;
      font-size:13px;color:#C8102E;font-weight:500;line-height:1.6">${summaryText}</div>
  </div>`;
}

function openQuiz(){ state.quizIndex=0; state.quizAns={}; renderQuiz(); }
function renderQuiz(){
  const q = QUIZ[state.quizIndex];
  if(!q){ closeModal(); return; }
  const cur = state.quizAns[q.k];
  let opts = '';
  if(q.type==='input'){
    opts = `<input class="qz-input" id="qzInput" placeholder="${q.ph}" value="${cur||''}"
      maxlength="4" inputmode="numeric">`;
  } else if(q.type==='single'){
    opts = `<div class="qz-opts">${q.opts.map((o,i)=>
      `<div class="qz-opt ${cur===i+1?'on':''}" data-qz-single="${q.k}" data-val="${i+1}">${o}</div>`
    ).join('')}</div>`;
  } else if(q.type==='multi'){
    const arr = cur||[];
    opts = `<div class="qz-opts">${q.opts.map(o=>
      `<div class="qz-opt ${arr.includes(o)?'on':''}" data-qz-multi="${q.k}"
        data-val="${o}" data-excl="${q.excl||''}">${o}</div>`
    ).join('')}</div>`;
  }
  const canNext = state.quizAns[q.k]!==undefined;
  const isLast = state.quizIndex===QUIZ.length-1;
  document.getElementById('sheet').innerHTML = `
    <div class="sh-head">
      <div class="sh-title-row">
        <div style="flex:1;min-width:0">
          <div class="sh-name">微体检</div>
          <div class="sh-date">${TODAY} · ${state.quizIndex+1}/${QUIZ.length}</div>
        </div>
        <div class="sh-x" data-close>✕</div>
      </div>
    </div>
    <div class="qz-q">${q.q}</div>
    ${opts}
    <div style="display:flex;gap:10px;margin-top:22px">
      ${state.quizIndex>0?'<div class="sh-btn ghost" data-qz-prev style="flex:1;margin:0">上一题</div>':''}
      <div class="sh-btn ${canNext?'':'disabled'}" data-qz-next style="flex:2;margin:0">${isLast?'完成':'下一题'}</div>
    </div>`;
  document.getElementById('modal').classList.add('open');
  document.getElementById('sheet').scrollTop = 0;
  if(q.type==='input'){
    const inp = document.getElementById('qzInput');
    const btn = document.querySelector('[data-qz-next]');
    inp.addEventListener('input', e=>{
      const y = parseInt(e.target.value,10);
      if(y && y>=1920 && y<=2010){ state.quizAns[q.k]=y; btn.classList.remove('disabled'); }
      else { delete state.quizAns[q.k]; btn.classList.add('disabled'); }
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !btn.classList.contains('disabled')) btn.click();
    });
    setTimeout(()=>inp.focus(), 300);
  }
}

/* ============ 事件 ============ */
document.addEventListener('click', e=>{
  /* 引导 */
  if(e.target.closest('[data-ob-login]') || e.target.closest('[data-ob-phone]')){
    state.ob.step = 1; renderOnboard(); return;
  }
  const obSet = e.target.closest('[data-ob-set]');
  if(obSet){ state.ob[obSet.dataset.obSet] = obSet.dataset.val; renderOnboard(); return; }
  const obMulti = e.target.closest('[data-ob-multi]');
  if(obMulti){
    const key = obMulti.dataset.obMulti, v = obMulti.dataset.val;
    const arr = state.ob[key] || [];
    if(v === '没有'){ state.ob[key] = arr.includes('没有') ? [] : ['没有']; }
    else {
      const filtered = arr.filter(x=>x!=='没有');
      state.ob[key] = filtered.includes(v) ? filtered.filter(x=>x!==v) : [...filtered, v];
    }
    renderOnboard(); return;
  }
  if(e.target.closest('[data-ob-next]')){ state.ob.step = Math.min(3, state.ob.step + 1); renderOnboard(); return; }
  if(e.target.closest('[data-ob-done]')){
    state.onboarded = true;
    state.weight = parseFloat(state.ob.weight) || 78.4;
    state.profile.height = parseFloat(state.ob.height) || 178;
    state.profile.weight = state.weight;
    render(); return;
  }

  /* 视角 */
  const vw = e.target.closest('[data-view]');
  if(vw){ state.view = vw.dataset.view; state.adminUser = null; render(); return; }
  if(e.target.closest('[data-admin-back]')){ state.adminUser = null; render(); return; }
  const rankUser = e.target.closest('[data-rank-user]');
  if(rankUser){ state.adminUser = rankUser.dataset.rankUser; render(); return; }

  /* Tab */
  const t = e.target.closest('[data-tab]');
  if(t){ state.tab = t.dataset.tab; render(); return; }

  /* 时间范围 */
  const rg = e.target.closest('[data-range]');
  if(rg){ state.range[rg.dataset.rtab] = rg.dataset.range; render(); return; }

  /* 手动日期预设 */
  const mp = e.target.closest('[data-manual-preset]');
  if(mp){
    const key = mp.dataset.manualPreset;
    state.manual[key].start = mp.dataset.start;
    state.manual[key].end = mp.dataset.end;
    render(); return;
  }

  /* 维度 */
  const dim = e.target.closest('[data-dim]');
  if(dim){ openDimRecord(dim.dataset.dim, dim.dataset.dimRange); return; }

  /* 自然语言保存 */
  const nlSave = e.target.closest('[data-nl-save]');
  if(nlSave){
    const k = nlSave.dataset.nlSave;
    const ta = document.getElementById('nlText');
    const text = (ta && ta.value || '').trim();
    if(!text){ toast('先写点什么'); return; }
    state.records['nl_'+k] = text;
    if(!state.freeText[k]) state.freeText[k] = [];
    state.freeText[k].unshift(text);
    renderNlParsed(k);
    toast('已记下');
    return;
  }

  /* 今日待办 */
  const todo = e.target.closest('[data-todo-toggle]');
  if(todo){
    const id = todo.dataset.todoToggle;
    const item = state.todos.find(x=>x.id===id);
    if(item){
      item.done = !item.done;
      if(item.link && state.practiceState[item.link]){
        const ps = state.practiceState[item.link];
        if(ps.joined){
          ps.checkedToday = item.done;
          if(item.done) ps.streak += 1;
          else ps.streak = Math.max(0, ps.streak - 1);
          ps.week[0] = item.done ? 1 : 0;
        }
      }
      render();
    }
    return;
  }

  /* 改变：目标详情 */
  if(e.target.closest('[data-goal-detail]')){ openGoalDetail(); return; }

  /* 改变：加入 / 打卡 / 退出 */
  const pj = e.target.closest('[data-practice-join]');
  if(pj){
    const id = pj.dataset.practiceJoin;
    const ps = state.practiceState[id];
    if(ps){
      ps.joined = true; ps.checkedToday = false; ps.streak = 0; ps.week = [0,0,0,0,0,0,0];
      const p = MAIN_GOAL.practices.find(x=>x.id===id);
      if(p && !state.todos.some(x=>x.link===id)){
        state.todos.push({id:'t_'+id, txt:p.t, done:false, link:id});
      }
      render(); toast('已加入，明天开始打卡');
    }
    return;
  }
  const pc = e.target.closest('[data-practice-check]');
  if(pc){
    const id = pc.dataset.practiceCheck;
    const ps = state.practiceState[id];
    if(ps && ps.joined){
      ps.checkedToday = !ps.checkedToday;
      if(ps.checkedToday){ ps.streak += 1; ps.week[0] = 1; }
      else { ps.streak = Math.max(0, ps.streak - 1); ps.week[0] = 0; }
      const todoItem = state.todos.find(x=>x.link===id);
      if(todoItem) todoItem.done = ps.checkedToday;
      render();
    }
    return;
  }
  const pq = e.target.closest('[data-practice-quit]');
  if(pq){
    const id = pq.dataset.practiceQuit;
    const ps = state.practiceState[id];
    if(ps){
      ps.joined = false; ps.checkedToday = false; ps.streak = 0; ps.week = [0,0,0,0,0,0,0];
      state.todos = state.todos.filter(x=>x.link!==id);
      render(); toast('已退出');
    }
    return;
  }

  /* 转发 / 家庭 */
  if(e.target.closest('[data-share]')){ openShare(); return; }
  const st2 = e.target.closest('[data-share-to]');
  if(st2){
    const to = st2.dataset.shareTo;
    closeModal();
    setTimeout(()=>toast(to==='image'?'已保存到相册':'已发送'), 120);
    return;
  }
  if(e.target.closest('[data-family]')){ openFamily(); return; }
  if(e.target.closest('[data-family-invite]')){
    closeModal(); setTimeout(()=>toast('邀请链接已复制'), 120); return;
  }

  /* 手动记录 */
  if(e.target.closest('[data-add-record]')){ openAddRecord(); return; }
  const mrt = e.target.closest('[data-mrtype]');
  if(mrt){ state.mrType = mrt.dataset.mrtype; openAddRecord(); return; }
  if(e.target.id === 'mrSave'){
    const vEl = document.getElementById('mrVal');
    const nEl = document.getElementById('mrNote');
    const v = (vEl && vEl.value || '').trim();
    if(!v){ toast('请填写数值'); return; }
    const note = (nEl && nEl.value || '').trim();
    const d = new Date();
    const pad = n=>String(n).padStart(2,'0');
    state.manualRecords.unshift({
      t:`${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,
      n:state.mrType, v, u:MR_UNITS[state.mrType]||'', note
    });
    closeModal(); render(); toast('已记录');
    return;
  }

  /* 语音 */
  const vb = e.target.closest('[data-voice]');
  if(vb){ openVoice(vb.dataset.voice); return; }
  if(e.target.closest('[data-voice-cancel]')){ closeVoice(); return; }
  if(e.target.closest('[data-voice-done]')){ applyVoice(); return; }

  /* 饮食 */
  const dm = e.target.closest('[data-diet-mode]');
  if(dm){ state.dietMode = dm.dataset.dietMode; openDiet(); return; }
  const qm = e.target.closest('[data-quick-meal]');
  if(qm){
    const mk = qm.dataset.quickMeal, ck = qm.dataset.quickCat, v = qm.dataset.quickVal;
    if(!state.dietQuick[mk]) state.dietQuick[mk] = {};
    state.dietQuick[mk][ck] = state.dietQuick[mk][ck] === v ? '' : v;
    openDiet(); return;
  }
  const st = e.target.closest('[data-struct]');
  if(st){ state.dietStruct[st.dataset.struct] = st.dataset.val; openDiet(); return; }

  /* 身体 */
  const sym = e.target.closest('[data-sym]');
  if(sym){
    const v = sym.dataset.sym;
    let arr = state.records.symptom || [];
    if(v === '没有'){ arr = arr.includes('没有') ? [] : ['没有']; }
    else {
      if(arr.includes('没有')) arr = arr.filter(x=>x!=='没有');
      if(arr.includes(v)){ arr = arr.filter(x=>x!==v); delete state.bodyFollowups[v]; }
      else { arr.push(v); }
    }
    state.records.symptom = arr;
    renderBodySheet(state.range.see); return;
  }
  const fu = e.target.closest('[data-fu-sym]');
  if(fu){
    const s = fu.dataset.fuSym, q = fu.dataset.fuQ, v = fu.dataset.fuV;
    if(!state.bodyFollowups[s]) state.bodyFollowups[s] = {};
    state.bodyFollowups[s][q] = v;
    renderBodySheet(state.range.see); return;
  }

  /* 呼吸 */
  const bsym = e.target.closest('[data-breath-sym]');
  if(bsym){
    const v = bsym.dataset.breathSym;
    let arr = state.records.breath_symptom || [];
    if(v === '没有'){ arr = arr.includes('没有') ? [] : ['没有']; }
    else {
      if(arr.includes('没有')) arr = arr.filter(x=>x!=='没有');
      if(arr.includes(v)){ arr = arr.filter(x=>x!==v); delete state.breathFollowups[v]; }
      else { arr.push(v); }
    }
    state.records.breath_symptom = arr;
    renderBreathSheet(state.range.see); return;
  }
  const bfu = e.target.closest('[data-breath-fu-sym]');
  if(bfu){
    const s = bfu.dataset.breathFuSym, q = bfu.dataset.breathFuQ, v = bfu.dataset.breathFuV;
    if(!state.breathFollowups[s]) state.breathFollowups[s] = {};
    state.breathFollowups[s][q] = v;
    renderBreathSheet(state.range.see); return;
  }

  /* 环境 */
  const eexp = e.target.closest('[data-env-exp]');
  if(eexp){
    const v = eexp.dataset.envExp;
    let arr = state.records.env_exposure || [];
    if(v === '没有'){ arr = arr.includes('没有') ? [] : ['没有']; }
    else {
      if(arr.includes('没有')) arr = arr.filter(x=>x!=='没有');
      if(arr.includes(v)){ arr = arr.filter(x=>x!==v); delete state.envFollowups[v]; }
      else { arr.push(v); }
    }
    state.records.env_exposure = arr;
    renderEnvSheet(state.range.see); return;
  }
  const efu = e.target.closest('[data-env-fu-sym]');
  if(efu){
    const s = efu.dataset.envFuSym, q = efu.dataset.envFuQ, v = efu.dataset.envFuV;
    if(!state.envFollowups[s]) state.envFollowups[s] = {};
    state.envFollowups[s][q] = v;
    renderEnvSheet(state.range.see); return;
  }

  /* 通用单选/多选 */
  const rec = e.target.closest('[data-rec]');
  if(rec){
    const k = rec.dataset.rec, v = rec.dataset.val;
    const isMulti = rec.dataset.multi === '1';
    if(isMulti){
      let arr = state.records[k] || [];
      if(v==='没有' || v==='都没有' || v==='没吃'){ arr = arr.includes(v) ? [] : [v]; }
      else { arr = arr.includes(v) ? arr.filter(x=>x!==v) : [...arr.filter(x=>x!=='没有' && x!=='都没有' && x!=='没吃'), v]; }
      state.records[k] = arr;
    } else { state.records[k] = v; }
    if(k.startsWith('breath')){ renderBreathSheet(state.range.see); return; }
    if(k.startsWith('natural')){ renderEnvSheet(state.range.see); return; }
    const d3 = DIMS.find(x=>x.subj && x.subj.some(r=>r.k===k));
    if(d3){ openDimRecord(d3.k, state.range.see); }
    return;
  }

  /* 天/周/月/家庭判断 */
  const dy = e.target.closest('[data-day]');
  if(dy){ state.dayJudge[dy.dataset.day] = dy.dataset.val; openDay(); return; }
  const wk = e.target.closest('[data-week]');
  if(wk){ state.weekJudge[wk.dataset.week] = wk.dataset.val; openWeek(); return; }
  const mo = e.target.closest('[data-month]');
  if(mo){ state.monthJudge[mo.dataset.month] = mo.dataset.val; openMonth(); return; }
  const fa = e.target.closest('[data-fam]');
  if(fa){ state.familyJudge[fa.dataset.fam] = fa.dataset.val; openWeek(); return; }

  /* 基础资料 */
  const prof = e.target.closest('[data-prof]');
  if(prof){ state.profile[prof.dataset.prof] = prof.dataset.val; render(); return; }

  /* 微体检 */
  const qzS = e.target.closest('[data-qz-single]');
  if(qzS){ state.quizAns[qzS.dataset.qzSingle] = parseInt(qzS.dataset.val); renderQuiz(); return; }
  const qzM = e.target.closest('[data-qz-multi]');
  if(qzM){
    const k = qzM.dataset.qzMulti, v = qzM.dataset.val, excl = qzM.dataset.excl;
    let arr = state.quizAns[k] ? [...state.quizAns[k]] : [];
    const isE = excl && v === excl;
    if(arr.includes(v)) arr = arr.filter(x=>x!==v);
    else { if(isE) arr = [v]; else { arr = arr.filter(x=>x!==excl); arr.push(v); } }
    state.quizAns[k] = arr;
    renderQuiz(); return;
  }
  if(e.target.closest('[data-qz-prev]')){
    if(state.quizIndex>0){ state.quizIndex--; renderQuiz(); }
    return;
  }
  if(e.target.closest('[data-qz-next]')){
    const b = e.target.closest('[data-qz-next]');
    if(b.classList.contains('disabled')) return;
    if(state.quizIndex < QUIZ.length-1){ state.quizIndex++; renderQuiz(); }
    else { renderQuizResult(); }
    return;
  }

  /* 关闭 */
  if(e.target.closest('[data-close]') || e.target.id === 'modal'){ closeModal(); }
});

/* 日期输入 */
document.addEventListener('change', e=>{
  if(e.target.hasAttribute('data-manual-start')){
    const key = e.target.dataset.manualStart;
    let v = e.target.value;
    if(!v) return;
    if(v > state.manual[key].end) v = state.manual[key].end;
    state.manual[key].start = v;
    render();
  }
  if(e.target.hasAttribute('data-manual-end')){
    const key = e.target.dataset.manualEnd;
    let v = e.target.value;
    if(!v) return;
    if(v < state.manual[key].start) v = state.manual[key].start;
    state.manual[key].end = v;
    render();
  }
});

document.addEventListener('input', e=>{
  if(e.target.classList.contains('rec-note')){
    const nk = e.target.dataset.note;
    if(nk) state.records[nk + '_note'] = e.target.value;
  }
  if(e.target.hasAttribute('data-weight-input')){
    const v = parseFloat(e.target.value);
    if(v && v>20 && v<300){
      state.weight = v;
      document.querySelectorAll('.obj-row').forEach(row=>{
        const nm = row.querySelector('.obj-nm');
        if(nm && nm.textContent === 'BMI'){
          row.querySelector('.obj-val').textContent = calcBMI(v);
        }
      });
    }
  }
  if(e.target.hasAttribute('data-ob-input')){ state.ob[e.target.dataset.obInput] = e.target.value; }
  if(e.target.hasAttribute('data-prof-input')){
    const k = e.target.dataset.profInput;
    const v = parseFloat(e.target.value);
    if(!isNaN(v)) state.profile[k] = v;
  }
  /* 自然语言输入实时预览 */
  if(e.target.hasAttribute('data-nl-dim')){
    const k = e.target.dataset.nlDim;
    state.records['nl_'+k] = e.target.value;
    renderNlParsed(k);
  }
  /* 分享感受实时预览 */
  if(e.target.id === 'shareFeel'){
    state.shareFeel = e.target.value;
    const cnt = document.getElementById('shareFeelCount');
    if(cnt) cnt.textContent = e.target.value.length;
    refreshShareFeel();
  }
});

/* 启动 */
render();
</script>
</body>
</html>
