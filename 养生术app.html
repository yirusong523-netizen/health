<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宋博士养生术</title>
<style>
:root{
  --bg:#F4F5F3;
  --card:#FFFFFF;
  --line:#E5E7E3;
  --line-soft:#EFF1ED;
  --ink:#1B1E1C;
  --ink-2:#656C68;
  --ink-3:#9AA09C;
  --brand:#24594C;
  --brand-2:#1B463C;
  --brand-soft:#EBF1EF;
  --accent:#A67C3D;
  --danger:#B0433A;
  --danger-soft:#FAF0EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:#DDE0DC;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
     color:var(--ink);-webkit-font-smoothing:antialiased}
.phone{width:390px;height:800px;max-height:96vh;background:var(--bg);border-radius:28px;overflow:hidden;
       position:relative;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.22)}
.statusbar{height:24px;flex:0 0 auto;background:#fff;color:var(--ink-3);font-size:10.5px;
           display:flex;align-items:center;justify-content:space-between;padding:0 20px;letter-spacing:.4px}
.navbar{height:48px;flex:0 0 auto;background:#fff;color:var(--ink);font-size:15px;font-weight:600;
        display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line-soft);letter-spacing:.5px}
.content{flex:1 1 auto;overflow-y:auto;padding:16px 16px 28px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:0}
.page{display:none}
.page.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px;margin-bottom:14px}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:8px;letter-spacing:.3px}
.field>label i{color:var(--danger);font-style:normal;margin-left:2px}
.hint{font-weight:400;color:var(--ink-3);font-size:11px;margin-left:5px;letter-spacing:0}
input,textarea,select{width:100%;border:1px solid var(--line);background:#FCFCFB;border-radius:6px;
      padding:0 12px;height:42px;font-size:14px;outline:none;font-family:inherit;color:var(--ink);transition:.15s}
textarea{height:auto;min-height:80px;padding:11px 12px;resize:vertical;line-height:1.65}
input::placeholder,textarea::placeholder{color:#B9BEBA}
input:focus,textarea:focus,select:focus{border-color:var(--brand);background:#fff}
.row{display:flex;gap:10px;align-items:center}
.row select{width:108px;flex:0 0 auto}
.unit{font-size:13px;color:var(--ink-3);flex:0 0 auto}
.btn{width:100%;border:none;border-radius:6px;height:46px;font-size:15px;font-weight:600;
     cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:.15s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:active{background:var(--brand-2)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{height:38px;font-size:13.5px;font-weight:500;margin-top:14px}
.btn:disabled{opacity:.45;cursor:default}
.tip{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:12px;line-height:1.6}
.section-label{font-size:11.5px;color:var(--ink-3);letter-spacing:.6px;margin:0 0 12px 2px;font-weight:500}
.divider{height:1px;background:var(--line-soft);margin:18px 0}

.brand{text-align:center;padding:48px 0 32px}
.brand-mark{width:56px;height:56px;border-radius:6px;background:var(--brand);color:#fff;
      font-size:26px;font-weight:500;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.brand h1{font-size:20px;font-weight:600;letter-spacing:2px;margin-bottom:10px}
.brand-en{font-size:9.5px;color:var(--ink-3);letter-spacing:2.6px;font-weight:500}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:0 12px;height:32px;line-height:30px;border-radius:4px;background:#fff;color:var(--ink-2);
      font-size:12.5px;border:1px solid var(--line);cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
.chip:hover{border-color:#C9CFC9}
.chip.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand);font-weight:600}

.stars{display:flex;gap:8px;font-size:20px;color:#DCDEDA;line-height:1}
.star{cursor:pointer;transition:.1s}
.star.on{color:var(--accent)}

.upload{border:1px dashed #D3D8D3;border-radius:8px;padding:16px;background:#FAFAF9;text-align:center}
.upload-btns{display:flex;gap:10px}
.upload-btns button{flex:1;height:38px;border:1px solid var(--line);background:#fff;border-radius:6px;
      font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink-2);transition:.15s}
.upload-btns button:hover{border-color:var(--brand);color:var(--brand)}
.media-preview{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:flex-start}
.thumb-wrap{position:relative;width:60px;height:60px}
.thumb{width:60px;height:60px;border-radius:6px;object-fit:cover;background:#EEF0EE;border:1px solid var(--line);
       display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink-3);letter-spacing:1px}
.thumb-del{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);
     color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.media-row{display:flex;gap:8px;margin:0 0 14px}
.media-row .thumb{width:52px;height:52px}

.diff-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.diff-reason{font-size:11.5px;color:var(--ink-3);line-height:1.6;flex:1;min-width:140px}
.diff-reason b{color:var(--ink-2);font-weight:600}
.diff-reason a{color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:2px;margin-left:4px}
.ver-count-wrap{margin-top:12px;display:none;align-items:center;gap:10px}
.ver-count-wrap input{width:92px;height:38px}
.ver-count-wrap span{font-size:13px;color:var(--ink-3)}

/* 专家输入 */
.expert-wrap{margin-top:14px;display:none}
.expert-row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.expert-row input{height:38px;font-size:13px}
.expert-row select{width:74px;height:38px;flex:0 0 auto;font-size:12.5px}
.expert-del{flex:0 0 auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
            color:var(--danger);cursor:pointer;font-size:17px;line-height:1}

.tabbar{height:60px;flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line-soft)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
          font-size:10.5px;color:var(--ink-3);cursor:pointer;letter-spacing:.4px;transition:.15s}
.tab-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;
              stroke-linecap:round;stroke-linejoin:round}
.tab-item.on{color:var(--brand);font-weight:600}

.search-box{display:flex;align-items:center;gap:9px;background:#FAFAF9;border:1px solid var(--line);
            border-radius:6px;padding:0 12px;height:40px;margin-bottom:10px}
.search-box:focus-within{border-color:var(--brand);background:#fff}
.search-box svg{width:15px;height:15px;fill:none;stroke:var(--ink-3);stroke-width:1.7;stroke-linecap:round;flex:0 0 auto}
.search-box input{border:none;background:transparent;padding:0;height:100%;font-size:13.5px}
.search-box input:focus{background:transparent}
.search-box .clr{font-size:13px;color:#C4C9C4;cursor:pointer;padding:4px;flex:0 0 auto}
.hist-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.hist-label{font-size:10.5px;color:var(--ink-3);width:100%;margin-bottom:1px;letter-spacing:.5px}
.hist-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:4px;
           background:#F2F4F1;color:var(--ink-2);font-size:11.5px;cursor:pointer}
.hist-chip:hover{background:var(--brand-soft);color:var(--brand)}
.hist-chip b{font-weight:400;color:#C4C9C4;padding:0 1px;font-size:12px}
.hist-chip b:hover{color:var(--danger)}
.sel-count{font-size:11px;color:var(--brand);margin-bottom:9px;font-weight:500}
.no-result{font-size:12px;color:var(--ink-3);padding:4px 0}

.res-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 16px;margin-bottom:12px}
.res-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}
.res-name{font-size:16px;font-weight:600;line-height:1.4;letter-spacing:.2px}
.res-score{text-align:right;flex:0 0 auto;line-height:1}
.res-score b{font-size:22px;font-weight:600;color:var(--brand);font-variant-numeric:tabular-nums}
.res-score span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:5px;letter-spacing:1px}
.res-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:10.5px;padding:3px 7px;border-radius:3px;background:#F3F4F2;color:var(--ink-2);letter-spacing:.2px}
.tag.cat{background:#EDF1F7;color:#3E6091}
.tag.ver{background:#F8F1E7;color:#8A6528}
.tag.eff{background:var(--brand-soft);color:var(--brand)}
.bar{height:3px;background:#EDEFEC;border-radius:2px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:2px;transition:width .5s}
.bar i.bad{background:var(--danger)}
.warn{background:var(--danger-soft);color:var(--danger);font-size:12px;padding:10px 12px;border-radius:6px;
      margin-bottom:14px;line-height:1.6}
.kv{display:flex;gap:12px;font-size:13px;line-height:1.72;margin-bottom:7px}
.kv>span{flex:0 0 62px;color:var(--ink-3);font-size:12.5px}
.kv>p{flex:1;color:var(--ink)}

.profile{display:flex;align-items:center;gap:15px;background:var(--brand);color:#fff;
         padding:22px 18px;border-radius:10px;margin-bottom:14px}
.avatar{width:50px;height:50px;border-radius:6px;background:rgba(255,255,255,.16);
        display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:500}
.pname{font-size:17px;font-weight:600;letter-spacing:1px;margin-bottom:5px}
.profile .sub{font-size:11px;opacity:.72;letter-spacing:.3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px 6px;text-align:center}
.stat .num{font-size:19px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .lbl{font-size:10.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.3px}
.quota{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 16px;
       font-size:12.5px;color:var(--ink-2);margin-bottom:14px;line-height:1.7}
.list-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0;
           border-bottom:1px solid var(--line-soft)}
.list-item:first-child{padding-top:2px}
.list-item:last-child{border-bottom:none;padding-bottom:2px}
.list-item .t{font-size:14px;font-weight:500;line-height:1.5}
.list-item .sub{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.6}
.list-item .quote{font-size:11.5px;color:var(--ink-2);margin-top:6px;padding-left:9px;
                  border-left:2px solid var(--line);line-height:1.6}
.mini-btn{flex:0 0 auto;height:30px;padding:0 13px;border:1px solid var(--brand);background:#fff;
          color:var(--brand);border-radius:4px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.mini-btn:hover{background:var(--brand-soft)}
.badge{flex:0 0 auto;font-size:10.5px;color:#8A6528;background:#F8F1E7;padding:3px 8px;border-radius:3px}
.empty{text-align:center;color:var(--ink-3);font-size:12.5px;padding:30px 0}

.modal-mask{position:absolute;inset:0;background:rgba(20,24,22,.42);display:none;
            align-items:flex-end;z-index:100;backdrop-filter:blur(1px)}
.modal-mask.show{display:flex}
.modal{width:100%;background:#fff;border-radius:14px 14px 0 0;padding:24px 20px 28px;animation:up .24s ease}
@keyframes up{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:6px;letter-spacing:.3px}
.modal .m-sub{font-size:11.5px;color:var(--ink-3);margin-bottom:22px;line-height:1.6}
.modal .m-label{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:10px;letter-spacing:.3px}
.m-actions{display:flex;gap:10px;margin-top:20px}

.toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,10px);background:rgba(27,30,28,.92);
       color:#fff;padding:11px 18px;border-radius:6px;font-size:12.5px;opacity:0;pointer-events:none;
       transition:.25s;z-index:120;max-width:82%;text-align:center;line-height:1.6;letter-spacing:.3px}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="phone">

  <div class="statusbar"><span>9:41</span><span>5G&nbsp;&nbsp;100%</span></div>
  <div class="navbar" id="navbar">宋博士养生术</div>

  <div class="content" id="content">

    <!-- ============ 登录 ============ -->
    <section class="page active" id="page-login">
      <div class="brand">
        <div class="brand-mark">养</div>
        <h1>宋博士养生术</h1>
        <p class="brand-en">SONG HEALTH · WELLNESS LIBRARY</p>
      </div>
      <div class="card">
        <div class="field"><label>姓名 / 昵称 <i>*</i></label>
          <input id="lgName" placeholder="请输入"></div>
        <div class="field"><label>年龄 <i>*</i></label>
          <input id="lgAge" type="number" placeholder="请输入年龄"></div>
        <div class="field"><label>密码 <i>*</i></label>
          <input id="lgPwd" type="password" placeholder="首次登录即注册"></div>
        <button class="btn primary" onclick="doLogin()">进入</button>
        <p class="tip">首次登录自动创建账号<br>年龄每年 1 月 1 日系统自动 +1</p>
      </div>
    </section>

    <!-- ============ 我有妙招 ============ -->
    <section class="page" id="page-add">
      <div class="card">
        <div class="field"><label>妙招名称 <i>*</i></label>
          <input id="fName" placeholder="如：睡前艾叶泡脚" oninput="refreshDifficulty()"></div>

        <div class="field"><label>提供人</label>
          <input id="fProvider" placeholder="默认上次输入"></div>

        <div class="field"><label>发明人</label>
          <input id="fInventor" placeholder="如：民间流传 / 张大爷"></div>

        <div class="field"><label>发明人寿命</label>
          <div class="row">
            <select id="fInvStatus">
              <option value="alive" selected>健在</option>
              <option value="deceased">已去世</option>
            </select>
            <input id="fInvAge" type="number" placeholder="年龄">
            <span class="unit">岁</span>
          </div>
        </div>

        <div class="field"><label>方法 <i>*</i></label>
          <textarea id="fMethod" placeholder="请详细描述操作步骤，系统将自动评估难度" oninput="refreshDifficulty()"></textarea></div>

        <div class="field"><label>图片 / 视频<span class="hint">展示操作过程，增强可信度</span></label>
          <div class="upload">
            <input type="file" id="fImages" accept="image/*" multiple hidden>
            <input type="file" id="fVideo" accept="video/*" hidden>
            <div class="upload-btns">
              <button type="button" onclick="document.getElementById('fImages').click()">选择图片</button>
              <button type="button" onclick="document.getElementById('fVideo').click()">选择视频</button>
            </div>
            <div class="media-preview" id="mediaPreview"></div>
          </div>
        </div>

        <div class="field"><label>剂量</label>
          <input id="fDose" placeholder="如：20分钟 / 30次"></div>

        <div class="field"><label>频率</label>
          <input id="fFreq" placeholder="如：每天1次"></div>

        <!-- 症状：搜索式，不展示全量标签 -->
        <div class="field">
          <label>针对症状 <i>*</i><span class="hint">输入搜索，回车可添加自定义症状</span></label>
          <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            <input id="fSymSearch" placeholder="如：夜尿 / 腰膝 / 失眠" oninput="renderAddSymptomPicker()" onkeydown="onAddSymptomKey(event)">
            <span class="clr" onclick="clearAddSymptom()">×</span>
          </div>
          <div class="sel-count" id="fSymSelCount"></div>
          <div class="chips" id="fSymptoms"></div>
        </div>

        <!-- 禁忌：仅展示常用几个 -->
        <div class="field"><label>禁忌<span class="hint">常用项，可多选</span></label>
          <div class="chips" id="fContra"></div></div>

        <div class="field"><label>知识 / 原理</label>
          <textarea id="fKnowledge" placeholder="对应的知识或原理"></textarea></div>

        <div class="field"><label>难度 <span class="hint">系统自动评估，可手动调整</span></label>
          <div class="diff-box">
            <div class="stars" id="fDifficulty"></div>
            <div class="diff-reason" id="diffReason">填写方法后自动评估</div>
          </div>
        </div>

        <div class="field"><label>分类 <i>*</i></label>
          <div class="chips" id="fCategory"></div></div>

        <!-- 验证程度 -->
        <div class="field"><label>验证程度 <span class="hint">人数越多越可信</span></label>
          <div class="chips" id="fVerification"></div>

          <!-- 多人验证人数 -->
          <div class="ver-count-wrap" id="verCountWrap">
            <span>验证人数</span>
            <input id="fVerCount" type="number" min="2" value="3">
            <span>人</span>
          </div>

          <!-- 专家列表：名称 + 职称 -->
          <div class="expert-wrap" id="expertWrap">
            <div id="expertList"></div>
            <button type="button" class="btn ghost sm" onclick="addExpert()">+ 添加专家</button>
          </div>
        </div>

        <div class="field" id="fScoreWrap"><label>我的评价</label>
          <div class="stars" id="fMyScore"></div></div>

        <div class="field"><label>来源</label>
          <div class="chips" id="fSource"></div>
          <input id="fSourceDetail" placeholder="书名 / 链接备注" style="margin-top:10px">
        </div>

        <button class="btn primary" onclick="submitTechnique()">提交妙招</button>
        <p class="tip" id="addQuotaTip">今日还可添加 10 个</p>
      </div>
    </section>

    <!-- ============ 我要选用 ============ -->
    <section class="page" id="page-use">
      <div class="card">
        <div class="row">
          <div class="field" style="flex:1;margin-bottom:0"><label>姓名 / 昵称</label>
            <input id="uName" placeholder="默认本人"></div>
          <div class="field" style="flex:1;margin-bottom:0"><label>年龄</label>
            <input id="uAge" type="number" placeholder="年龄"></div>
        </div>
        <p class="tip" style="text-align:left;margin:12px 0 0">帮他人查找时，可直接修改姓名和年龄</p>

        <div class="divider"></div>

        <div class="field">
          <label>我的症状 <i>*</i><span class="hint">可搜索、可多选</span></label>
          <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            <input id="uSymSearch" placeholder="搜索症状，如 夜尿 / 腰膝" oninput="renderSymptomPicker()" onkeydown="onSearchKey(event,'symptom')">
            <span class="clr" onclick="clearSearch('uSymSearch','symptom')">×</span>
          </div>
          <div class="hist-wrap" id="symHist"></div>
          <div class="sel-count" id="symSelCount"></div>
          <div class="chips" id="uSymptoms"></div>
        </div>

        <div class="field">
          <label>我的禁忌<span class="hint">可搜索、可多选，用于安全过滤</span></label>
          <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            <input id="uConSearch" placeholder="搜索禁忌，如 糖尿病 / 抗凝" oninput="renderContraPicker()" onkeydown="onSearchKey(event,'contraindication')">
            <span class="clr" onclick="clearSearch('uConSearch','contraindication')">×</span>
          </div>
          <div class="hist-wrap" id="conHist"></div>
          <div class="sel-count" id="conSelCount"></div>
          <div class="chips" id="uContra"></div>
        </div>

        <button class="btn primary" onclick="doRecommend()">智能匹配</button>
        <p class="tip" id="useQuotaTip">今日还可选用 3 个</p>
      </div>
      <div id="resultWrap"></div>
    </section>

    <!-- ============ 我的记录 ============ -->
    <section class="page" id="page-me">

const HIST_MAX = 10;

function getHist(t){ try{ return JSON.parse(localStorage.getItem(histKey(t)) || '[]'); }catch(e){ return []; } }
function pushHist(t, kw){
  kw = (kw || '').trim(); if(!kw) return;
  const arr = getHist(t).filter(x => x !== kw);
  arr.unshift(kw);
  try{ localStorage.setItem(histKey(t), JSON.stringify(arr.slice(0, HIST_MAX))); }catch(e){}
  renderHist(t);
}
function delHist(t, kw){
  const arr = getHist(t).filter(x => x !== kw);
  try{ localStorage.setItem(histKey(t), JSON.stringify(arr)); }catch(e){}
  renderHist(t);
}
function renderHist(t){
  const box = $(t === 'symptom' ? 'symHist' : 'conHist');
  const arr = getHist(t);
  if(!arr.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<span class="hist-label">最近搜索</span>' + arr.map(k =>
    `<span class="hist-chip" onclick="useHist('${t}','${escapeAttr(k)}')">${k}

}

function renderChips(id, list, set, labelFn){
  $(id).innerHTML = list.map(v =>

}
function bindChipGroup(id, set, multi, onChange){
  $(id).addEventListener('click', e => {
    const chip = e.target.closest('.chip'); if(!chip) return;
    const v = chip.dataset.v;
    if(multi){ set.has(v) ? set.delete(v) : set.add(v); }
    else { set.clear(); set.add(v); }
    [...$(id).children].forEach(c => c.classList.toggle('on', set.has(c.dataset.v)));
    onChange && onChange();
  });
}

  if(!list.length){
    el.innerHTML = kw ? `<span class="no-result">没有匹配项，回车可添加「${kw}」</span>` : '';
  } else {
    el.innerHTML = list.map(v =>

  }
  $('fSymSelCount').textContent = set.size ? `已选 ${set.size} 项` : '';
}

/* ================= 难度自动评估 ================= */
function autoEvaluateDifficulty(method, name, category){
  if(!method || !method.trim()) return { level:3, reason:'未填写方法，默认中等难度' };
  const text = (method || '') + (name || '');
  let score = 0; const details = [];

  const len = method.trim().length;
  if(len > 100){ score += 1.8; details.push('描述详尽'); }
  else if(len > 50){ score += 1.2; details.push('描述较详'); }
  else score += 0.5;

  const steps = method.split(/[。；;.!?！？]/).filter(s => s.trim().length > 1).length;
  score += Math.min(steps * 0.4, 1.6);
  if(steps >= 3) details.push(`${steps}个步骤`);

  const hard = ['艾灸','明火','针','拔罐','刮痧','器械','仪器','设备','加热','煮沸','熬','煎','熏','烫','切割','测量'];
  const mid  = ['穴位','按压','揉捏','推拿','拉伸','锻炼','运动','泡','敷','煮','冲泡','炖'];
  let hc = 0, mc = 0;
  hard.forEach(w => { if(text.includes(w)){ score += 1.0; hc++; } });
  mid.forEach(w => { if(text.includes(w)){ score += 0.35; mc++; } });
  if(hc) details.push(`${hc}项高难操作`);
  if(mc) details.push(`${mc}项中等操作`);

  const adj = {'运动':0.6,'食补':0.1,'穴位按摩':-0.4,'药品药材':0.9,'器材':1.6,'环境':-0.6,'其它':0};
  if(category){ score += adj[category] || 0; details.push(category); }

  let level = Math.round(score / 1.3) + 1;
  level = Math.max(1, Math.min(5, level));
  return { level, reason: details.join(' · ') || '综合评估' };
}
function refreshDifficulty(){

  const r = autoEvaluateDifficulty(val('fMethod'), val('fName'), [...addState.category][0]);
  addState.difficulty = r.level;

  $('diffReason').innerHTML = `自动评估 <b>${r.level} 星</b> · ${r.reason} <a onclick="reenableAutoDiff()">重新评估</a>`;
}

/* ================= 推荐算法 ================= */
const W = { symptom:0.40, verify:0.18, rating:0.12, difficulty:0.10, heat:0.08, effect:0.12 };
const V_SCORE = { '未验证':0.15, '个人验证':0.45, '多人验证':0.75, '专家验证':1.0 };
function avgExperience(t){
  const arr = (t.experiences || []).map(e => e.score);
  return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
}
function recommend(symptoms, contra, topN = 3){
  return state.techniques.map(t => {
    const hit = t.symptoms.filter(s => symptoms.includes(s));
    const conflict = t.contra.filter(c => contra.includes(c));
    const coverage = symptoms.length ? hit.length / symptoms.length : 0;
    const breadth = t.symptoms.length ? Math.min(hit.length / t.symptoms.length * 2, 1) : 0;
    const sm = 0.7 * coverage + 0.3 * breadth;
    const vs = V_SCORE[t.verification] ?? 0.15;
    const rs = Math.max(0, (t.rating - 1) / 4);
    const ds = (5 - t.difficulty) / 4;
    const hs = Math.min(t.useCount / 1000, 1);
    const avgEff = avgExperience(t);
    const es = avgEff ? (avgEff - 1) / 4 : 0.35;

    let score = W.symptom * sm + W.verify * vs + W.rating * rs + W.difficulty * ds + W.heat * hs + W.effect * es;
    if(!hit.length) score *= 0.25;
    if(conflict.length) score *= 0.05;
    return { ...t, _score:score, _hit:hit, _conflict:conflict, _avgEff:avgEff };
  }).sort((a, b) => b._score - a._score).slice(0, topN);
}
function verTag(t){
  const n = t.validations.length;
  if(t.verification === '专家验证'){
    const names = t.validations.slice(0, 2)
      .map(v => v.title ? `${v.name}（${v.title}）` : v.name).join('、');
    return `专家验证 ${n} 人${names ? ' · ' + names + (n > 2 ? ' 等' : '') : ''}`;
  }
  return {
    '多人验证': `多人验证 ${n} 人 · 均${t.rating}分`,
    '个人验证': `个人验证 ${n} 人 · ${t.rating}分`,
    '未验证':   `未验证 0 人`
  }[t.verification] || t.verification;
}

  renderChips('fSource', SOURCES, addState.source);
  bindChipGroup('fCategory', addState.category, false, refreshDifficulty);
  bindChipGroup('fSource', addState.source, false);
  bindChipGroup('fVerification', addState.verification, false, () => {
    const v = [...addState.verification][0];
    $('fScoreWrap').style.display = v === '个人验证' ? 'block' : 'none';
    $('verCountWrap').style.display = v === '多人验证' ? 'flex' : 'none';
    $('expertWrap').style.display = v === '专家验证' ? 'block' : 'none';
  });

  // 专家列表
  renderExpertList();

  // 难度 / 我的评分
  $('fDifficulty').addEventListener('click', e => {
    const s = e.target.closest('.star'); if(!s) return;
    autoDiffEnabled = false;
    addState.difficulty = +s.dataset.i;
    paintDiffStars();
    $('diffReason').innerHTML =
      `手动设置 <b>${addState.difficulty} 星</b> <a onclick="reenableAutoDiff()">恢复自动评估</a>`;
  });
  $('fMyScore').addEventListener('click', e => {
    const s = e.target.closest('.star'); if(!s) return;
    addState.myScore = +s.dataset.i;
    paintMyScoreStars();
  });

  bindMediaUpload();

  // 我要选用 —— 可搜索选择器
  bindPicker({ inputId:'uSymSearch', chipsId:'uSymptoms', countId:'symSelCount',
               dict:SYMPTOMS, set:useStateForm.symptoms, histType:'symptom' });
  bindPicker({ inputId:'uConSearch', chipsId:'uContra', countId:'conSelCount',
               dict:CONTRA_LIST, set:useStateForm.contra, histType:'contraindication' });
  renderSymptomPicker();
  renderContraPicker();

  // 评价弹层
  $('fbStars').addEventListener('click', e => {
    const s = e.target.closest('.star'); if(!s) return;
    fbScore = +s.dataset.i; paintFbStars();
  });

  paintDiffStars(); paintMyScoreStars(); updateQuotaTips();
}
init();
</script>
</body>
</html>
